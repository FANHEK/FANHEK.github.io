tion\":{\"version\":\"3.x\",\"isVerified\":false},\"category\":\"ornament\",\"title\":\"逆证之枝\",\"visualDescription\":\"头饰与法杖由分叉树枝、眼睛和刻痕组成，线条不求完全对称。\",\"culturalOrigin\":\"知识树、哲学论辩和神谕裂隙。\",\"meaning\":[\"分叉表示问题永远存在多个入口。\",\"眼睛符号把观察转成一种审判。\"],\"palette\":[\"#79c9aa\",\"#d8f2e9\",\"#25453d\",\"#d2b56b\"],\"sourceIds\":[\"prototype-source-placeholder\"]},{\"id\":\"anaxa-index-tome\",\"verification\":\"$c:props:record:designMotifs:0:verification\",\"category\":\"material\",\"title\":\"索引法典\",\"visualDescription\":\"书页、标签和观测仪嵌入服装，冷绿色晶体作为知识能量核心。\",\"culturalOrigin\":\"学者长袍、图书馆索引和理性火炬。\",\"meaning\":[\"书的体积让角色像携带一座可移动档案馆。\",\"晶体将抽象知识转化成可被攻击和衡量的对象。\"],\"palette\":[\"#79c9aa\",\"#fff3d3\",\"#1d3e37\",\"#87a8ff\"],\"sourceIds\":[\"prototype-source-placeholder\"]},{\"id\":\"anaxa-verdigris\",\"verification\":\"$c:props:record:designMotifs:0:verification\",\"category\":\"color\",\"title\":\"铜绿与墨绿\",\"visualDescription\":\"主色偏冷绿，金色只用于书页边和制度性纹章，暗部接近黑绿。\",\"culturalOrigin\":\"氧化的青铜学器、树皮和旧书封面。\",\"meaning\":[\"铜绿让知识显得古老但并不安分。\",\"墨绿提供高度阅读性，也避免落入纯学院蓝。\"],\"palette\":[\"#79c9aa\",\"#e8f4df\",\"#17332e\",\"#b8934d\"],\"sourceIds\":[\"prototype-source-placeholder\"]}],\"relations\":[],\"media\":{\"portrait\":{\"src\":\"/art/anaxa.webp\",\"alt\":\"那刻夏角色立绘\"},\"splashArt\":{\"src\":\"/art/anaxa.webp\",\"alt\":\"那刻夏超高清立绘\"},\"divineCard\":{\"src\":\"/art/divine/anaxa.webp\",\"alt\":\"那刻夏神性铭牌\",\"width\":645,\"height\":1135,\"placeholder\":\"empty\"},\"skillAnimations\":[],\"idleVoice\":[],\"storyVoice\":[],\"ambientVoice\":[],\"gallery\":[]}},\"profile\":{\"name\":\"那刻夏\",\"title\":\"学者叩问预言\",\"rarity\":5,\"city\":\"神悟树庭\",\"divinePower\":\"「裂分之枝，瑟希斯」\",\"combatRole\":\"可为敌方群体快速添加大量弱点的输出型角色\",\"quote\":\"若神谕不可质疑，那它便不配被称为真理。\",\"stories\":{\"detail\":\"神悟树庭，滋养知识的学府，诞育哲人的摇床。\\n但渎神的阿那克萨戈拉斯，诘问「理性」火种的黄金裔，试问：你甘愿身负恶名，也要违逆预言，将怀疑的枝杈刺入智慧的圣树？\\n——「可笑。这世界遍地虚假，唯有我才是真实。」\",\"part1\":\"「呀，你出生于一座偏远城邦。父母早早离去，唯有姐姐与你相依为命、靠着驯养动物的微薄薪酬养家糊口。\\n你从小就孤僻离群。当同龄人都在草地上嬉闹时，只有你躲进树影里，拾起地上的落叶。\\n『大地兽为何不能飞向天空？』\\n你看着身边那头伴你成长的大地兽，喃喃自语。\\n『因为这大地兽前世也是个书呆子吧！』\\n你听多了这样的话语，但从不理解为何那是一种嘲笑。\\n『神明若是无所不能，为何还会害怕死亡？』\\n在领读圣训的神殿，那些理所当然的事情总会让你质疑。\\n『出去，阿那克萨戈拉斯！』\\n气急败坏的祭司常常将你赶出大殿。\\n姐姐从未责怪你，反而从不多的收入中挤出一部分买了你渴盼已久的图书和工具。\\n小小的螺丝，沉重的钳子，轻灵的天平…你在家中摆弄着这些仪器，全身心沉浸在创造的喜悦里。\\n五岁的你总是对生命有着无穷的好奇，自动歌唱的机械鸟，大地兽孵化器、永远鲜艳的人造花——你大言不惭地说要成为知识最渊博的人，啧啧啧，孩子的豪言壮语能得到家人的认真对待，可真是难得呐。\\n后来，她从往来的商人那听说，有一座名叫神悟树庭的学园，是追求智慧的圣地。你暗暗记住了这个名字，心想以后要能和姐姐一块去那儿，生活就不用那么辛苦。\\n再后来，她终于筹满了路费和盘缠，请求行商的朋友捎你一程，前往树庭求学。\\n行至半路，听闻黑潮来袭，你急匆匆赶回，那被侵蚀的废墟真是不忍目视呐…骄傲如你，竟然也有跪在地上的时候，你不会是在祈求神……」\\n「别再翻我的脑子了，顽劣的泰坦。」\\n男人从回忆中回过神来，那说不清是愤怒还是哀伤的情绪在右眼中一闪而逝。\",\"part2\":\"编号：13\\n课题：黄金裔的金血实验\\n材料：本人血液\\n记录：提纯后的液体状如流动黄金，透镜下显现种子状的结构，取血其间共计晕倒三次。\\n……\\n编号：55\\n课题：泰坦造物的灵魂解剖\\n材料：三只濒死的██泰坦造物，水银药剂，安提灵花提取物\\n记录：实验对象在解剖至核心时突然发狂，还好，本人只受重伤，未伤及他人。后续改进炼金器具。██泰坦的灵魂谱系图接近完成。\\n……\\n编号：144\\n课题：灵魂融合的中期尝试\\n材料：学者捐献的灵魂之火，泰坦造物\\n记录：████，可敬的友人，按照你的遗愿，你的身躯将化为烧却刑柱的火焰，你的灵魂将成为人类解析泰坦的柱石！\\n……\\n*最后一页凌乱的批注*：\\n那件事已过去数年，死亡的阴冷依然盘旋在左眼，但我看见了人类的「灵魂」，那份滚烫足够填补空荡。\\n也许是明天，也许是明年，也许就在下一刻——\\n我将被指控，将被抓捕。总有人想让我低头，让我沉默。\\n但姐姐，我一直记得，我在这里见了你最后一面。你什么都没说。\\n但这样就足够了，我知道自己做了正确的事。\\n这十数年，一直如此——\\n「所有『错误』的尝试，都是更接近『正确』的一步。」\\n——那刻夏的灵魂学实验日志，原件已被销毁\",\"part3\":\"「树庭诸贤人：\\n关于某些学者指控我『学术诽谤』、『败坏青年』、『不信神明』三大罪名，我无意奉陪这些拙劣的把戏，也不屑为自己辩护。不过，考虑到这能让诸位深入了解我的研究，我不妨简单说说。\\n学术诽谤之罪，据他们所言，是我在课堂上公开诋毁经典的泰坦学与灵魂学研究，称其为『学术界的黑潮』。请问：评价是否有错？一门研究泰坦能不能站在一根针尖上的学科，以及一门主张灵魂本质为水的学科，因某些权威的坚持存活至今，和精神黑潮何异？\\n我自小在树庭求学，深知只有批判和怀疑才能掀起思想的变革。我鼓励学生挑战我的权威，这就是他们称之为『毒害青年』的方式。以白厄和遐蝶为例，两人初入学时，对如何思考，何谓逻辑一无所知，看看他们现在，有时都能将我驳得哑口无言！如果说这是『毒害』青年，我难以想象他们所谓的『正确教育』指的是什么。\\n正因此，某些人指控我和参与逐火的黄金裔过从甚密，宣称我的理论为他们提供夺取火种的支持。是啊，我曾经向缇里西庇俄丝请教过失落的历史，我那两位最优秀的学生正巧也是黄金裔，这又如何？\\n我也是他们所谓的黄金裔，但我从不迷信神谕。如果神是超脱人世的至纯粹、至永恒之物，那么听好了，世上有且只有一个神，那就是无法毁灭的真理！\\n只有真理的信徒才会在这条道路上前仆后继，而以智者自诩的权威们如此恐惧神明的坍塌。\\n你们建议双方在瑟希斯见证下各退一步以缓和事态…抱歉，我毫无此意。相反，我想给指控我的诸位一句忠告——\\n未来的世界会了解我，而你们对我宣读指控，将比聆听判词的我还要恐惧！」\\n——那刻夏于一次贤人会上的即兴申辩\",\"part4\":\"「时至今日，我也未曾认同那神神叨叨的逐火之旅。但唯有一句话令我印象深刻——逐火是不断失却的旅途。\\n我从来不信黄金裔拥有相同的宿命，但毫无疑问，我也同样走在失却的道路上。\\n只是我失去的还不够…和我追求的东西相比，远不够满足等价交换的法则。\\n从提出泰坦与人的灵魂本质无异，灵魂由智种构成的理论后，我一直在等待一个彻底证实它的机会…\\n现在，这个机会终于来了！来得有些猝不及防，却也恰如其分。\\n今天，我终于能弥补多年前一场相似的灾难留下的遗憾。\\n我从死亡中得到灵感，也该如此偿还\\n——我的身躯将作熔炼神明火种的容器，我的灵魂将成逼迫神明低头的枷锁，成就吾之理论的终极证明！\\n现在的我无比快乐。\\n第一次造出能飞上天空的机械鸟，我曾这样笑着。第一次孵化出新生命时，我的双手曾这样颤抖。\\n后来的学子，倘若你看到这番话语，证明我已功败垂成，倒在黎明之前。\\n尽情使用我的成果，把我当作研究的对象！踏过我的身体，接过我的火把，把我当作照亮真理的薪柴投入燃烧的火焰！\\n不要害怕亵渎——\\n跨越神明本是禁忌，成为神明那又如何！」\\n——树庭沦落后那刻夏记忆的回声之一，因无人发现而消散\"},\"relations\":[{\"targetId\":\"5205\",\"targetName\":\"开拓者\",\"targetRouteId\":\"\",\"relation\":\"黄金裔的同盟\",\"description\":\"致开拓者： 借由诸位之力，我已完成此世最伟大的课题，表演本可落幕—— 但在那安提基色拉人的脑中，我看到了世外无垠的知识。 在最后的舞台上，我看到你们实现了扭转命运的奇迹。 正是这些我仍不解的秘密，解开了将世界困囿的谜题， 使人在黑暗中的不竭摸索，不至于沦为徒劳。 故：我已目睹洞穴之外的真实，便不可停止求索。 无论翁法罗斯继续以何种形式存续， 我都将延续「理性」，直至重拾真理， 将那更为神圣、宏伟之物再度超越、亵渎！ 你大可以把这枚贤者之石视作我对你的嘉奖， 我希望你珍重这枚包含此世一切智慧的炼金奇迹， 但若遇到实在讲不通道理的蠢材，就用它的坚硬给予他启明吧。 阿那克萨戈拉斯\",\"avatar\":\"https://act-upload.mihoyo.com/sr-wiki/2025/05/12/193706962/b8a39b3ab7c81ed8e88ca43d6be2f88f_8788668609774406579.png\"},{\"targetId\":\"5851\",\"targetName\":\"昔涟\",\"targetRouteId\":\"cyrene\",\"relation\":\"共同拯救翁法罗斯的伙伴\",\"description\":\"「由她书写的千万道的记忆，也该让那虚伪的神明明白——至少，『我们为何物』的解答，轮不到它凭空杜撰。」\",\"avatar\":\"https://act-upload.mihoyo.com/sr-wiki/2025/10/24/276833758/e9ed857da6708dab40ec97b9d22343b5_5036078703727400193.png\"}],\"gallery\":[{\"src\":\"/gallery/anaxa/1.webp\",\"alt\":\"那刻夏官方画廊 1\",\"width\":2048,\"height\":2048,\"category\":\"角色立绘\"},{\"src\":\"/light-cones/anaxa.webp\",\"alt\":\"那刻夏专属光锥 生命当付之一炬\",\"width\":864,\"height\":1220,\"category\":\"光锥立绘\",\"sourceUrl\":\"https://bbs.mihoyo.com/sr/wiki/content/5289/detail?bbs_presentation_style=no_header\"},{\"src\":\"/gallery/anaxa/3.webp\",\"alt\":\"那刻夏官方画廊 3\",\"width\":2275,\"height\":1280,\"category\":\"游戏CG\"},{\"src\":\"/gallery/anaxa/4.webp\",\"alt\":\"那刻夏官方画廊 4\",\"width\":2275,\"height\":1280,\"category\":\"游戏CG\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"conten
