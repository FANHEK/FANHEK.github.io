信具有神谕重量。\",\"小面积高饱和色让角色在群体画面里保持可识别。\"],\"palette\":[\"#e95e4c\",\"#f3c77b\",\"#57243a\",\"#f7e9dc\"],\"sourceIds\":[\"prototype-source-placeholder\"]}],\"relations\":[],\"media\":{\"portrait\":{\"src\":\"/art/tribbie.webp\",\"alt\":\"缇宝角色立绘\"},\"splashArt\":{\"src\":\"/art/tribbie.webp\",\"alt\":\"缇宝超高清立绘\"},\"divineCard\":{\"src\":\"/art/divine/tribbie.webp\",\"alt\":\"缇宝神性铭牌\",\"width\":645,\"height\":1135,\"placeholder\":\"empty\"},\"skillAnimations\":[],\"idleVoice\":[],\"storyVoice\":[],\"ambientVoice\":[],\"gallery\":[]}},\"profile\":{\"name\":\"缇宝\",\"title\":\"信使穿梭万径\",\"rarity\":5,\"city\":\"雅努萨波利斯，奥赫玛\",\"divinePower\":\"「万径之门，雅努斯」\",\"combatRole\":\"展开结界增益我方的辅助型角色\",\"quote\":\"门后若是风暴，就先让我把信送到。\",\"stories\":{\"detail\":\"自那三相神谕垂怜的圣地，信使分作千身，启程远行。\\n雅努萨波利斯的圣女，缇里西庇俄丝，窃夺「门径」火种的黄金裔，要为众生奔走，令救世的讯息晓喻大地\\n——找寻那流淌黄金神血的人子，冲破世间至暗，去往星月满天的明日。\",\"part1\":\"「▇▇▇月▇▇日\\n逃离雅努萨波利斯，至今已有十年。\\n十年时光，*我们*以脚步丈量大地，不知不觉间已将翁法罗斯走遍。\\n黑潮的发展比想象的更严重。自西至东，自南向北，甚至连高居天空的城邦也无法幸免于难…*我们*看着边境的蕞尔小国在一朝一夕间便被疯涨的黑潮吞噬，将生灵化作它的养料，随后以更加迅猛的姿态向前推进…翁法罗斯辉煌的往日不复存在，到处是触目惊心的腐坏，泰坦疯狂，英雄陨落，人民流离失所。\\n但醉心于纷争的人们看不到。\\n不久之前，黑潮已然迫近内陆。那里的城邦富庶，彼此之间交通发达，商业繁盛，但有人将*我们*的预言视为狂妄的戏言，有人将*我们*视作口吐不祥之语的祭司，无人聆听，无人驻足…如若一定要流下滚烫的血才能使众人团结，从*我们*开始又何妨？\\n缇▇呵，我知道你已飞向黑潮的前线，送回了最新的消息，却身中黑潮造物的利箭死去。\\n缇▇呵，我知道你掩护难民离开，却遭到贵族的仇视，在刺客的匕首下奄奄一息。\\n缇▇呵，我知道你护送迷失的孩童，只差一步便能抵达安全之所。那明丽的发辫浸没在血泊之中，*我们*再也不能为你编织，为你梳洗。\\n一座又一座城邦的陷落，使世人从无休止的内战中抬起头来，看清这世界濒临毁灭的面貌。\\n羔羊的鲜血不会白流，我等在一片荆棘踏出最初的路，希冀后来的人，比*我们*行向更远……」\\n——一篇年代久远的日记\\n纸张已薄如蝉翼，由缇安放在一个娃娃的怀中\",\"part2\":\"「▇▇▇月▇▇日\\n『圣女呵，我们愿意倾听，在末世为我们指引方向吧，替我们祈祷战争的胜利吧。』那些王说。\\n王们为*我们*恢复了雅努斯圣女的身份，他们将*我们*奉上神坛，绸缎加身，以仪式遮掩*我们*的面容。\\n然而*我们*并未重返城中，而是居住在高高在上的王城。*我们*想替生病的农人与流离的战士祈祷，为悲伤的人排解心中的痛苦，为迷茫的人指点迷津，为新人送上祝福，看着他们围着火堆歌唱。\\n然而王并不愿意*我们*来到民众之中，就像在雅努萨波利斯那时一样……\\n母亲啊，此刻*我们*才真正理解你当时的苦闷无助。*我们*曾相信，神谕当使那些王者尽弃前嫌，联手寻找黄金裔，如此，救世才有一线希望。可他们害怕流着黄金血的人剥夺他们的权力，他们想要的，是一场又一场以神谕为名的战争。那些来之不易的信任，那些民众期待的目光，正在一点一点消磨殆尽。\\n雅努斯的火种越来越灼热，金色的神谕仍旧审视着*我们*，催促着*我们*。\\n*我们*决定逃离。\\n缇▇和缇安张开百界门，约定在密林中汇合，却遭遇了如雨毒箭，缇安躲过一劫，却不幸被士兵挟持，离*我们*越来越远。\\n缇▇选择主动撞向敌人的长枪，死死拉住了想要抽回武器的士兵。可*我们*错估了王的残忍，即便死去，*我们*也不能被其他城邦得到。\\n……\\n数十倍于往常的痛楚加诸于吾身。这个春天，*我们*中的大部分永远留在了鲜花尚未盛开的荒原。\\n再见，缇▇。\\n再见，缇▇。\\n再见，缇▇。\\n……\\n缇安，*我们*还不想和你说再见，请一定要找到*我们*……\\n今夜，*我们*就能穿过这片荒野。」\\n——缇宁保存着的一篇日记\\n上面画着划过天空的流星\",\"part3\":\"「▇▇▇月▇▇日\\n我们初见阿雅的时候，她说喜欢缇里西庇俄丝这个名字，听起来又高贵又美丽，就像她编织的衣服。我们问她，就为了这个把我们留下？她摇摇头，说，主要是想听老师每天晚上讲故事。\\n当时阿雅也是个姑娘，又怕黑又怕鬼，想到她嘴馋了还要拉上我们偷偷去厨房吃晚上剩下的面包，我们就忍不住想笑。时光是个雕刻家，像刻律德菈、海瑟音一样，现在阿雅出落得多么美丽啊！\\n就像我们平时教导的那样，阿雅没有让任何人失望，她手中的金丝就像密网一般，任何敌人都无法飞出她的指尖。\\n可那活在阴影中的清洗者在返程途中偷袭了我们的队伍，服务于元老院的刺客组织绝不允许能领导圣城奥赫玛的黄金裔成长起来。但我们也一样，宁愿选择牺牲自己，也绝不会眼睁睁地看着年轻的英雄夭折——\\n我们顺利用百界门度过了这次劫难，但意识也模糊了一分…上一次用百界门以后，我还以为再也找不到缇宁和缇宝了……\\n没事的，阿雅。还不是现在，我们只需要休息一会，一会便好……\\n只是旅程的脚步，必须要加快了啊……」\\n——一封字迹虚弱的日记\\n缇安在回忆，缇宁提笔写，缇宝来补充\",\"part4\":\"「▇▇▇月▇▇日\\n梦越来越模糊了…听小风堇说，这是因为能记住的东西越来越少啦。\\n不过今天，*我们*突然梦到了好多好多条路，天好黑，我们往前跑呀，跑呀，怎么走都走不出去……\\n『别怕，yong者来了！』力大无比的小白从天而降，帮我们赶走了怪物。\\n『老师，向前飞吧。』紫色小小蝶扇动翅膀，吹飞了前面的石头。\\n『梆梆！』灰色的小浣熊力气好大！\\n『哼——』红色的狮子把坏人吃掉了！\\n是可靠的新伙伴！他们从前面的人那里接过手中的火把，火光一个接一个点亮，赶跑了黑夜。\\n不过我们手中的火把越烧越小啦，得快点向前走！\\n——一这么想，我们的身体也开始变大，大到不用举手，就能碰到天空。我们的脚jin泡在蓝色的大海，指尖长出绿色的叶子。缇安的声音是呼呼的风，吹动了更远处的风沙，缇宁枕着软绵绵的雪山，耳朵听着风和雨的摇篮曲！\\n就这样，我们走呀走，眼前的路就只剩下一条啦——\\n在不远处，天空是玫瑰色的，大地是银白的。西风吹拂，鲜花开满了原野。咦？好熟悉，这里也是翁法罗斯？路边的泉水尝起来像fengmi和羊奶一样甜，树上的果子怎么摘也摘不玩！再往前走，月亮和星星都浮上来了，那是缇█在乘着它们前行！前面还有缇█、缇█、缇█…原来大家都在终点等着我们呐！\\n看，远处是妈妈在迎接我们！是妈妈在朝我们挥手、微笑！\\n我们要去吗？\\n嗯，有一天我们会来的！\\n但我们的路还没走完呀！\\n那，明天见？\\n我们『明天』就会见！\\n嗯，明天见。」\\n——一篇字迹歪歪扭扭的日记\"},\"relations\":[{\"targetId\":\"5205\",\"targetName\":\"开拓者\",\"targetRouteId\":\"\",\"relation\":\"天外的救世主\",\"description\":\"致亲爱的小灰： 本来这封信说好了是缇宝来写。 但缇安也有很多话想跟你说！ 最后，*我们*决定一人写一句… *我们*曾为散落四方的城邦传递预言。 *我们*曾为各处征战的黄金裔开启门扉！ *我们*曾在雅努斯的神殿聆听神谕… 最后，是小灰完成了*我们*「逐火」的心愿。 小灰为我们打跑了黑潮里冒出来的坏蛋！ 是小灰拯救了翁法罗斯的大家… 所以，请收下这只缇宝的毛绒娃娃， 是缇安把棉花塞进娃娃里的，可辛苦了！ 是缇宁一针一线，把它缝了起来… *我们*三个写的话已经够多啦，接下来，是一千个*我们*的祝愿： 愿你乘着西风，去往鲜花盛开的地方。不必为离别而悲伤， 我们——明天见！ 缇里西庇俄丝\",\"avatar\":\"https://act-upload.mihoyo.com/sr-wiki/2025/05/12/193706962/b8a39b3ab7c81ed8e88ca43d6be2f88f_8788668609774406579.png\"},{\"targetId\":\"5851\",\"targetName\":\"昔涟\",\"targetRouteId\":\"cyrene\",\"relation\":\"共同拯救翁法罗斯的伙伴\",\"description\":\"「最后的最后，*我们*真的抵达了鲜花芬芳的西风尽头…这不是莫测的『神谕』，而是小涟与大家一次又一次的回忆，筑成的乐土呀。」\",\"avatar\":\"https://act-upload.mihoyo.com/sr-wiki/2025/10/24/276833758/e9ed857da6708dab40ec97b9d22343b5_5036078703727400193.png\"}],\"gallery\":[{\"src\":\"/gallery/tribbie/1.webp\",\"alt\":\"缇宝官方画廊 1\",\"width\":2048,\"height\":2048,\"category\":\"角色立绘\"},{\"src\":\"/light-cones/tribbie.webp\",\"alt\":\"缇宝专属光锥 如果时间是一朵花\",\"width\":864,\"height\":1220,\"category\":\"光锥立绘\",\"sourceUrl\":\"https://bbs.mihoyo.com/sr/wiki/content/4956/detail?bbs_presentation_style=no_header\"},{\"src\":\"/gallery/tribbie/4.webp\",\"alt\":\"缇宝官方画廊 4\",\"width\":5120,\"height\":2880,\"category\":\"游戏CG\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#05070d\"}],[\"$\",\"meta\",\"3\",{\"name\":\"color-scheme\",\"content\":\"dark\"}]]\ne:null\n"])</script><script>self.__next_f.push([1,"18:I[622,[],\"IconMark\"]\n"])</script><script>self.__next_f.push([1,"10:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"缇宝 | 黄金裔档案\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"缇宝的城邦、神权、定位与角色故事。\"}],[\"$\",\"meta\",\"2\",{\"name\":\"author\",\"content\":\"Amphoreus Concept Archive\"}],[\"$\",\"meta\",\"3\",{\"name\":\"keywords\",\"content\":\"翁法罗斯,黄金裔,崩坏星穹铁道,WebGL,互动概念站\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:title\",\"content\":\"翁法罗斯 | 黄金裔命运织机\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:description\",\"content\":\"世界以火种记忆，以命运相连。\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:locale\",\"content\":\"zh_CN\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"9\",{\"name\":\"twitter:title\",\"content\":\"翁法罗斯 | 黄金裔命运织机\"}],[\"$\",\"meta\",\"10\",{\"name\":\"twitt
