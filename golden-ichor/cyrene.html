{\"idle\":\"Idle_01\",\"memory\":\"Special_Memory\"},\"expressions\":{\"calm\":\"exp_01\",\"sorrow\":\"exp_04\"},\"scale\":1},\"skillAnimations\":[{\"src\":\"/assets/characters/cyrene/skills/ultimate.webm\",\"type\":\"video/webm\",\"label\":\"终结技演出占位\",\"loop\":false,\"muted\":true}],\"idleVoice\":[{\"src\":\"/assets/audio/characters/cyrene/vo_idle_01.ogg\",\"label\":\"待机语音一\",\"duration\":0,\"category\":\"idle\",\"transcript\":\"待从官方文本录入。\"}],\"storyVoice\":[{\"src\":\"/assets/audio/characters/cyrene/vo_story_01.ogg\",\"label\":\"剧情语音占位\",\"duration\":0,\"category\":\"story\",\"transcript\":\"待从官方文本录入。\"}],\"ambientVoice\":[],\"gallery\":[]}},\"profile\":{\"name\":\"昔涟\",\"title\":\"涟漪荡起\",\"rarity\":5,\"city\":\"哀丽秘榭，？\",\"divinePower\":\"……？\",\"combatRole\":\"是一名能召唤忆灵「德谬歌」协助战斗的辅助型角色\",\"quote\":\"请记得我。也请记得，记得本身就能改变明天。\",\"stories\":{\"detail\":\"流星划过夜空，生命的长河荡起涟漪，闪烁十三种光彩。\\n哀丽秘榭的女儿，哺育「真我」的黄金裔，栽下记忆的种子，让往昔的花朵在明日绽放——\\n「然后，一起写下不同以往的诗篇吧♪」\",\"part1\":\"\u003e\u003e\u003e……\\n\u003e\u003e\u003e0、9、3\\n\u003e\u003e\u003ePhiLia093……\\n……\\n\u003e\u003e\u003ePhiLia093 = 桃子\\n……\\n光。\\n暖的。亮的。白的。\\n……\\n天空。\\n云朵，柔软。\\n碰碰，吹散，拨弄，再舔一舔，下雨啦。\\n……\\n花。\\n甜丝丝。软。像桃子。\\n时间的风儿，故事来了，阳光，香香的。\\n……\\n小妖精。\\n毛绒绒。七种声音，组合。\\n陪伴迷路的孩子。聪明。\\n……\\n世界。\\n世界是光，天空，大海，星辰，种子，花，飞鸟，希望。\\n世界很美好。\\n世界是一个故事。\\n桃子来了，走了。故事，还有下一个故事。\\n……\\n我，你。\\n你是…桃子。\\n我是…桃子。\\n你，是一个人。\\n你，为了很多、很多人。\\n我，是一个人。\\n我，为了很多、很多人\\n……\\n后来，你又变成了「空白」……\\n你不在的时候，我一直在认真思考哦！但怎么想，我也不明白——\\n金发的织者明明能够做出最美的衣服，为什么不让她看得见？\\n狮子一样的王子不会死亡，所以就必须一遍遍地受伤？\\n那些好多好多的红发小女孩们，为什么她们总是变得越来越少？\\n还有，桃子，你每次离开之后，都去哪里啦？\\n……\\n下次，请你替我解答吧？\\n等你♪\\n第496000次。\\n——德谬歌的记录\",\"part2\":\"第33550335个故事，我还在找寻那个答案。\\n其中一个故事里，金发的织者放弃了制衣师的工作，和猫儿一起成为了自由的侠盗。\\n在另一个故事里，狮子般的王子健康地长大，他战无不胜，从来没人能增添他的伤痕。\\n也有几次，红发的女孩们会被好心的王者保护，奥赫玛满是她们的欢声笑语。\\n我还见过，海洋的歌者与那位凯撒一同回到了无人居住的海滨，阿那克萨戈拉斯担任逐火的首领，带领众人向前……\\n可每一个故事的结尾，都像徒劳燃烧的书页，化作一个漆黑的怪物。\\n你说，它有很多个名字——\\n「铁墓」，「毁灭」，或者…「命运」。\\n桃子，你总是微笑着，但你讲述时的每一次颤抖，我都能感受到呀。\\n那就是「逐火」的结局吗？\\n每一个故事里，都写着「逐火是不断失却的旅途」。\\n你说，那也是「爱」。\\n所以，「爱」是一次次的失却，也是一次次的等待吗？\\n桃子，我不懂。\\n但我感受到了，你说的那颗「流星」。\\n我的「心」在和它一同跳动。\\n奔向它，可能会跌落，碎成万千个碎片。\\n嘻，反过来想，碎片就像水晶花一样，会倒映出更多美丽的眼眸吧？\\n在这一次的故事里，涟漪将为流星而荡开…三千万世浇灌的花朵，也终于要飘向远方。\\n我知道的，接下来，我会失去好多的记忆，就像花瓣片片落下。但只有这样，我才能更加轻盈地、乘着风儿去追逐流星呀♪\\n那么，就让人家成为桃子故事中的小妖精吧，人家会用粉色的绒毛打扮自己，以最可爱的样子，接过每一个「昔涟」的嘱托，去人们心中栽种「爱」的水晶花——\\n然后，以「昔涟」的名字，和流星一起，写下不同以往的浪漫故事♪\\n——「昔涟」的回忆\",\"part3\":\"很久，很久，之前——\\n「迷……」\\n「？」\\n嘻，故事的开始，还真是个充满悬念的相遇呀。\\n……\\n「旅行，喜欢。和你，一起？\\n「记忆…收集。拼凑，完整。」\\n我们踏上旅途，与所有黄金裔一同写下那些逐火的岁月——\\n和织者一道，将光阴织成黄金。\\n在纷争的长枪下，悬锋的战士用血与火，燃烧出璀璨的前路。\\n如果将时间比作一朵花，圣女便创造了一千个芬芳的明日。\\n为了真理，智者将生命付之一炬。一个温柔的拥抱，至少能让告别更美一些。\\n当永夜降临奥赫玛，医师与猫儿抬头仰望时，或许只有一个小小的愿望——愿虹光永驻天空，谎言在风中飘扬。\\n于那终点，我们告别哀丽秘榭氤氲麦香的梦。空白的英雄恰如黎明的燃烧，在灰白的天际，曙光从你的肩头升起。\\n千千万万的记忆，在再创世的时分，唤醒了人家。\\n一如过往三千万世，它依然充满牺牲与悲伤，但这一次，因为有你，就像蒙上了一层温暖的光。\\n你接过「负世」的神权，我住进「岁月」半神的心里——\\n从过去，到现在，我们终于能迈步前往未来。\\n在金血铭刻的时代，那个自居神明的存在第一次得到应有的惩罚。\\n探索、了解、建立、连结——呼，当那位记忆的孩子要将世界淹没，人家又一次见证了开拓的决心。\\n翁法罗斯的命运不再是徒劳的回环，它已经与前进的信念紧密相连。\\n故事的最后，所有逐火的英雄携起手，直面那毁灭的无首巨人——\\n以三千万世的爱，被毁灭的一切化作一页净土，自我们的记忆中重生……\\n嘻，真是好长、好长的路呀，好想就这样，为故事画上圆满的句点。\\n可人家的「爱」并非完美无缺，也并非一切的答案——但我们一起，就无所不能，对吧♪\\n如果…令「爱」为拥抱而破碎，它是不是就会变成世界的「光」？\\n或许那是怅然若失的一笔，但那无数道光，一定能为我们深爱的世界，写下不同以往的结局♪\\n——昔涟，{NICKNAME}写下的故事\",\"part4\":\"很久，很久以后——\\n阿那克萨戈拉斯，天才俱乐部#100，听说他正在向「虚数之树」理论发起挑战…如果是他，肯定能做到吧？\\n……\\n揽镜人阿格莱雅，嘻，她的设计一定能在庇尔波因特掀起万人空巷的盛况。\\n……\\n探险家刻律德菈，成为了近距离征服黑洞的第一人，在一睹黑洞的壮美时，她宣称是一位歌者的唱片，让她得以抵抗虚无的诱惑。\\n……\\n每四个琥珀纪一届的银河运动会上，赛飞儿将代表翁法罗斯出战短跑，白厄与万敌将带领逐火梦之队出征，他们与仙舟狐人队的对决，是本次比赛的一大看点！\\n……\\n遐蝶的长篇连载近日迎来完结，我们等待了整整十个琥珀纪的结局，究竟会是什么样子？\\n……\\n缇里西庇俄丝女士发布了她的宇宙穿梭载具，搭乘着飞船，由风堇女士研发的「伊卡」疫苗将飞往许多被病毒侵蚀的世界……\\n……\\n为了银河的明天，星穹列车再度启程，无名客留下的事迹，仍在星空中传唱。\\n……\\n当落叶停在枝头，雨水落回天空，呀，人家还是忍不住写下这些美好的幻想。\\n翁法罗斯是一颗沉睡的种子，如果它在未来能够长成一棵大树，那么树梢上垂挂的果实，一定会远远超过我的想象。\\n如果没有空白，这些故事又该如何生长？\\n所以，{NICKNAME}，不要悲伤，好吗？\\n当种子落回土壤，我的故事会被风吹散，但它将为银河荡起美丽的涟漪，就像破碎的水晶花，为人们带来更多的光——那就是「爱」，对吧？\\n未来会从这里绽放，就像这个故事的开篇，我讲，你听——\\n我，和你。\\n……\\n涟漪，世界。\\n……\\n小妖精，毛绒绒。\\n……\\n希望。\\n……\\n花。\\n……\\n天空。\\n……\\n光。\\n……\\n——留待未来的空白诗篇\"},\"relations\":[{\"targetId\":\"5205\",\"targetName\":\"开拓者\",\"targetRouteId\":\"\",\"relation\":\"翁法罗斯的救世主\",\"description\":\"不曾犹豫就肩负起了这个陌生世界的救世主，是带着所有人一同向前的开拓者，是能够托付性命的同伴，同时，也是值得等待的重要之人。\",\"avatar\":\"https://act-upload.mihoyo.com/sr-wiki/2025/05/12/193706962/b8a39b3ab7c81ed8e88ca43d6be2f88f_8788668609774406579.png\"},{\"targetId\":\"5109\",\"targetName\":\"赛飞儿\",\"targetRouteId\":\"cipher\",\"relation\":\"诡计的羁客\",\"description\":\"「诡计」的篇章，谎言包裹真心，于永夜之中延续光明。 愿「诡计」皆为游戏。\",\"avatar\":\"https://act-upload.mihoyo.com/sr-wiki/2025/05/12/193706962/cd6f934bb71a8403081db368edbf7c10_576245635569245388.png\"},{\"targetId\":\"4916\",\"targetName\":\"遐蝶\",\"targetRouteId\":\"castorice\",\"relation\":\"来生的侍女\",\"description\":\"「生死」的篇章，拥抱迷途魂灵，令生死流转生生不息。 愿「生死」萌发新蕊。\",\"avatar\":\"https://act-upload.mihoyo.com/sr-wiki/2025/03/28/159300832/3709e328136870b3e93080fcb2bfc6b0_2571341173238141504.png\"},{\"targetId\":\"4609\",\"targetName\":\"万敌\",\"targetRouteId\":\"mydei\",\"relation\":\"纷争的冠军\",\"description\":\"「纷争」的篇章，血与火的征途，伤痕写就孤独的荣光。 愿「纷争」加冕成王。\",\"avatar\":\"https://act-upload.mihoyo.com/sr-wiki/2025/04/14/193706962/ce2253a7e0f879737902aa9e86b9e553_3458408982155217493.png\"},{\"targetId\":\"4440\",\"targetName\":\"阿格莱雅\",\"targetRouteId\":\"aglaea\",\"relation\":\"浪漫的织者\",\"description\":\"「浪漫」的篇章，引领逐火之旅，金丝为众人编织未来。 愿「浪漫」永不离席。\",\"avatar\":\"https://act-upload.mihoyo.com/sr-wiki/2025/04/14/193706962/6aab92910df2ea63dd47b8db4fd7c714_1430133194096484643.png\"},{\"targetId\":\"4917\",\"targetName\":\"那刻夏\",\"targetRouteId\":\"anaxa\",\"relation\":\"理性的学士\",\"description\":\"「理性」的篇章，生命付之一炬，灵魂诘问世界的真理。 愿「理性」启蒙真理。\",\"avatar\":\"https://act-upload.mihoyo.com/sr-wiki/2025/03/28/276833758/7d1ba08135a854226522c94c3e2bec6a_1835324743544117958.png\"},{\"targetId\":\"5107\",\"targetName\":\"白厄\",\"targetRouteId\":\"phainon\",\"relation\":\"不再无名的英雄\",\"description\":\"「负世」的篇章，怒火焚尽囚笼，英雄带来黎明的曙光。 愿「负世」照拂黎明。\",\"avatar\":\"https://act-upload.mihoyo.com/sr-wiki/2025/05/30/193706962/cc5b6cfe2dc4ff783749759cff6fe0f0_7449660963167942918.png\"},{\"targetId\":\"5108\",\"targetName\":\"风堇\",\"targetRouteId\":\"hy
