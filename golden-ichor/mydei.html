tps://cdn.jsdelivr.net/gh/FANHEK/FANHEK.github.io@main/art/mydei.webp\",\"totemIcon\":\"/totems/destruction.svg\",\"bgMusic\":\"\",\"themeColor\":\"#d75a2b\",\"shaderParams\":{\"pulse\":1.4,\"turbulence\":0.82}},\"rarity\":5,\"city\":\"悬锋城\",\"divinePower\":\"「天谴之矛，尼卡多利」\",\"combatRole\":\"消耗生命获得强化的输出型角色\",\"stories\":{\"detail\":\"悬锋城没有为生者准备柔软的摇篮。万敌从幼年起便被告知，王冠并非继承物，而是一道必须亲手证明的伤口。\\n\\n他以火焚尽退路，以愤怒拖住崩裂的命运。人们畏惧他的锋芒，却也在每一次黎明前依赖那道不肯熄灭的火。\",\"part1\":\"悬锋城没有为生者准备柔软的摇篮。万敌从幼年起便被告知，王冠并非继承物，而是一道必须亲手证明的伤口。\",\"part2\":\"他以火焚尽退路，以愤怒拖住崩裂的命运。人们畏惧他的锋芒，却也在每一次黎明前依赖那道不肯熄灭的火。\",\"part3\":\"万敌的传说并未止于自身。关于悬锋城的记录，仍随着火种与远征被不断重写。\",\"part4\":\"“若王座只容一人，便让所有怯懦先于我倒下。”\\n\\n这份选择被后世视为命运织机上最清晰的回声之一。\"},\"verification\":{\"version\":\"3.x\",\"isVerified\":false},\"researchStatus\":\"placeholder\",\"editorialNotes\":[\"当前角色尚未录入完整考据数据。\",\"本页只展示可验证的数据结构，不提供未经确认的神话对应关系。\"],\"prototype\":{\"verification\":{\"version\":\"3.x\",\"isVerified\":false},\"archetype\":\"[待核实: 官方文本]\",\"source\":\"原型来源 [待核实: 官方文本]；在证据补齐前不建立确定映射。\",\"tradition\":\"[待核实: 官方文本]\",\"primaryFigures\":[\"[待核实: 官方文本]\"],\"alternativeFigures\":[],\"narrativeFunction\":\"需要结合角色剧情、技能命名、服饰符号和官方设定文本继续核验。\",\"symbols\":[\"赤王座\",\"悬锋城\"],\"interpretation\":[\"当前页面保留考据槽位，不将社区推测写成官方结论。\"],\"disputedPoints\":[\"全部神话映射均待官方资料与游戏内文本核验。\"],\"confidence\":\"low\",\"sources\":[{\"id\":\"prototype-source-placeholder\",\"title\":\"[待核实: 官方文本]\",\"kind\":\"official\",\"locator\":\"补充官方前瞻、游戏内档案或开发者说明后替换\",\"confidence\":\"low\"}]},\"designMotifs\":[{\"id\":\"mydei-lion-armor\",\"verification\":{\"version\":\"3.x\",\"isVerified\":false},\"category\":\"costume\",\"title\":\"狮鬃式赤金铠甲\",\"visualDescription\":\"肩甲和披风由向外张开的尖角构成，轮廓近似低伏后骤然跃起的狮鬃。\",\"culturalOrigin\":\"王权、猎手与不死战士的复合象征。\",\"meaning\":[\"尖角不是纯装饰，而是把王储身份和野兽般的攻击性合并。\",\"赤红内衬让厚重铠甲的每次行动都像火焰重新点燃。\"],\"palette\":[\"#d75a2b\",\"#f0a257\",\"#5a1716\",\"#f1d4a6\"],\"sourceIds\":[\"prototype-source-placeholder\"]},{\"id\":\"mydei-cracked-crown\",\"verification\":\"$12:props:record:designMotifs:0:verification\",\"category\":\"gesture\",\"title\":\"破损王冠与拳锋\",\"visualDescription\":\"头部金属饰件带有断裂缺口，拳套与护臂则强化近身搏斗的重量。\",\"culturalOrigin\":\"弑王成王、以肉身承担王权的叙事传统。\",\"meaning\":[\"破损感让王冠更像伤口，而不是奖赏。\",\"拳锋取代权杖，强调他通过亲身承受证明统治资格。\"],\"palette\":[\"#d75a2b\",\"#c9955b\",\"#2a1113\",\"#efe2ce\"],\"sourceIds\":[\"prototype-source-placeholder\"]},{\"id\":\"mydei-blood-flame\",\"verification\":\"$12:props:record:designMotifs:0:verification\",\"category\":\"material\",\"title\":\"血火金属表面\",\"visualDescription\":\"铠甲高光呈高温金属质感，暗部保留像凝血与烟灰一样的粗糙颗粒。\",\"culturalOrigin\":\"战场火种、重生和血脉记忆的视觉叠合。\",\"meaning\":[\"火焰只在金属边缘出现，避免把力量画成单纯特效。\",\"血与火共用色域，暗示重生必须付出持续代价。\"],\"palette\":[\"#d94828\",\"#f3bd67\",\"#48131a\",\"#0e0c12\"],\"sourceIds\":[\"prototype-source-placeholder\"]}],\"relations\":[],\"media\":{\"portrait\":{\"src\":\"https://cdn.jsdelivr.net/gh/FANHEK/FANHEK.github.io@main/art/mydei.webp\",\"alt\":\"万敌角色立绘\"},\"splashArt\":{\"src\":\"https://cdn.jsdelivr.net/gh/FANHEK/FANHEK.github.io@main/art/mydei.webp\",\"alt\":\"万敌超高清立绘\"},\"divineCard\":{\"src\":\"https://cdn.jsdelivr.net/gh/FANHEK/FANHEK.github.io@main/art/divine/mydei.webp\",\"alt\":\"万敌神性铭牌\",\"width\":645,\"height\":1135,\"placeholder\":\"empty\"},\"skillAnimations\":[],\"idleVoice\":[],\"storyVoice\":[],\"ambientVoice\":[],\"gallery\":[]}},\"profile\":{\"name\":\"万敌\",\"title\":\"王储逐猎纷争\",\"rarity\":5,\"city\":\"悬锋城\",\"divinePower\":\"「天谴之矛，尼卡多利」\",\"combatRole\":\"消耗生命获得强化的输出型角色\",\"quote\":\"若王座只容一人，便让所有怯懦先于我倒下。\",\"stories\":{\"detail\":\"那沉入迷雾的悬锋，纷乱与战争之城！它的王室流着弑亲的血脉，它的神明以灾厄为名。\\n不死的迈德漠斯，离群的狮子，逐猎「纷争」火种的黄金裔。你要忍受万死，浴血还乡，孤身背负疯狂的宿命\\n——弑王成王，弑神登神。征战的铁蹄踏遍荒野，终归要沾上故乡的血。\",\"part1\":\"「在沿海城邦古老的传说里，冥海曾诞育下堪比神明的生灵。据往来渔船所说，正有这样的『海王』以幼童的相貌出没于波涛之中，面目凶恶，红颜青唇，以侵肌蚀骨的冥海之水沐浴，与凶恶残暴的冥海之兽肉搏，渴饮鲜血，生啖骨肉。\\n据说它每一次沉入海底，不消多时便会自冥海重生。在约莫九年的时间中，重塑己身不下一万次，最终撕裂巨妖，鲜血染红千里海面，却无有噬肉的海兽敢来接近。\\n传说那海王尾巴一甩，便可将众多鱼虾卷上沙滩。曾有落难的渔民向天求救，被海王率领水兵救起。传闻愈来愈超凡神妙，久而久之，甚至有渔民为海王绘制画像，贴在船上以求出海平安。\\n近来又有传言兴起，说那所谓海王其实是王储迈德漠斯的怨灵作祟，先王恐惧他背负的预言，在他出生后便将其掷入冥海，夭折的孩子死不瞑目，誓要猎尽冥海。但笔者认为这只不过是狡猾的悬锋人想为自己脸上贴金，理由有三：\\n第一，就算悬锋人素来有父子争斗、胜者为王的传统，但怎会一出生将贵为王储的人子扔下海中？\\n第二，就算悬锋王欧利庞年老昏聩，听信预言将子嗣扔进海中祭祀，一个幼儿怎么可能有堪比神明的力量与巨妖搏斗？\\n第三，就算有这样的幼儿存在，他也绝不可能是悬锋人。悬锋人一个比一个自私粗野，又怎会帮助遭逢海难的渔民？\\n诸位读者，接下来我将为你们揭晓真相：其实所谓的海王\\n——自然就是海洋的化身！」\\n——选段自歌尔巴尼帕尔图书馆藏\\n「威力海王传考据」\\n「强。」\\n——男人的字迹\",\"part2\":\"「那支孤军散发着浓烈的血腥，像一支染血的长枪。那名领军的战士即是枪尖，永远裹挟着深不见底的愤怒与仇恨刺向敌人。\\n自拉冬，经哀地里亚，再至厄涅俄努斯，他一次次自死亡回归，也为所经之处带来滔天的战火。那令世人侧目的厄涅俄努斯之战中，未尝一败的克吕提俄斯高举巨斧，万箭自他的身后齐发。然而烟尘散去，火自血中沐浴而出，战士的拳风如尖刺，撕开了克吕提俄斯的咽喉。\\n在那足以载入史诗的战役后，战士的真实身份越发扑朔迷离。那支军队明显带有悬锋的训练痕迹，但却从未悬挂悬锋的旗帜，无人知晓他们是游荡于战场的悬锋孤魂，还是失落家乡已久的迷途人。\\n往来的吟游诗人将那孤军行旅编成哀伤的歌，在翁法罗斯带着铁锈味的野风中，孤高的狮子带着成群的老弱残兵迁徙，寻找不存在的家园。\\n现实绝不会因残酷改变自己的面貌。那些忠心耿耿追随他的悬锋子民，即便曾是精锐，也没有他那神一般的不死之身。随着岁月流逝，连悬锋的神明已陷入疯狂，凡人又该往何处去？\\n那孤高的人是否会将子民的命运背于己身，是否为自己戴上王的枷锁？还是说，这只是他一厢情愿的徒劳……」\\n——选段自歌尔巴尼帕尔图书馆藏\\n「翁法罗斯战争史」\\n「赫菲斯辛、帕狄卡斯、莱昂、托勒密，朴塞塔…你们的名字，必不遗落于历史。」\\n——男人的字迹\",\"part3\":\"「迈德漠斯啊！你这忘恩负义的背叛者，断绝悬锋精神的懦夫！\\n你弑杀先王，复仇成功，却不接过重振王朝的责任，你的荣誉之心难道在冥海时被鱼兽吞噬一空了么？\\n你混迹于逐火的队伍，被妖女的狂言诓骗，与出身低贱的士兵打成一片；你宁愿将希望寄托于虚无缥缈的神谕，也不愿相信你自己的双拳！\\n悬锋人渴望回到纷争的故乡，而你却要我们迁往宿敌的城邦，你难道贪恋奥赫玛的奢华么？还是你早已被黄金浴池的水雾弄得神魂颠倒？\\n迈德漠斯啊！你有高贵的不死之身，岂可由那奥赫玛的女人统领？你是逐猎的狮子，纷争的使者，你难道忘记了捕猎者与猎物的不同吗？\\n听说不久之前，你与那自称黄金裔的人从尼卡多利眷属手中救下异邦的平民，不惜在那不见天明的长夜里，任由身躯破碎，沐血而狂。\\n迈德漠斯啊！你的血不当为了那些无用的人而流，你当纠集军队，劫掠资源，如此，悬锋才能在末世中抢夺一丝生机！\\n那所谓逐火的路将你变得面目全非，吾王，回来吧！王不需要同等之人，不需要伙伴，不需要怀疑，不需要拯救——倘若你还残存最后一丝清醒，便向吾等发令吧！\\n让悬锋的荣耀凌驾于一切城邦之上！」\\n——选段自歌尔巴尼帕尔图书馆藏\\n「悬锋元老院决议合集」\\n「继续迁移。」\\n——男人的批示\",\"part4\":\"「黎明圣城奥赫玛为此世之中黑潮尚无法侵扰的净土，但黑潮对其包围之势已显而易见。\\n千年历史，黑潮所过之处，生灵异化为非人的怪物，城邦风蚀为无人的废墟，即便强盛如悬锋，其神明亦被黑潮污染，一切荒废无存。\\n逐火至今，大部分火种都已归位，然而黑潮将临，时间已所剩无几，在再创世之前，如若奥赫玛失守，一切都将前功尽弃。\\n笔者于此大胆揣测，在不久的将来，逐火的英雄必将与黑潮一战。从以往记录来看，哪怕是最为勇猛的战士，也无法在黑潮中坚持长久。黄金裔英雄各有所长，若说此战的希望，若非那骁勇的白厄，便会落在迈德漠斯身上。\\n当然，那不仅是因为迈德漠斯作为此世勇者之冠，拒绝死亡的天生之命，也不仅因为悬锋旧城位处抵挡黑潮的关要。纵然迈德漠斯如悬锋的狮子般一生迁徙多次，最后停留在离诞生地极远的地方，孤高的王也绝无可能在他国中称臣。一旦安顿好子民，将使命视作生命的迈德漠斯必定归乡，只不过这一次，他背负的不只是悬锋人的希望，更是世界的未来。\\n塔兰顿的祭司曾预言，千年纷争的历史始于悬锋，亦将终结于悬锋。或许在未来的某一日，那不死之身踏入黑潮，方生方死，那会是怎样的境况，怎样的悲壮……」\\n——选段自歌尔巴尼帕尔图书馆藏\\n「逐火观察：黑潮专题」\\n「一如冥海，一如既往。」\\n——男人新近的批注\"},\"relations\":[{\"targetId\":\"5205\",\"targetName\":\"开拓者\",\"targetRouteId\":\"\",\"relation\":\"喜欢说胡话的异乡人\",\"description\":\"致开拓者： 我愿与你争锋于苍穹之上，但仍需肩负苍穹之下的使命， 因为即使战火止息，和平的道路仍需有人引领。 救世的恩义难以言表，我唯能奉上酒杯， 与你欢饮这鲜红的石榴蜜酿， 贺祝此世的胜利，遥敬星空的征途。 你的远征必有群狼环伺，毒蛇匿影， 若你需要纷争的怒火，我便将我的悬锋，连同血骨一齐奉上， 伴你行疆拓域，助你常战常胜。 当你凯旋之日，我将再度为你举杯。 迈德漠斯\",\"avatar\":\"https://act-upload.mihoyo.com/sr-wiki/2025/05/12/193706962/b8a39b3ab7c81ed8e88ca43d6be2f88f_8788668609774406579.png\"},{\"targetId\":\"5851\",\"targetName\":\"昔涟\",\"targetRouteId\":\"cyrene\",\"relation\":\"共同拯救翁法罗斯的伙伴\",\"description\":\"「她为翁法罗斯做的牺牲与努力，将让这片破碎的焦土，生长出繁荣的城邦。」\",\"avatar\":\"https://act-upload.mihoyo.com/sr-wiki/2025/10/24/276833758/e9ed857da6708dab40ec97b9d22343b5_5036078703727400193.png\"}],\"gallery\":[{\"src\":\"https://cdn.jsdelivr.net/gh/FANHEK/FANHEK.github.io@main/gallery/mydei/1.webp\",\"alt\":\"万敌官方画廊 1\",\"width\":2048,\"height\":2048,\"category\":\"角色立绘\"},{\"src\":\"https://cdn.jsdelivr.net/gh/FANHEK/FANHEK.github.io@main/light-cones/mydei.webp\",\"alt\":\"万敌专属光锥 血火啊，燃烧前路\",\"width\":864,\"height\":1220,\"category\":\"光锥立绘\",\"sourceUrl\":\"https://bbs.mihoyo.com/sr/wiki/content/5106/detail?bbs_presentation_style=no_header\"},{\"src\":\"https://cdn.jsdelivr.net/gh/FANHEK/FANHEK.github.io@main/gallery/mydei/4.webp\",\"alt\":\"万敌官方画廊 4\",\"width\":5120,\"height\":2880,\"category\":\"游戏CG\"}]}}]\n"])</script><script>self.__next_f.push([1,"18:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#05070d\"}],[\"$\",\"meta\",\"3\",{\"name\":\"color-scheme\",\"content\":\"dark\"}]]\n14:null\n"])</script><script>self.__next_f.push([1,"1d:I[622,[],\"IconMark\"]\n"])</script><script>self.__next_f.push([1,"16:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"万敌 | 黄金裔档案\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"万敌的城邦、神权、定位与角色故事。\"}],[\"$\",\"meta\",\"2\",{\"name\":\"author\",\"content\":\"Amphoreus Concept Archi
