ce\",\"name\":\"遐蝶\",\"title\":\"冥河流淌\",\"element\":\"Quantum\",\"path\":\"Remembrance\",\"lineage\":\"Titan\",\"category\":\"heir\",\"epithet\":\"施以死荫的拥抱\",\"domain\":\"冥河花海\",\"constellation\":\"紫蝶归途\",\"lore\":[\"遐蝶从不把死亡称作终结。她见过太多生命在最后一刻释放出远比活着时明亮的光。\",\"她为迟迟不肯远去的灵魂守门，也为生者保存最后一句未说完的话。温柔在她手中，有死亡的安静。\"],\"quotes\":[{\"text\":\"不必害怕。冥河只是让所有名字重新变得平等。\"}],\"assets\":{\"splashArt\":\"/art/castorice.webp\",\"totemIcon\":\"/totems/remembrance.svg\",\"bgMusic\":\"\",\"themeColor\":\"#b779ef\",\"shaderParams\":{\"pulse\":0.76,\"turbulence\":0.58}},\"rarity\":5,\"city\":\"斯缇科西亚，哀地里亚，奥赫玛\",\"divinePower\":\"「灰黯之手，塞纳托斯」\",\"combatRole\":\"召唤「死龙•玻吕刻斯」共同战斗的输出型角色\",\"stories\":{\"detail\":\"那敬爱死亡的国度，终日飘雪的哀地里亚，今日已沉入甘甜的酣眠。冥河的女儿遐蝶，寻索「死亡」火种的黄金裔，启程吧。呵护世间魂灵的恸哭，拥抱命运的孤独，生死皆为旅途。\",\"part1\":\"斯缇科西亚的夜总比别处更长。河流穿过旧城，花瓣随水漂向看不见的彼岸。人们说，遐蝶会在最安静的时刻出现，替那些不愿离去的灵魂合上双眼。\\n\\n她不把死亡称作终点。每一次告别都像一枚缓慢落下的叶片，在落地之前，仍保留着生命的纹理。\",\"part2\":\"火焰曾照亮城邦，也曾将记忆烧成灰烬。遐蝶沿着冥河行走，收集被遗忘的名字、未说完的话和无人认领的遗物。她知道，真正令人恐惧的并非死亡，而是生命在消失前无人记得。\\n\\n于是她把每一份悲伤收进花环，让逝者的故事得以跨越长夜。\",\"part3\":\"当黑潮逼近，命运不再允许温柔的迟疑。遐蝶呼唤死龙玻吕刻斯，紫色蝶翼掠过残破的城墙。她终于承认，守护生者的方式有时也必须靠近死亡本身。\\n\\n龙息切开暗流，冥河仍向前流淌。她站在破碎的桥上，看见世界像一场长梦，而自己正是守在梦醒之处的引路人。\",\"part4\":\"「如果枯萎不可避免，至少让我们的告别更美一些。」\\n\\n这是她留给世人的箴言，也是她与命运立下的约定。花会凋零，名字会被河水冲淡，但每一次郑重的告别，都曾让生命在终点前重新拥有尊严。\"},\"verification\":{\"version\":\"3.x\",\"isVerified\":false},\"hoYoLabData\":{\"profileVersion\":\"3.x\",\"introduction\":\"[待核实: 米游社官方角色介绍 · 遐蝶]\",\"stories\":[{\"id\":\"castorice-story-1\",\"index\":1,\"title\":\"角色故事 1\",\"subtitle\":\"[待核实: 米游社官方文本]\",\"content\":[\"[待核实: 米游社官方角色故事 1]\",\"在此粘贴官方正文，并补充对应版本、页面链接与抓取日期。\"],\"unlockCondition\":\"沿用米游社原始解锁条件\",\"source\":\"米游社角色详情页 [待核实: 官方文本]\",\"verification\":{\"version\":\"3.x\",\"isVerified\":false}},{\"id\":\"castorice-story-2\",\"index\":2,\"title\":\"角色故事 2\",\"subtitle\":\"[待核实: 米游社官方文本]\",\"content\":[\"[待核实: 米游社官方角色故事 2]\",\"在此粘贴官方正文，并补充对应版本、页面链接与抓取日期。\"],\"unlockCondition\":\"沿用米游社原始解锁条件\",\"source\":\"米游社角色详情页 [待核实: 官方文本]\",\"verification\":{\"version\":\"3. :\"冥后采花、生死季节循环以及墓前供花的复合传统。\",\"meaning\":[\"生命力并未被死亡取消，只是在另一侧继续生长。\",\"蜡质高光用于制造“活着但不属于生者”的矛盾质感。\"],\"palette\":[\"#b779ef\",\"#6d4b85\",\"#d7b4ea\",\"#101017\"],\"sourceIds\":[\"source-official-preview-placeholder\"]}],\"relations\":[{\"targetId\":\"march\",\"targetName\":\"长夜月\",\"kind\":\"mythic-counterpart\",\"relation\":\"死之引渡与遗忘\",\"description\":\"占位关系：死亡负责结束，而遗忘决定结束时留下些什么。\",\"intensity\":4,\"status\":\"draft\"},{\"targetId\":\"aglaea\",\"targetName\":\"阿格莱雅\",\"kind\":\"faction\",\"relation\":\"织命与断线\",\"description\":\"占位关系：金织决定命运如何相连，遐蝶处理命运被剪断后的余波。\",\"intensity\":3,\"status\":\"draft\"}],\"media\":{\"portrait\":{\"src\":\"/art/castorice.webp\",\"alt\":\"遐蝶角色立绘\",\"width\":745,\"height\":1116,\"blurDataURL\":\"data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='8' height='12'%3E%3Cpath fill='%23221c25' d='M0 0h8v12H0z'/%3E%3Cpath fill='%23c37aae' opacity='.45' d='M2 9h4v3H2zM1 4h6v5H1z'/%3E%3C/svg%3E\",\"placeholder\":\"blur\"},\"splashArt\":{\"src\":\"/art/castorice.webp\",\"alt\":\"遐蝶超高清立绘\",\"width\":745,\"height\":1116,\"blurDataURL\":\"data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='8' height='12'%3E%3Cpath fill='%23221c25' d='M0 0h8v12H0z'/%3E%3Cpath fill='%23c37aae' opacity='.45' d='M2 9h4v3H2zM1 4h6v5H1z'/%3E%3C/svg%3E\",\"placeholder\":\"blur\"},\"divineCard\":{\"src\":\"/art/divine/castorice.webp\",\"alt\":\"遐蝶神性铭牌\",\"width\":645,\"height\":1135,\"placeholder\":\"empty\"},\"live2d\":{\"modelJson\":\"/assets/characters/castorice/live2d/castorice.model3.json\",\"textures\":[\"/assets/characters/castorice/live2d/texture_00.png\",\"/assets/characters/castorice/live2d/texture_01.png\"],\"motions\":{\"idle\":\"Idle_01\",\"funeral\":\"Special_Guide\"},\"expressions\":{\"calm\":\"exp_01\",\"mourn\":\"exp_05\"},\"scale\":1},\"skillAnimations\":[{\"src\":\"/assets/characters/castorice/skills/ultimate.webm\",\"type\":\"video/webm\",\"label\":\"终结技演出占位\",\"loop\":false,\"muted\":true}],\"idleVoice\":[{\"src\":\"/assets/audio/characters/castorice/vo_idle_01.ogg\",\"label\":\"待机语音一\",\"duration\":0,\"category\":\"idle\",\"transcript\":\"待从官方文本录入。\"}],\"storyVoice\":[{\"src\":\"/assets/audio/characters/castorice/vo_story_01.ogg\",\"label\":\"剧情语音占位\",\"duration\":0,\"category\":\"story\",\"transcript\":\"待从官方文本录入。\"}],\"ambientVoice\":[],\"gallery\":[]}},\"profile\":{\"name\":\"遐蝶\",\"title\":\"冥河流淌\",\"rarity\":5,\"city\":\"斯缇科西亚，哀地里亚，奥赫玛\",\"divinePower\":\"「灰黯之手，塞纳托斯」\",\"combatRole\":\"召唤「死龙•玻吕刻斯」共同战斗的输出型角色\",\"quote\":\"不必害怕。冥河只是让所有名字重新变得平等。\",\"stories\":{\"detail\":\"那敬爱死亡的国度，终日飘雪的哀地里亚，今日已沉入甘甜的酣眠。\\n冥河的女儿遐蝶，寻索「死亡」火种的黄金裔，启程吧。呵护世间魂灵的恸哭，拥抱命运的孤独\\n——生死皆为旅途，当蝴蝶停落枝头，那凋零的又将新生。\",\"part1\":\"自她有记忆的那天起，哀地里亚的雪一直都在，时间仿佛冻结在这片寂静的白色土地上。\\n年幼的她曾问阿蒙内特，雪是什么？阿蒙内特说，雪是人世的悲欢离合。\\n她总是出神地看着城中的人们。\\n小个子勇士每日都在神殿门前练武，高塔下的中年祭司偶尔喜欢打瞌睡，苦行学者将安提灵花饼分给孩子们。\\n远处打雪仗的孩子们推搡着，笑声就像成熟的果子落进她的心里。\\n她在高塔之上努力分辨着，却看不清他们的脸庞。\\n圣女大人——只是当她出现在众人面前，别人总是如此称呼她，无人敢直视她的眼睛。\\n她鼓起勇气靠近，他们却后退一步，把眼睛垂得更低。她仍旧看不清任何人的模样。\\n直到他们站在死亡面前——小个子勇士在战场上受了重伤，中年祭司为经年累月的疾患所困，苦行学者在救治伤患时被感染——这是她距离他们最近的时刻。\\n生命不再痛苦挣扎，而是在她的指尖化作风中的花瓣。\\n当终于有机会端详他们的脸庞，但她却转过头去，不忍再看。\\n「有些手是为种植而生，有些是为统治而生…你只不过是履行告别的天职而已。」\\n阿蒙内特的话在她耳旁想起，她曾疑惑自己的双手，究竟可以留下什么。\\n回过神来时，她看着手中未完成的冰雕——年轻的战士挥舞武器，母亲拥抱即将奔赴战场的孩子，眷侣依依不舍地捧起对方的脸庞……\\n这些人都不在了。\\n但这样的事还会发生，一次又一次，在风雪之中，在风雪之外。\\n她终于明白，哀地里亚的雪也会融化，就像万物都要走向「死亡」的怀抱。\\n「爱笑的尼古拉奥斯，慈祥的赫莲纳\\n还有如风一般寡言的克力同……\\n夜晚，我捧起那些\\n失落的名字，静默的记忆\\n将白日的哀伤化作\\n沉浸在雪水中的滚烫\\n……」\\n——少女写下的，名为「哀地里亚」的诗\",\"part2\":\"离开哀地里亚的那一天，她踏上觐见塞纳托斯的旅途，一场不知终点在何处的征程。\\n她斥退黑潮造物，挽救衰败的村庄。她不再是哀地里亚的「督战圣女」，却还是刻意与人保持距离，藏起自己的双手。但她不忍孩童闪亮的目光，第一次拿起针线，满足了孩子抚摸玩偶的最后愿望。\\n在那遍布死亡的战场，她为无法归乡的战士写下寄托哀思的家书，她也曾跟随骄傲的诗人学习，用诗篇为后者送别……\\n「死亡是无法逃避的必然」，「死亡是属于战士的荣誉」，「死亡不过是走出时间」…在那漫长的一路，她听过许多或直白或诗意的议论，然而这些答案犹如拂过水面的微风，从未抵达她的内心深处。\\n「后来…有人说，那黎明照拂的圣城满溢生的希望，我或许能在这里……」\\n少女欲言又止。\\n「没事没事，你现在不想说也没事，奥赫玛欢迎你！」红发女孩为她端来一杯热茶。\\n金发女士颇有兴趣地打量着少女的手套——\\n「很有设计感的饰品，也是旅途中学会的么？」\\n她羞涩地交叉起手指。\\n「嗯，我想…至少能让告别，更庄重一些。」\\n奥赫玛的阳光热烈而灿烂，黎明机器永不落幕的宣告许诺了无尽的明天。\\n从那小屋开始，她小心翼翼地开始第二次人生。\\n原本空旷的房间在她的装扮下一日日丰盈起来，羊毛毡玩偶，奇美拉抱枕，厚厚的诗集，它们不再是悲伤的象征，而成为赠礼、纪念与祝福——\\n那些曾为了逝者而存在的习惯，在奥赫玛的阳光下第一次有了生的温暖和力量。\\n「从这扇窗中望出去的风景\\n依然同来时的一样\\n阳光灿烂，水波温柔\\n我吹散双手的雪\\n不让它们太过寒冷、太接近于春天\\n……」\\n——少女写下的，名为「春天」的诗\",\"part3\":\"她知晓自己的终点与逐火的同伴不同，却也逐渐开始拥有属于自己的一些小小的温暖瞬间。\\n在金丝温柔的牵引下，她第一次笨拙地与人共舞。在那生机勃勃的花园，她与风堇一同制作如生般鲜活的干花。还有在树庭毕业的那日，阳光洒落她的长裙，有如蝶翅的碎影……\\n那些对他人而言或许无足轻重的瞬间，早已成为她度过寒凉岁月的薪柴。\\n她是如此地渴望温暖，却也恰恰因此克制着更多的期待，也许是因为那不断失却的逐火之旅，也许是因为不想再经历残酷的伤悲…就像那个纠缠她已久的噩梦，一遍遍重复的那样——\\n刻法勒手中夕阳沉落，血色的迟暮笼罩黎明的圣城。\\n黑潮涌至，死寂的浴池中，黄金的织者第一次与她拥抱，花海中只余织者疲惫的叹息。\\n「我的『爱』，不会因死亡而逝去。」\\n「小蝶，明天见~」褴褛不堪的信使化作玩偶，倒在她的怀中奄奄一息。\\n她试图抓住那些飞散的花瓣，而那捷足的盗贼握住她的手，为她捎来最后的酬劳。\\n「就当帮我一次，骗骗死亡那又如何？」\\n天空的祭司低垂眼眸，靠在她的肩头消散。浴血的王储闭上双眼，等待她的处刑。战士流下血泪，铠甲破碎。树庭的哲人微笑，邀请她作最后的见证。\\n梦的末尾，她看见那天外来客跪倒在星空之下，她最恐惧的猜想就此印证……\\n「蝶宝，再多休息一会吧。」\\n在昏光庭院的催眠治疗室，医师的眼中满是担忧。\\n她擦去额头的汗水，仿佛下定某种决心。\\n「不，我会尽我所能，绝不让噩梦成真……」\\n「逐火的英雄们本行于不同的路\\n我们因微茫的光互相吸引\\n就如忍受灼烧之痛的飞蛾\\n并非因为看见希望才向前飞去\\n而是因为向前飞去而看见希望\\n……」\\n——少女写下的，名为「逐火」的诗\",\"part4\":\"她/他「也许…这就是在奥赫玛度过的最后一天了……」\\n在苦旅的尽头，她终于寻到冥界的线索，前往那或许有来无回的地方之前，她还想再好好看一眼世界。\\n那是黄金裔的浴池。\\n她记得阿格莱雅曾在氤氲的水汽中，将精心修补的手套送给她。\\n「蝶，和第一次见面相比，你变了许多呢。」\\n她惊喜地触摸着手套上美丽的花纹，那平日淡漠的领袖微笑着向她眨了眨眼。\\n「即使是如今的我，也能看到你那被寒冷包裹着的、炽热的心……」\\n那是屋后静谧的花园，它已被塑造成了她梦中的模样。\\n在那时空错乱的梦中，她常常遇到另一个自己，她们一同在花园中耕作，培育，直到荒芜的土地变为盛大的花海。\\n「但愿在未来，我也能如此播种希望……」\\n那是她为曾在指尖逝去的生命立下的纪念碑。\\n从哀地里亚的逝者，到逐火之旅的黄金裔…千年以来，她尝试记住每一个人的名字和过去。\\n「有人记着，就不算真正的逝去。」\\n那是她初见{NICKNAME}的地方。\\n相遇是一件多么神奇的事，她想，往日见惯的街道，因为人而有了特别的意义。\\n「阁下，我一定会用我的双手，为你带来……」\\n门扉时将近，约定启程的时刻也将到来。\\n在那热烈的阳光下，她许下最初的、也是最后的心愿：以那寒冷而漫长的一生作为开端，她将与一同写下——\\n一首以真正的拥抱作为句点的、名为「遐蝶」的诗篇。\"},\"relations\":[{\"targetId\":\"5205\",\"targetName\":\"开拓者\",\"targetRouteId\":\"\",\"relation\":\"亲手拯救的唯一生命\",\"description\":\"致开拓者阁下： 当寒风吹彻送来第一缕飘雪， 我们踏入泥泞荒原。 收殓将死的花瓣， 使它枯槁的哀荣，停柩于旅人的花冠。 往返脚印，编织小径。 未曾想过，有一日我会戴上花冠， 走出雪境，那切割生死的晨昏线， 去往尚有余温的世间， 与人相拥时面露笑颜。 在启程前，请捎上这副花冠吧。 它曾陪我行过漫漫长路，涉过幽冥的滩涂， 赶赴西风尽头，伫望世界的新生。 愿那些花儿如翩跹的蝴蝶， 在你疲倦之时，停歇在你的额间， 愿生命的温软与你常伴。 遐蝶\",\"avatar\":\"https://act-upload.mihoyo.com/sr-wiki/2025/05/12/193706962/b8a39b3ab7c81ed8e88ca43d6be2f88f_8788668609774406579.png\"},{\"targetId\":\"5851\",\"targetName\":\"昔涟\",\"targetRouteId\":\"cyrene\",\"relation\":\"共同拯救翁法罗斯的伙伴\",\"description\":\"「如果可以，我也想为她手作一朵绚烂的水晶花，作为礼物送给她…就像她曾赠予这世界的『记忆』，永不枯萎，永远无瑕。」\",\"avatar\":\"https://act-upload.mihoyo.com/sr-wiki/2025/10/24/276833758/e9ed857da6708dab40ec97b9d22343b5_5036078703727400193.png\"}],\"gallery\":[{\"src\":\"/gallery/castorice/1.webp\",\"alt\":\"遐蝶官方画廊 1\",\"width\":2048,\"height\":2048,\"category\":\"角色立绘\"},{\"src\":\"/light-cones/castorice.webp\",\"alt\":\"遐蝶专属光锥 让告别，更美一些\",\"width\":864,\"height\":1220,\"category\":\"光锥立绘\",\"sourceUrl\":\"https://bbs.mihoyo.com/sr/wiki/content/5154/detail?bbs_presentation_style=no_header\"},{\"src\":\"/gallery/castorice/4.webp\",\"alt\":\"遐蝶官方画廊 4\",\"width\":2275,\"height\":1280,\"category\":\"游戏CG\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#05070d\"}],[\"$\",\"meta\",\"3\",{\"name\":\"color-scheme\",\"content\":\"dark\"}]]\ne:null\n"])</script><script>self.__next_f.push([1,"18:I[622,[],\"IconMark\"]\n"])</script><script>self.__next_f.push([1,"10:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"遐蝶 | 黄金裔档案\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"遐蝶的城邦、神权、定位与角色故事。\"}],[\"$\",\"meta\",\"2\",{\"name\":\"author\",\"content\":\"Amphoreus Concept Archive\"}],[\"$\",\"meta\",\"3\",{\"name\":\"keywords\",\"content\":\"翁法罗斯,黄金裔,崩坏星穹铁道,WebGL,互动概念站\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:title\",\"content\":\"翁法罗斯 | 黄金裔命运织机\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:description\",\"content\":\"世界以火种记忆，以命运相连。\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:locale\",\"content\":\"zh_CN\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"9\",{\"name\":\"twitter:title\",\"content\":\"翁法罗
