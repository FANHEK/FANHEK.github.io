\"],\"prototype\":{\"verification\":{\"version\":\"3.x\",\"isVerified\":false},\"archetype\":\"[待核实: 官方文本]\",\"source\":\"原型来源 [待核实: 官方文本]；在证据补齐前不建立确定映射。\",\"tradition\":\"[待核实: 官方文本]\",\"primaryFigures\":[\"[待核实: 官方文本]\"],\"alternativeFigures\":[],\"narrativeFunction\":\"需要结合角色剧情、技能命名、服饰符号和官方设定文本继续核验。\",\"symbols\":[\"苍龙逆鳞\",\"天外回声\"],\"interpretation\":[\"当前页面保留考据槽位，不将社区推测写成官方结论。\"],\"disputedPoints\":[\"全部神话映射均待官方资料与游戏内文本核验。\"],\"confidence\":\"low\",\"sources\":[{\"id\":\"prototype-source-placeholder\",\"title\":\"[待核实: 官方文本]\",\"kind\":\"official\",\"locator\":\"补充官方前瞻、游戏内档案或开发者说明后替换\",\"confidence\":\"low\"}]},\"designMotifs\":[{\"id\":\"dan-heng-terra-lance\",\"verification\":{\"version\":\"3.x\",\"isVerified\":false},\"category\":\"weapon\",\"title\":\"山脊龙枪\",\"visualDescription\":\"长枪由地层切面、龙脊和矿物晶体组成，枪尖保持垂直向上的稳定比例。\",\"culturalOrigin\":\"龙脉、地脉与守护者长兵器。\",\"meaning\":[\"枪身像移动的山脊，强调守护而非征服。\",\"晶体节点提示力量来自大地契约。\"],\"palette\":[\"#e0bb45\",\"#88d9d0\",\"#314f56\",\"#f0f0dc\"],\"sourceIds\":[\"prototype-source-placeholder\"]},{\"id\":\"dan-heng-shield-scale\",\"verification\":\"$c:props:record:designMotifs:0:verification\",\"category\":\"costume\",\"title\":\"岩鳞守甲\",\"visualDescription\":\"肩甲与腰甲使用规则鳞片，白色外袍覆盖在深青结构之外。\",\"culturalOrigin\":\"东方甲胄、龙鳞与无名客旅行服。\",\"meaning\":[\"外层白袍表示新的身份，内层龙鳞保留旧日血脉。\",\"大块甲片让动作具有稳定和阻挡感。\"],\"palette\":[\"#e5dfc8\",\"#79d3ca\",\"#273e46\",\"#dbae45\"],\"sourceIds\":[\"prototype-source-placeholder\"]},{\"id\":\"dan-heng-mineral-gold\",\"verification\":\"$c:props:record:designMotifs:0:verification\",\"category\":\"color\",\"title\":\"矿脉金与青龙青\",\"visualDescription\":\"金色集中于枪尖和龙角，青色贯穿晶体与能量，基础色为岩灰和象牙白。\",\"culturalOrigin\":\"矿石、苔原与龙脉光。\",\"meaning\":[\"金色让守护行为带有誓约般的神圣性。\",\"青色连接他与大地、龙灵和远方旅途。\"],\"palette\":[\"#e0bb45\",\"#83d6cf\",\"#ece7d8\",\"#1b2b34\"],\"sourceIds\":[\"prototype-source-placeholder\"]}],\"relations\":[],\"media\":{\"portrait\":{\"src\":\"/art/dan-heng.webp\",\"alt\":\"丹恒·腾荒角色立绘\"},\"splashArt\":{\"src\":\"/art/dan-heng.webp\",\"alt\":\"丹恒·腾荒超高清立绘\"},\"divineCard\":{\"src\":\"/art/divine/dan-heng.webp\",\"alt\":\"丹恒·腾荒神性铭牌\",\"width\":645,\"height\":1135,\"placeholder\":\"empty\"},\"skillAnimations\":[],\"idleVoice\":[],\"storyVoice\":[],\"ambientVoice\":[],\"gallery\":[]}},\"profile\":{\"name\":\"丹恒·腾荒\",\"title\":\"荒龙腾飞穹苍\",\"rarity\":5,\"city\":\"天外\",\"divinePower\":\"「磐岩之脊，吉奥里亚」\",\"combatRole\":\"能为我方单体召唤【龙灵】的防御型角色\",\"quote\":\"龙吟不必来自同一片天空。守护也无需沿用旧日的答案。\",\"stories\":{\"detail\":\"吉奥里亚的胸膛，伏龙的身躯支撑破碎的大地，忍耐千年苦痛。\\n无名客丹恒，捍卫「大地」火种的黄金裔，扶八荒之将倾，将地上生灵送往远方的天地\\n——百川归海，群山合鸣，不朽的道途将绵延万里。\",\"part1\":\"他未曾想过这一天，开拓仿佛就要在此戛然而止。\\n刺鼻的血腥蔓延，坠毁的车厢腾起焦灼的烟尘。他挣扎着站起，在黑暗中摸索方向。\\n滴答，滴答…一片死寂之中，只有生命流逝的回响。\\n「{NICKNAME}……」\\n车厢中变形的构件阻挡了他的去路，他忍着剧痛，将阻碍一一拆除。温热的血顺着他的指尖流下，但他更害怕的是，他已几乎感受不到那熟悉的呼吸。\\n「我们…一起回家。」\\n他喂下随身携带的药物，几近干涸的灵水在掌间盘旋，但对那可怖的伤口，疗愈亦是徒劳。\\n而黑潮造物逡巡，嘶吼着将两人包围。击云寸断，横落荒石。\\n灵水变得殷红，他用尽最后一丝力气，护在{NICKNAME}身前——\\n他喘着气，又一次自噩梦中惊醒。\\n……\\n「怎么，我脸上有东西么？」\\n翌日早餐，灰发的伙伴好奇问道。\\n「幸好并非像梦中那般……」\\n但他并未说出口，只是移开目光，望向窗外的天空，「没什么…吃吧。」\\n奥赫玛的天空依然湛蓝。\\n但他无法克制自己思绪飘散，「三月她还好么……」\\n车厢像一颗灼热的流星坠落，稍后赶来的她是否也会遭遇同样的事故？或者，更糟糕的……\\n他摇摇头，将纷乱的杂念赶走。\\n又是新的一天。\\n带上记录的工具，他准备前往市集。\\n「开拓」的旅途，似乎一切如常。\",\"part2\":\"她/他他的「开拓」，往往从探索与了解开始。\\n「小小丹，抓稳，坐好，启动咯……」\\n他向红发的女孩请教轶失的历史，她们邀请他来一场俯瞰世界的历史课。\\n「悬锋的传统？」\\n「嗯。可以比试一下吗？」\\n他询问金发的王储，一旁，白发青年也跃跃欲试。\\n「我也一起来吧，这种习俗还是得亲身体验才行。」\\n悬锋的雄狮沉默不语，只以架势回应。\\n……\\n他去往树庭，览遍藏书，破碎的世界逐渐在他脑海中勾勒出完整的风貌。\\n为寻找重返星空的方法，他深入废墟探索，查访天外之界的奥秘——\\n他记录自己所经历的一切，正如他在每一站所做的那样。\\n但当世界的命运沉落英雄的肩头，他知道，此番「开拓」绝非冰冷的条目所能概括。\\n那是一场场至为关键的战役。\\n他与伙伴一同终结「纷争」的历史，见证悬锋的王储断绝传统。\\n{NICKNAME}以身入局，归还「岁月」的火种。当自凶险莫测的冥界归来，他仍难忘那日如同自己劫后余生般的喜悦。\\n那也是告别的许多个刹那。\\n圣女千身凋零，智者付之一炬，冥河的女儿永别尘世…他记得离别的时分，他们或悲伤，或欣慰，却从未有一丝后悔。\\n「如果有一天，我们也将走到这一步……」\\n当想到{NICKNAME}的命运，迟迟未能到来的三月七…他也曾为此夜不能寐。\\n「千年来，我们所有人早已准备好迎接牺牲，或为同伴牺牲自己……」\\n他不止一次地看到，织者收拢遗物，为它们绣上一朵金色的花——\\n「现在…已别无遗憾。」\\n与「不朽」的存在相比，他们的生命如同转瞬即逝的飞萤。\\n可他分明看到，那些星星点点的光芒，照彻了彼此曾走过、将走向的夜空。\\n当奥赫玛落入血色的迟暮，神谕中的时刻也将到来。\\n可面对黑衣剑士避无可避的一剑，他的内心反而如同大海一般平静。\\n他相信{NICKNAME}会义无反顾地前进。借着逐火的微光，他也瞥见自己该行之路。\",\"part3\":\"再创世的终点，冰冷的试验场袒露其残酷的内核。\\n「记忆」的巨浪汇成海啸，将开拓的行者淹没。当他醒来，伙伴早已迷失于深不见底的忆域。\\n他仿佛回到踏上列车前孑然一身的日子，然而此刻的痛苦告诉他，这不仅是噩梦。\\n再度踏入忆潮的一瞬，那往日的碎片呼啸着向他涌来——\\n「…心跳和脉搏都很微弱，三月，准备做人工呼吸。」\\n「啊？！我…我没什么经验，丹恒你来吧！」\\n他记得初遇{NICKNAME}时，命运般的相逢。\\n「我只是在想象，咱们仨会遇上什么有趣的事…嘿嘿！」\\n在贝洛伯格的街头，雪曾落满三人的肩头，同享一张热气腾腾的卷饼就能温暖整个冬夜。\\n「…我会以持明后裔的身份，完成我对罗浮的责任。」\\n在{NICKNAME}与三月七的见证下，他摆脱过去的阴影，沉重如雪的过往逐渐被二人的欢声笑语化解。\\n「你在太一之梦里遭遇了什么？」\\n「我梦见列车驶过一站又一站，有人到来，有人离去，而我们五人始终都在，这段旅程似乎永远也不会结束。」\\n在相似的忆域中，他们曾一同冲出匹诺康尼的梦，将最期盼的未来留给现实。\\n「丹恒，你又能做出多少牺牲？」\\n内心的声音质问他此行的决心，而他以决绝的行动回答。\\n濒临凋零的半神将火种交付于他，握住火种的一瞬，千万道生灵渴盼的目光仿佛要将他点燃。\\n在那圣树塌落的时刻，他背负起一个世界的生灵，将血脉与翁法罗斯的大地熔铸。\\n他走向大地根系的深处，寻索伙伴的方向。\\n丛林瀚海之中，他跨越风霜雨雪，穿过死海沙漠，也曾迷失于纷繁的世界。\\n在每一个走入黑暗的时刻，他总能感受到身后，那道亲切的目光。\\n「我们在重走过去的航道，有太多的内容要重新来过，我们需要一个护卫…和记录员。」\\n「我是『丹恒』……」\\n沿着那无法斩断的过往，荒龙怒吼着挣脱一切束缚，向着未竟的前路腾飞——\\n「我是…护卫『开拓』前路之人！」\",\"part4\":\"他仿佛回到了飞驰的星穹列车。\\n他看见列车驶向更广阔的未知，开拓前所未有的航路。\\n在那无限延展的航路之中，他看见一条巨龙在混沌中遨游。\\n它曾沉眠卵中，于某一日蜕生而出。\\n它遇到自己的同类，它们同享一道血脉，一条道途。\\n它掀起磅礴的灵水，行云布雨滋润万物生灵。\\n它支撑起金石大地，拱卫万邦生生不息……\\n它的道路仍在向未来蜿蜒。\\n战火燎过龙鳞，自那灼热中，它一次次蜕尽旧鳞，得换新生。\\n而后与列车一同，向着未来腾跃。\\n……\\n「你说下次，要是列车表面长了洗都洗不掉的星海藤壶，丹恒就可以使出他的…山鸣龙啸，给它磨个砂！」\\n「好主意。你看，丹恒他醒了…要不要打个赌，是好梦还是……」\\n「你们太吵了……」\\n一睁开眼，他便看见{NICKNAME}和三月在自己耳边大声密谋。\\n「说说说说，这个时候睡着，做了什么好梦啦？」\\n三月伸了个懒腰，期待地望着远方。\\n「我来猜，是不是梦到接下来的旅程里，会发生什么？」\\n「……」\\n「那还用说！当然是所有坏蛋都被我们打倒啦！」\\n那时吹过的风，仿佛裹着列车早餐的香气。\\n「我们…一起回家。」\\n他默默立下誓言，一如过去，亦如未来。\"},\"relations\":[{\"targetId\":\"5205\",\"targetName\":\"开拓者\",\"targetRouteId\":\"\",\"relation\":\"要守护的伙伴\",\"description\":\"星穹列车的珍贵同伴；伙伴们是自己迷失时的路标，通向未来，直到下一个「轮回」。 为了拯救翁法罗斯，开拓者留在了权杖内部，后被长夜月困入忆潮之中。以天地为横轴，以时光为纵轴，不论做出出多少牺牲，自己都会带开拓者回家。\",\"avatar\":\"https://act-upload.mihoyo.com/sr-wiki/2025/05/12/193706962/b8a39b3ab7c81ed8e88ca43d6be2f88f_8788668609774406579.png\"},{\"targetId\":\"5736\",\"targetName\":\"长夜月\",\"targetRouteId\":\"march\",\"relation\":\"熟悉又陌生的伙伴\",\"description\":\"熟悉又陌生的「三月七」，强大又棘手的存在，尽管不清楚她的动机与计划，但一定会从她手中平安带回开拓者与三月七。\",\"avatar\":\"https://act-upload.mihoyo.com/sr-wiki/2025/09/23/276833758/918bc50a2a30518a0725fb6d5045214b_8798517069533893451.png\"}],\"gallery\":[{\"src\":\"/gallery/dan-heng/1.webp\",\"alt\":\"丹恒•腾荒官方画廊 1\",\"width\":2048,\"height\":2048,\"category\":\"角色立绘\"},{\"src\":\"/light-cones/dan-heng.webp\",\"alt\":\"丹恒·腾荒专属光锥 纵然山河万程\",\"width\":864,\"height\":1220,\"category\":\"光锥立绘\",\"sourceUrl\":\"https://bbs.mihoyo.com/sr/wiki/content/5998/detail?bbs_presentation_style=no_header\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#05070d\"}],[\"$\",\"meta\",\"3\",{\"name\":\"color-scheme\",\"content\":\"dark\"}]]\ne:null\n"])</script><script>self.__next_f.push([1,"18:I[622,[],\"IconMark\"]\n"])</script><script>self.__next_f.push([1,"10:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"丹恒·腾荒 | 黄金裔档案\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"丹恒·腾荒的城邦、神权、定位与角色故事。\"}],[\"$\",\"meta\",\"2\",{\"name\":\"author\",\"content\":\"Amphoreus Concept Archive\"}],[\"$\",\"meta\",\"3\",{\"name\":\"keywords\",\"content\":\"翁法罗斯,黄金裔,崩坏星穹铁道,WebGL,互动概念站\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:title\",\"content\":\"翁法罗斯 | 黄金裔命运织机\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:description\",\"content\":\"世界以火种记忆，以命运相连。\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:locale\",\"content\":\"zh_CN\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"9\",{\"name\":\"twitter:title\",\"content\":\"翁法罗斯 | 黄金裔命运织机\"}],[\"$\",\"meta\",\"10\",{\"name\":\"twitter:description\",\"content\":\"世界以火种记忆，以命运相连。\"}],[\"$\",\"link\",\"11\",{\"rel\":\"icon\",\"href\":\"/icon.svg?d2387d47ed714e5a\",\"type\":\"image/svg+xml\",\"sizes\":\"any\"}],[\"$\",\"$L18\",\"12\",{}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"15:\"$10:metadata\"\n"])</script></body></html>
