"月蚀蝶\",\"长夜遗庭\"],\"interpretation\":[\"当前页面保留考据槽位，不将社区推测写成官方结论。\"],\"disputedPoints\":[\"全部神话映射均待官方资料与游戏内文本核验。\"],\"confidence\":\"low\",\"sources\":[{\"id\":\"prototype-source-placeholder\",\"title\":\"[待核实: 官方文本]\",\"kind\":\"official\",\"locator\":\"补充官方前瞻、游戏内档案或开发者说明后替换\",\"confidence\":\"low\"}]},\"designMotifs\":[{\"id\":\"march-long-night-veil\",\"verification\":{\"version\":\"3.x\",\"isVerified\":false},\"category\":\"costume\",\"title\":\"长夜面纱\",\"visualDescription\":\"多层黑紫薄纱从肩部垂落，边缘使用冷银与月白色固定。\",\"culturalOrigin\":\"夜神、记忆遮蔽和守夜仪式。\",\"meaning\":[\"面纱让角色可被看见的部分更加有限。\",\"薄纱层数对应记忆被一次次覆盖。\"],\"palette\":[\"#aa66d9\",\"#d7c6e8\",\"#22213a\",\"#9fdbe8\"],\"sourceIds\":[\"prototype-source-placeholder\"]},{\"id\":\"march-mirror-moon\",\"verification\":\"$c:props:record:designMotifs:0:verification\",\"category\":\"ornament\",\"title\":\"镜月回环\",\"visualDescription\":\"头饰与契约图腾使用弦月、镜面和同心环组合，中央保留深色倒影。\",\"culturalOrigin\":\"月相、镜中人和记忆之门的复合意象。\",\"meaning\":[\"圆环指向循环，镜面提示观察者也可能是被观察者。\",\"弦月缺口让结构保持未闭合状态。\"],\"palette\":[\"#aa66d9\",\"#f0d5ff\",\"#38304f\",\"#76cddd\"],\"sourceIds\":[\"prototype-source-placeholder\"]},{\"id\":\"march-shadow-lilac\",\"verification\":\"$c:props:record:designMotifs:0:verification\",\"category\":\"color\",\"title\":\"夜幕紫与冷月光\",\"visualDescription\":\"深紫负责大面积背景，月光白只出现在面部、镜面和武器锋线。\",\"culturalOrigin\":\"夜色、遗忘与旧照片褪色后的颜色层次。\",\"meaning\":[\"低明度紫建立安静而不安的情绪。\",\"冷光描边使角色像从记忆边缘被重新拉回。\"],\"palette\":[\"#aa66d9\",\"#e8d6f5\",\"#19182c\",\"#84d8e3\"],\"sourceIds\":[\"prototype-source-placeholder\"]}],\"relations\":[],\"media\":{\"portrait\":{\"src\":\"/art/march.webp\",\"alt\":\"长夜月角色立绘\"},\"splashArt\":{\"src\":\"/art/march.webp\",\"alt\":\"长夜月超高清立绘\"},\"divineCard\":{\"src\":\"/art/divine/march.webp\",\"alt\":\"长夜月神性铭牌\",\"width\":645,\"height\":1135,\"placeholder\":\"empty\"},\"skillAnimations\":[],\"idleVoice\":[],\"storyVoice\":[],\"ambientVoice\":[],\"gallery\":[]}},\"profile\":{\"name\":\"长夜月\",\"title\":\"陌客到访\",\"rarity\":5,\"city\":\"天外\",\"divinePower\":\"「永夜之帷，欧洛尼斯」\",\"combatRole\":\"召唤忆灵「长夜」进行作战的输出型角色\",\"quote\":\"忘记并不可怕。可怕的是记得为何要忘记。\",\"stories\":{\"detail\":\"与世相隔的忆域，烛火映出过往，于迷雾中悄然熄去。\\n自那影中而来的记忆之子长夜月，隐匿「岁月」火种的黄金裔，掀起「忘却」的浪潮，守护镜中人的心愿\\n——「别担心，我会为你看护『开拓』的前路…不惜任何代价♭」\",\"part1\":\"「亲爱的三月七：\\n见到你就像见到微露的晨光一样，令人期待。\\n也许是我太过心急，就这样出现在了你面前，还好信息素的传播让你误认为那只是一场幻觉。\\n上一次与你这样接近，还是在你试图查探过去的时候，和那时比，你似乎又成长了一些。\\n你与你的伙伴们——{NICKNAME}，丹恒，姬子，瓦尔特，还有那位骑士友人——齐心协力在战斗…那样的大家伙，连我也需稍稍费些力气呢♭\\n记忆就是这么奇妙，不知不觉，你的旅途已经开始了这么久。\\n我仍记得无数贪婪的眼睛在闪烁的星痕后，窥视这具躯体，觊觎这份秘密。\\n即使我能撕裂追捕者的罗网，忆庭的棱光始终追逐身后，任何雨雾或泪珠，在那光影上都会被蒸发为一缕真空。\\n但去往哪里才能摆脱『过去』…摆脱『我』？\\n是那早已失去情感的标本，无处寻觅的『纯美』吗？\\n是那永远游弋，也永恒无归的『巡猎』吗？\\n或是血泪交织，为人憎恨的『毁灭』？\\n……\\n直到一束刺眼的灯光自远处射来，让眼前的视野几近曝光泛白。\\n但那瞬间确实启发了我。\\n——你需要一个空白的『起点』。所以我闭上了眼睛。\\n现在我有机会告诉你了——那是来自列车的灯光。像一颗流星。\\n你的，\\n『长夜月』♭」\\n——深藏心底的声音\",\"part2\":\"「亲爱的三月七：\\n三月，永夜已然落下帷幕。安心睡吧。\\n你关心的人们，我会替你记录他们的轨迹。\\n待你醒来的那一天，你会知晓它们是否值得被记住，又是否需要被遗忘。\\n碎作千身的少女，在你的帮助下才能安然踏上旅途。\\n即便如此，等待着她的依旧是相似的命运：她们向世人宣告逐火的神谕，而其中的大多数仍旧凋零在那血与火的纷争之中。\\n……\\n歌声美妙的剑旗，与那燃冕的女王一同拉起弑神的大幕。\\n可那些欢庆胜利的醉宴，彼此的救赎，在神明的践踏下如同空中纷舞的泡沫一般消散。\\n……\\n如果将这些岁月汇成一本关于逐火之旅的手账，那一定缀满了徒劳的词句，凋零的花朵。\\n但我想，倘若你看到了，你也会赌上自己的生命，为同伴永远『开拓』下去，与未知的远方无数次相遇。\\n就像你当时向我求援的那样，不是么？\\n我会以『记忆』的力量，抚慰那些悲伤的岁月。\\n我也会保护你那还未抵达的伙伴，让他们免受窃忆者的伤害。\\n你的心中一直有着毫无保留的信任，信任你的伙伴会与英雄联手改写徒劳而悲伤的结局。\\n信任「开拓」会为过往踏足的每个世界都带来改变。\\n晚安，三月。\\n希望你醒来的那一天，我能送给你…描绘着美好结局的「未来」♭\\n你的，\\n『长夜月』♭」\\n——深藏心底的声音\",\"part3\":\"「亲爱的三月七：\\n夜是如此漫长…是因为听不到你的声音么？\\n我庆幸你的沉睡，如此便不必亲眼目睹翁法罗斯的午夜，这处你最初抵达的遗迹，埋藏着最无情的，遗忘的气息。\\n无边的噩梦从这里涌出，吞没银河…你不会喜欢的。\\n就像我曾经的困惑一样——被记忆裹挟的「过去」，无法诞生任何新的「未来」。\\n三千万世，那女孩徒劳地将记忆收集，向天外主宰记忆的神明祈祷。\\n可那些伤痕累累的回忆，那粉饰为『英雄故事』的记忆的涟漪，都是毁灭的薪柴…他们，真的会有任何结果么？\\n可奇怪的是，那女孩的一举一动，她所描绘的故事，有时让我想起了你。你也总在每次旅程之后，绘声绘色地讲述自己的冒险故事，想象奇妙的未来。\\n你爱说，有一天，你会用相机的闪光灯，为大家照亮探索的前路。\\n你曾说，你一定会用上『斩星破宙•大琉璃剑』保护列车组的所有人。\\n你也说，你会变得成熟、优雅、强大，带领着大家前进。\\n你的那些遐想…一笔一划都勾勒在我的沉眠中。\\n那么…如果是你，在听到一个无缘未来的故事时，会想做怎样的润色呢？\\n我也曾思考，怎样让那女孩讲的『故事』，不徘徊在周而复始的岁月里…你应该理所当然就会这么做吧？\\n但当我透过岁月的罅隙窥视这个世界『记忆』的始末时…我知道那伪善的天父，祂早已背向翁法罗斯，将目光朝向『毁灭』。而祂狂热的信徒，也将追着记忆的残照，再次寻上你……\\n纵然是你的伙伴，开拓的行者们，他们的到来不过延缓了孕育『毁灭』的进度——\\n我们唯一的出路，一场彻底的『感官之雨』，它会涤净这里一切徒劳而惨烈的痕迹，你的伙伴，只需要一场沉睡，便能迎来再度启程的机会。\\n这场『雨』不会持续太久，它会将一切痛苦的记忆冲刷殆尽——也许「忘却」才是唯一出口。\\n然后，我就可以在这本名为「翁法罗斯」的手账中，真正贴上你想要的未来。\\n不要睁眼，三月。\\n残酷的事，就由我代劳吧♭\\n你的，\\n『长夜月』♭」\\n——深藏心底的声音\",\"part4\":\"「亲爱的三月七：\\n天快亮了。\\n我很庆幸，在最接近黑暗的时刻，又看见了那缕光。\\n它们曾是我长眠时，如梦般的浮光掠影。\\n我曾在匹诺康尼光怪陆离的记忆中梦见过，在鳞渊境惊叹过，雅利落-VI的风雪也无法阻挡它的温暖。\\n如今，尽管我将要沉入熟悉的夜色，也能感知到身后的视线。\\n他们在等待『你』。\\n也许我不该假意被你说服。说不担心那是骗你的。你们真的能抵御「毁灭」的浊流吗。你能照顾好自己吗。他们能守护好你吗。你会变成什么模样呢。你自己有不一样的答案吗。你会后悔吗。\\n我会后悔吗。\\n我会后悔吗。\\n我会后悔吗。\\n你早已向我摊开所有回忆，毫无保留。我知道，你们所言的『开拓』是承载过去，连接现在，并勇敢驶向未来的旅程，而非建立在一张白纸上的海市蜃楼。\\n我不知道你是否能成功，但也许无论结局如何，我此刻能选择的，只有现在的你。我能望向的，也只有未来的你。\\n我也会想，如果有一天我离开了，要留给你什么呢？\\n力量。否认。身份。告诫。习惯。祝福。\\n可这本就是你的人生，我能留给你最好的礼物…就是待你自己描绘的一片空白。\\n就像『三月七』这个名字，别出心裁，又多么贴切。\\n更重要的是，它只属于你。\\n去吧，三月。\\n这场不期而至的相逢，就把它当成滋润你的一场细雨。\\n将空白的未来，染上属于你的颜色♭\\n你的，\\n『长夜月』♭」\\n——深藏心底的声音\\n「亲爱的长夜月：\\n不知道你能不能听到，我就在心里说啦~\\n其实，我有听到一些你的心声哦，虽然你神秘又强大，但我知道，我们其实没有什么不一样的！说着要把记忆都烧光，明明你记得比我都清楚，对吧~\\n偷偷和你说，我以前也时常会幻想能变成这样…就是那种…特别厉害，特别优雅的人！\\n谢谢你保护了我的伙伴，也谢谢你为我们兜底！\\n但人总是要学着长大，看，在迈向未来的路上，我迈出了一大步！\\n我会一直走一直走，总有一天，我们会一起见证，『我』的过去，『我』的未来！\\n你的，\\n『三月七』」\\n——深藏心底的声音\"},\"relations\":[{\"targetId\":\"48\",\"targetName\":\"三月七\",\"targetRouteId\":\"\",\"relation\":\"最珍视的存在\",\"description\":\"自己是为了守护三月七的未来而存在。 极其重视她的愿望，不惜以极端的手段将其实现。最终为三月七与列车组伙伴们之间的羁绊感到欣慰，并留下自己的力量供三月七来日保护自己使用。\",\"avatar\":\"https://act-upload.mihoyo.com/sr-wiki/2025/08/20/281496331/802d6718df35808173fc82e2c6005779_5106876418074496830.png\"},{\"targetId\":\"5737\",\"targetName\":\"丹恒•腾荒\",\"targetRouteId\":\"dan-heng\",\"relation\":\"三月七的好伙伴\",\"description\":\"作为三月七看重的伙伴，也被列入自己保护的范围内。 在翁法罗斯的劫难中，长夜月得以亲眼见证列车组伙伴们与三月七的羁绊，她也可以安心放手，将三月七托付予他们。\",\"avatar\":\"https://act-upload.mihoyo.com/sr-wiki/2025/09/12/276833758/820b8cd62af354af2872c281b03e71c9_825027542128808001.png\"},{\"targetId\":\"5205\",\"targetName\":\"开拓者\",\"targetRouteId\":\"\",\"relation\":\"三月七的好伙伴\",\"description\":\"作为三月七看重的伙伴，也被列入自己保护的范围内。 再创世计划中的重要一环，作为接过负世者，打算以其记忆作为蓝本重新编篡世界的因果。\",\"avatar\":\"https://act-upload.mihoyo.com/sr-wiki/2025/05/12/193706962/b8a39b3ab7c81ed8e88ca43d6be2f88f_8788668609774406579.png\"}],\"gallery\":[{\"src\":\"/gallery/march/1.webp\",\"alt\":\"长夜月官方画廊 1\",\"width\":2048,\"height\":2048,\"category\":\"角色立绘\"},{\"src\":\"/light-cones/march.webp\",\"alt\":\"长夜月专属光锥 致长夜的星光\",\"width\":864,\"height\":1220,\"category\":\"光锥立绘\",\"sourceUrl\":\"https://bbs.mihoyo.com/sr/wiki/content/5910/detail?bbs_presentation_style=no_header\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#05070d\"}],[\"$\",\"meta\",\"3\",{\"name\":\"color-scheme\",\"content\":\"dark\"}]]\ne:null\n"])</script><script>self.__next_f.push([1,"19:I[622,[],\"IconMark\"]\n"])</script><script>self.__next_f.push([1,"10:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"长夜月 | 黄金裔档案\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"长夜月的城邦、神权、定位与角色故事。\"}],[\"$\",\"meta\",\"2\",{\"name\":\"author\",\"content\":\"Amphoreus Concept Archive\"}],[\"$\",\"meta\",\"3\",{\"name\":\"keywords\",\"content\":\"翁法罗斯,黄金裔,崩坏星穹铁道,WebGL,互动概念站\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:title\",\"content\":\"翁法罗斯 | 黄金裔命运织机\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:description\",\"content\":\"世界以火种记忆，以命运相连。\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:locale\",\"content\":\"zh_CN\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"9\",{\"name\":\"twitter:title\",\"content\":\"翁法罗斯 | 黄金裔命运织机\"}],[\"$\",\"meta\",\"10\",{\"name\":\"twitter:description\",\"content\":\"世界以火种记忆，以命运相连。\"}],[\"$\",\"link\",\"11\",{\"rel\":\"icon\",\"href\":\"/icon.svg?d2387d47ed714e5a\",\"type\":\"image/svg+xml\",\"sizes\":\"any\"}],[\"$\",\"$L19\",\"12\",{}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.p
