一枚棋子天生该被舍弃。\",\"她以理性冻结战争的温度，让所有可能同时留在眼前。可当唯一正确的解通向孤独，她仍会落下那一步。\"],\"quotes\":[{\"text\":\"我从不赌命运。我只计算它还剩多少选择。\"}],\"assets\":{\"splashArt\":\"/art/cerydra.webp\",\"totemIcon\":\"/totems/harmony.svg\",\"bgMusic\":\"\",\"themeColor\":\"#55bfe9\",\"shaderParams\":{\"pulse\":0.5,\"turbulence\":0.24}},\"rarity\":5,\"city\":\"奥赫玛\",\"divinePower\":\"「公正之秤，塔兰顿」\",\"combatRole\":\"可以使队友连续施放两次战技的辅助型角色\",\"stories\":{\"detail\":\"刻律德菈把世界视作棋盘，又拒绝接受任何一枚棋子天生该被舍弃。\\n\\n她以理性冻结战争的温度，让所有可能同时留在眼前。可当唯一正确的解通向孤独，她仍会落下那一步。\",\"part1\":\"刻律德菈把世界视作棋盘，又拒绝接受任何一枚棋子天生该被舍弃。\",\"part2\":\"她以理性冻结战争的温度，让所有可能同时留在眼前。可当唯一正确的解通向孤独，她仍会落下那一步。\",\"part3\":\"刻律德菈的传说并未止于自身。关于奥赫玛的记录，仍随着火种与远征被不断重写。\",\"part4\":\"“我从不赌命运。我只计算它还剩多少选择。”\\n\\n这份选择被后世视为命运织机上最清晰的回声之一。\"},\"verification\":{\"version\":\"3.x\",\"isVerified\":false},\"researchStatus\":\"placeholder\",\"editorialNotes\":[\"当前角色尚未录入完整考据数据。\",\"本页只展示可验证的数据结构，不提供未经确认的神话对应关系。\"],\"prototype\":{\"verification\":{\"version\":\"3.x\",\"isVerified\":false},\"archetype\":\"[待核实: 官方文本]\",\"source\":\"原型来源 [待核实: 官方文本]；在证据补齐前不建立确定映射。\",\"tradition\":\"[待核实: 官方文本]\",\"primaryFigures\":[\"[待核实: 官方文本]\"],\"alternativeFigures\":[],\"narrativeFunction\":\"需要结合角色剧情、技能命名、服饰符号和官方设定文本继续核验。\",\"symbols\":[\"逆王冠\",\"棋局星庭\"],\"interpretation\":[\"当前页面保留考据槽位，不将社区推测写成官方结论。\"],\"disputedPoints\":[\"全部神话映射均待官方资料与游戏内文本核验。\"],\"confidence\":\"low\",\"sources\":[{\"id\":\"prototype-source-placeholder\",\"title\":\"[待核实: 官方文本]\",\"kind\":\"official\",\"locator\":\"补充官方前瞻、游戏内档案或开发者说明后替换\",\"confidence\":\"low\"}]},\"designMotifs\":[{\"id\":\"cerydra-chess-crown\",\"verification\":{\"version\":\"3.x\",\"isVerified\":false},\"category\":\"ornament\",\"title\":\"棋盘王冠\",\"visualDescription\":\"头冠由方形棋格、尖塔和冷色宝石组成，像一顶被拆开又重新组合的王冠。\",\"culturalOrigin\":\"国际象棋、帝国冠冕与法庭权杖。\",\"meaning\":[\"棋格说明她把自己和所有人都视为变量。\",\"尖锐冠形让理性带上不可亲近的压迫感。\"],\"palette\":[\"#55bfe9\",\"#e9eef5\",\"#1d3f72\",\"#b88b4f\"],\"sourceIds\":[\"prototype-source-placeholder\"]},{\"id\":\"cerydra-death-piece\",\"verification\":\"$c:props:record:designMotifs:0:verification\",\"category\":\"weapon\",\"title\":\"死棋权杖\",\"visualDescription\":\"武器末端同时具有棋子和笔锋轮廓，冷蓝能量沿几何刻线排列。\",\"culturalOrigin\":\"审判、落子与不可逆决策的仪式道具。\",\"meaning\":[\"棋子落在终点时也意味着一个选择被排除。\",\"几何刻线强调律法而非情绪。\"],\"palette\":[\"#55bfe9\",\"#8aa9d8\",\"#13294f\",\"#f4f1e8\"],\"sourceIds\":[\"prototype-source-placeholder\"]},{\"id\":\"cerydra-ice-law\",\"verification\":\"$c:props:record:designMotifs:0:verification\",\"category\":\"color\",\"title\":\"冰蓝律法色\",\"visualDescription\":\"冰蓝用于眼睛、晶体和能量核心，银白用于甲片，金色集中在外轮廓。\",\"culturalOrigin\":\"寒地帝国、审判庭和星图测绘。\",\"meaning\":[\"冷色让权威显得清晰而不容质疑。\",\"金色外框提示理性和皇权依然需要仪式承载。\"],\"palette\":[\"#55bfe9\",\"#d7e5ee\",\"#1c3154\",\"#c59b58\"],\"sourceIds\":[\"prototype-source-placeholder\"]}],\"relations\":[],\"media\":{\"portrait\":{\"src\":\"/art/cerydra.webp\",\"alt\":\"刻律德菈角色立绘\"},\"splashArt\":{\"src\":\"/art/cerydra.webp\",\"alt\":\"刻律德菈超高清立绘\"},\"divineCard\":{\"src\":\"/art/divine/cerydra.webp\",\"alt\":\"刻律德菈神性铭牌\",\"width\":645,\"height\":1135,\"placeholder\":\"empty\"},\"skillAnimations\":[],\"idleVoice\":[],\"storyVoice\":[],\"ambientVoice\":[],\"gallery\":[]}},\"profile\":{\"name\":\"刻律德菈\",\"title\":\"君执死棋\",\"rarity\":5,\"city\":\"奥赫玛\",\"divinePower\":\"「公正之秤，塔兰顿」\",\"combatRole\":\"可以使队友连续施放两次战技的辅助型角色\",\"quote\":\"我从不赌命运。我只计算它还剩多少选择。\",\"stories\":{\"detail\":\"北境帝国，失落的王朝，寒冷的疆土燃烧着征伐的野心。\\n君主刻律德菈，执握「律法」火种的黄金裔，布局设子，与神相弈，审判异心的罪囚，为此世奠定逐火的基业\\n——「这绝非终点，翁法罗斯的征途，当是银河群星！」\",\"part1\":\"北境帝国许珀耳，严寒的国土燃烧着不熄的野心。\\n自那无嗣的君主陨落，继位者悬空，帝国已然四分五裂，内战不止。\\n失去家园的难民踏上乞讨为生之路，受伤的女孩因那一头罕见的蓝发在皑皑冰雪中格外显眼。\\n「只有受塔兰顿赐福的王室，才有如同火焰一般飘扬的蓝发，也唯有天选之人，才能流淌金色的鲜血……」\\n只因偶然的一瞥，野心勃勃的贵族将乞儿收养，向外散播着流浪王女的传言。\\n她被带上辉煌的高台，贵族高举她的手臂，那刺破的指尖滴下如同黎明一般浓郁的金血。\\n台下民众眼神狂热，那灼热的期待似乎要将她一同点燃。\\n「从此刻起，你就是王女『刻律德菈』。」\\n贵族将她带入宫殿，她穿上华美沉重的服装。\\n「刻律…德菈？」\\n只因一刻犹豫，脸上火辣的刺痛几乎让她流下眼泪。\\n「我是，我是…刻律…德菈……\\n「我是刻律德菈。\\n「我是。」\\n她忍住自己的颤抖，任由耳边的哭喊远去\\n——那是上一任王女的哀嚎。\\n她日复一日地学习皇室礼仪，直到狭窄的束腰再也不会让她疼痛，直到她能面不改色地大声演讲——\\n「王女年幼，我将摄政，统理许珀耳帝国政务。」贵族以她的名义收拢人心，将王室之权据为己有。\\n「反正都是任人摆弄的弃子，她扮演得还不错，可以留着。」阴影里，新任的摄政王对宰相窃笑。\\n幽闭的时光望不到尽头，稚龄的「王女」将目光从远方隐约的星空移开，落回眼前的棋盘。\\n这是她用于自保的游戏。\\n「骄傲的王女，你的眼睛似乎总在观察，也似乎总在隐藏，就像……」\\n「就像什么？」\\n悄然几手间，她将要抵达棋盘的边境。\\n「就像…将要燃起的火焰……」\\n老师苦笑着掷下棋子，千百次的对弈中，已没有王女无法解开的棋局。\",\"part2\":\"宫女与侍卫无权无势，却是流动的宫廷中无孔不入的眼线——\\n她以恩惠拉拢，搜集情报，布下纵横交错的棋路。\\n与新王不和的旧贵族暗中谋划反叛，将刺客安排入王的禁卫军——\\n她假意与之合作，布下借刀杀人的「马」。\\n帝国人民爱戴她虚假的血统，于是她体恤孤老，扶助弱小——\\n那日益高涨的名声为她拉拢人心，布下力量磅礴的「车」。\\n「请于幕匿三刻，帐中相候，有要事密告——您忠诚的宰相。」\\n各怀鬼胎的重臣意欲外征，当密信交付于她，她知晓关键的「象」已经出现。\\n烛火在帐内勾勒出虚伪的影子。宰相脸上挂着笑容，就像一幅失色的画。\\n「北地不似那温暖的南方。」他指向桌上的地图，「蜗居于此，许珀耳必亡。我已联络大陆上最优秀的佣兵，王希望您能亲征……」\\n她未尝不知自己已被视弃子，一旦失败便要背负一切责任。\\n但她已等待太久，不孤注一掷，怎可颠覆一切？\\n穿越埃普斯群山，她抓住吕奎亚城发动反抗战争的机会，率军击溃他们的同时将金血将领福特图多收入麾下，更为自己赢得军心。\\n一城、两城、三城…许珀耳的军队如火焰燎原，当蓝发的少女高举旗帜，铁蹄将踏破她所指向的国度——\\n她望着初具雏形的大军，知晓最后的「兵」也已即位。\\n在那漆黑的雪夜，凯旋的王女骑乘银白的骏马，带领大军撞开国门，宣读崭新的律令——\\n「今日起，我将为许珀耳带来公正！」\\n摄政的「王」从寝宫中被拖出，拒绝服从的臣子与旧部尽皆倒在军士的锋刃之下。\\n「她…她不是刻律德菈！」\\n她站在高台，划破手腕，黄金血伴随众人的嗤笑滴落，将「王」的绝望淹没。\\n「摄政王荒淫无道，大乱天下，我以『律法』之名宣判汝——」\\n北地的寒风中，她的蓝发猎猎飞舞，如同火焰般耀眼。\\n「火刑！」\\n火光中，她戴上了那顶属于帝王的冠冕——她唯一的战利品。\\n一簇幽蓝色的火苗自冠冕顶端燃起，此后再不曾熄灭。\",\"part3\":\"三相的神谕自雅努萨波利斯，传向大地上无尽纷争的城邦。\\n「拯救世界…从来不是执棋者的兴趣。」\\n她品味神谕，熊熊燃烧的未来仿佛就在眼前——\\n「但与那自视为主宰的神明相争，乃至走向天外…的确是旷古而绝世的一局！」\\n漫漫长夜中，她如璀璨的灯火吸引流淌金血的人子：\\n奥赫玛的议院中，黄金裔与平民共享争论与决议的公民权。\\n宏伟的图书馆拔地而起，逐火的使命人人皆可获取。\\n军队的旧习被废除，深海的游鱼搁浅在陆地，循着血与火的气味成为她的剑旗。\\n奥赫玛的政坛中，圣城的「金织」冉冉升起，金丝的颤动将众人的命运彼此连缀。\\n……\\n但那棋盘以黄金之血勾勒，她的对手是神明。即便她以燃烧之痛换来冠冕，以永驻幼年换取未来，胜利的天平似乎从未真正倾向人子。\\n「逐火是不断失却的旅途……\\n「唯有同等的代价，才能交换同等的胜利。但要击落神明，还远远不够……」\\n她日日夜夜推演，不愿自己的忧虑被人看见。\\n「既然你是棋手，我们便是棋子，对吧？」\\n不等她的回答，以剑为琴的少女洗去手上的血腥，点了点头。\\n「我明白了。」\\n唯有此时，那高傲的女皇才会罕见地沉默。\\n「如果可以……」\\n她的脸上浮现一丝似有若无的苦涩。\\n「不，没有如果。」\\n猎夺「海洋」火种的战役前，她再一次站在高台，望着五百位屏息等待谕令的臣子。\\n「诸位——」\\n当她的声音响起，欢呼声响彻云霄。\\n「今日，『海洋』将为我们倾覆，那『毁灭』的巨兽将成为无往而不利的武器，为征服星海举杯吧！」\\n她知道前方是有去无回的血海，但她必须扮演斩钉截铁的君王。\\n再一次，她仿佛听到老师的告诫——\\n「棋是牺牲的艺术。\\n因此，棋手须首先立下必死的决心。」\",\"part4\":\"「啪嗒……」\\n血滴入水中，掀起金色的涟漪。\\n「剑旗爵，你可曾想过，此战之后，我们该去往何方？」\\n执剑的少女沉默许久，摇了摇头。\\n「等到反叛的浪花散尽，我们就去向星海，那里一定有你想要的清澈大海。」\\n她露出一抹微笑，挥杖向天。\\n「众神让我们相互厮杀，让翁法罗斯自绝于银河，我便要剑指众神。无论是天下的众神，还是天外的众神。」\\n「啪嗒……」\\n血滴入水中，掀起金色的涟漪。\\n「剑旗爵，若有一天，我命令你向我挥剑，你会怎么办？」\\n少女继续沉默以对，以为那不过又是一个残忍的玩笑。\\n「请一定用最锋利的剑刃。这样，才对得起那些因我而牺牲的将士。」\\n她将代表自己的棋子掷出棋局——\\n「瞧，有舍才有得，棋路宽阔多了。」\\n「啪嗒……」\\n血滴入水中，掀起金色的涟漪。\\n「剑旗爵，你觉得谁能在我们身后，接过逐火的重任？」\\n她们不约而同看向了远处的「金织」。\\n「这尾小金鳟，终会变成池中的大鱼儿。」\\n「啪嗒……」\\n血滴入水中，掀起金色的涟漪。\\n「许多人猜测我向塔兰顿交易了什么，百战百胜的力量，还是律法的权能…呵，那根本无需神明的帮助……」\\n故人身影消散，她感到寒冷逼近，天空漆黑一片，仿佛没有星光的洞穴。\\n很久以前，她也曾在彻骨的寒冷中，亲眼见到流着黄金血的孩子被带走。\\n「可在那吃人的世道，让自己拥有黄金的血…才有推翻这一切的机会，哪怕…我将以此模样度过一生……」\\n蓝发的女孩闭上双眼。\\n「但真正的愿望自始至终…只有一个……」\\n从几乎冻毙荒野的乞儿，到傀儡一般的王女，到与神相争的领袖，她亲手将自己擢升为棋手，又亲手将自己当作弃子抹去——\\n「我要，征服世间不公的命运！」\"},\"relations\":[{\"targetId\":\"5205\",\"targetName\":\"开拓者\",\"targetRouteId\":\"\",\"relation\":\"天外的救世主\",\"description\":\"天外的救世主： 棋局收官，你与我的征服已毕。 但你应知晓，此战绝非凯撒征程的终点。 我已见，宇宙的广袤远超世人目之所及。 哪怕重蹈此生，于万千年后，我必将行至天外。 然后，我会重启伟大的征程，直至征服星海。 这并非我对翁法罗斯的畅想，而是我对我的帝国宣颁的铁律： 「你的子民会行军越野，以宇宙为粮仓，杀死必须杀死的敌人。」 收下这枚王棋吧，作为这道铁律的见证，亦是凯撒的封赏。 它曾随我出征，随我驰骋，随我凯旋，随我踏碎众邦的律法， 如今，它将如我掷下的砝码，令胜利的天平朝你俯身。 带着这枚棋子，去往更广阔的棋盘， 待凯撒归来，你可再度为我的律法而战—— 亦或忤逆它，与我博弈一番。 翁法罗斯的凯撒\",\"avatar\":\"https://act-upload.mihoyo.com/sr-wiki/2025/05/12/193706962/b8a39b3ab7c81ed8e88ca43d6be2f88f_8788668609774406579.png\"},{\"targetId\":\"5851\",\"targetName\":\"昔涟\",\"targetRouteId\":\"cyrene\",\"relation\":\"共同拯救翁法罗斯的伙伴\",\"description\":\"「我欣赏她的语调，既非奉承，亦非戏谑…认真说来，似乎更贴近你们常说的…友情？」\",\"avatar\":\"https://act-upload.mihoyo.com/sr-wiki/2025/10/24/276833758/e9ed857da6708dab40ec97b9d22343b5_5036078703727400193.png\"}],\"gallery\":[{\"src\":\"/light-cones/cerydra.webp\",\"alt\":\"刻律德菈专属光锥 金血铭刻的时代\",\"width\":864,\"height\":1220,\"category\":\"光锥立绘\",\"sourceUrl\":\"https://bbs.mihoyo.com/sr/wiki/content/5847/detail?bbs_presentation_style=no_header\"},{\"src\":\"/gallery/cerydra/1.webp\",\"alt\":\"刻律德菈官方画廊 1\",\"width\":7680,\"height\":4184,\"category\":\"游戏CG\"},{\"src\":\"/gallery/cerydra/2.webp\",\"alt\":\"刻律德菈官方画廊 2\",\"width\":7680,\"height\":4180,\"category\":\"游戏CG\"},{\"src\":\"/gallery/cerydra/3.webp\",\"alt\":\"刻律德菈官方画廊 3\",\"width\":7680,\"height\":4124,\"category\":\"游戏CG\"},{\"src\":\"/gallery/cerydra/4.webp\",\"alt\":\"刻律德菈官方画廊 4\",\"width\":7680,\"height\":4192,\"category\":\"游戏CG\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#05070d\"}],[\"$\",\"meta\",\"3\",{\"name\":\"color-scheme\",\"content\":\"dark\"}]]\ne:null\n"])</script><script>self.__next_f.push([1,"18:I[622,[],\"IconMark\"]\n"])</script><script>self.__next_f.push([1,"10:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"刻律德菈 | 黄金裔档案\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"刻律德菈的城邦、神权、定位与角色故事。\"}],[\"$\",\"meta\",\"2\",{\"name\":\"author\",\"content\":\"Amphoreus Concept Archive\"}],[\"$\",\"meta\",\"3\",{\"name\":\"keywords\",\"content\":\"翁法罗斯,黄金裔,崩坏星穹铁道,WebGL,互动概念站\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:title\",\"content\":\"翁法罗斯 | 黄金裔命运织机\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:description\",\"content\":\"世界以火种记忆，以命运相连。\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:locale\",\"content\":\"zh_CN\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"9\",{\"name\":\"twitter:title\",\"content\":\"翁法罗斯 | 黄金裔命运织机\"}],[\"$\",\"meta\",\"10\",{\"name\":\"twitter:description\",\"content\":\"世界以火种记忆，以命运相连。\"}],[\"$\",\"link\",\"11\",{\"rel\":\"icon\",\"href\":\"/icon.svg?d2387d47ed714e5a\",\"type\":\"image/svg+xml\",\"sizes\":\"any\"}],[\"$\",\"$L18\",\"12\",{}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"15:\"$10:metadata\"\n"])</script></body></html>
