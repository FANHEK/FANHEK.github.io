歌声仍在浮浪间回荡。\\n大海的女儿海列屈拉，清洗「海洋」火种的黄金裔，驱散污浊的暗流，为天外的英雄奏响不醉不归的盛宴\\n——散场之时未到，纵然希望如泡沫般易碎，浪花也将一往无前。\",\"part1\":\"阳光穿透进来时，大海的呼吸会变得五彩斑斓，这是海妖们一天中最为欢悦的时刻。\\n「♫啪嗒♫」「♫皮咔♫」「♫波砰♫」\\n海妖的公主雀跃地追逐着泡泡，她最喜欢它们在鼻尖短暂停留然后碎裂的片刻，此时水波会荡漾出七彩的光。\\n在那万顷的珊瑚丛中，海妖们歌唱着，那里的珠贝熠熠生光，正适合装点于琴弓之上。\\n乐音从海列屈拉的指尖流淌，如同和缓的水流，拂过惬意畅饮蜜酿的伙伴。\\n「♫瞧，那辉煌热闹的航船上，人类该有多么欢畅♫」\\n「♫你思念救起的那人，他的声音定然在你心中回荡♫」\\n「♫尊贵的公主，无忧无虑的海列屈拉，你会去向何方？是那北境寒冷的冰海，还是人世的苍茫？♫」\\n饮醉了的海妖们围在她身旁，好奇心就像摇曳的海草缠住她。\\n「♫尘世嘈杂，极地冰凉……♫」\\n她轻轻拂过泡泡，微笑着摇头回答：\\n「♫我愿栖身，在那能欢唱的……♫」\\n然而警戒的号角很快自深海传出，终止了欢宴。\\n海妖们随海列屈拉游向深处，海洋的女王向子民宣告——\\n「♫黑色的潮水将污染那清澈的洋流，我们要调动灵水的波涛，将污水涌引入巨杯，直至『纷争』抵御黑潮的光芒……♫\\n「♫海洋的宠儿，你可有心之所向？等到黑潮退尽，去往斯缇科西亚，自有陆上的人们为尔等设宴歌唱！♫」\\n日复一日，海列屈拉带领海妖穿梭在那逐渐昏黑的海洋，清洗污浊的暗流。\\n「♫伙伴们，别放弃，那不醉不归的辉煌♫\\n「♫伙伴们，别忘记，我们将要游向远方♫\\n「♫伙伴们，向前啊，斑斓的希望正荡漾♫」\\n日复一日，海列屈拉歌唱着。身为眷属，她深知守护这片大海是自己生来的使命——\\n海列屈拉向深渊游去，那歌声逐渐化作漆黑深海中，唯一的一束光。\",\"part2\":\"广袤的珊瑚礁已成一片死地。\\n第一次将剑刺入黑潮造物的身体时，她的双手仍会轻轻地颤抖。\\n第一百次与腐朽的昔日伙伴相向，那暗哑的弦已能毫不费力地割开喉咙。\\n第一千次，第一万次…提琴的珠光零落在海面，而深海已成血色——\\n在那寂然无声的宫殿废墟，只剩海列屈拉与她一个人的欢宴。\\n「♫陆地上的人们呐，会举办永不散场的欢宴，将我们的牺牲奖赏……♫」\\n哀婉的歌声回荡，当「纷争」的泰坦接过抵御黑潮的使命，欣喜的海列屈拉第一次踏出昏黑的海水。\\n她用珠贝妆点面容，她的尾鳍变为双腿，身上的泡沫化作盛装。波澜不再在她的头顶怒吼，而是在脚下呻吟。\\n海鸟围绕着大海盘旋，声声凄厉。波涛息止了一瞬，又再次滚滚而逝去。\\n就像是泡影破裂之后，什么都不曾存在过一样。\\n她忍受着每一步锥心刺骨的疼痛，前往应许的斯缇科西亚——\\n这片大地有刺鼻的空气，堆积如山的尸骨，纷争与战火…却唯独没有那场神明许诺的欢宴之地。\\n「我……海……瑟……」\\n在那污浊的空气中，她的声音喑哑。\\n她学习人类的话语，但那些喧嚣的字眼让她无法再如歌般吟唱。她逐渐学会以沉默代替言语。\\n「一柄不会锈蚀的刀剑」，「一曲冷酷的琴音」…终日与她相伴的，是刺穿肌体的弹响，是生命洒血的悲鸣——\\n他们说，那来自海洋的剑士明明极善演奏，却缄默疏离，从不言明心迹。\\n她看见向自己伸来的许多双手，有些意图将她抹杀，有些则声称会为她提供援助，它们曾点燃一盏盏灯火，然后一盏盏熄灭。\\n「海瑟音，你在往何处去？」\\n她无法回答。\\n旧日的琴已化为两把利剑，唯有锋利的挽歌流淌弦上。\\n即便渴望有一日会有人听懂其中向往，但她逐渐意识到人世也与寂寞的深海无异。\\n每个人都像是迷失的鱼儿，每个人都在盲目地朝着光芒游去。\",\"part3\":\"「海瑟音，追随我，我会赐予你所求的一切。」\\n她对那从娇小身躯里发出的响亮声音印象深刻，却仍心有怀疑：\\n「她…又会在什么时候熄灭呢？」\\n然而这簇灯火像射入深海的天光，愈燃愈烈，持久不熄。\\n人们见蓝色的烈焰征战无数，次次凯旋，见巨浪如火燎原，见那卷起风浪的剑旗，也化作鲸鲨将腥风血雨尽数吞咽。\\n她听到炽烈的心跳，激昂的战鼓，雨点般的脚步，潮涌般的悲伤…纯粹如歌的心声自黄金裔的血中流淌，也同样拨动她尘封已久的心弦。\\n凯撒应许的盛宴在即，年轻的织者与孩童附耳私语，不知那淡漠的剑旗是否愿拨冗出席。\\n在众人的惊呼声中，织者踮起脚尖，屏住呼吸，想要将这一刻尽收眼底。\\n她鎏金的裙摆掠过地砖的光色，竟如阳光下的浪花般晶莹剔透。\\n火烛银花下，人们再次看见了大海的光晕。\\n「她应下我的心愿，为我们歌唱世界早已遗失的海湾。」\\n君王的话语落下，乐池亮起，灯光与人影在她眼前荡成海的涟漪。\\n乐声乘着杯盏中摇曳的泡影，人海中，她发现自己的声音不再空有回响。\\n拉比努斯和塞涅卡的比斗是清脆的鼓点，维吉妮娅暗藏心意的诗句是律动的词。\\n缇里西庇俄丝笑了，于是乐曲有了轻灵的复调，阿格莱雅的舞步扬起，那是最优美动人的和音……\\n「此战胜利之后，剑旗爵，你可有想要之物？」\\n那冷静的君主竟也有些微醺。\\n她饮下蜜酿，向君主私语，笑声飞翔在宴会的角落。\\n这里多么悦耳，多么光亮。\\n世界旋转着，酒杯相撞的声音，冰块滑动的声音。\\n久未开口的海妖，她的歌声仍如蜜酿泼洒——\\n「♫宴席的烛火如此耀眼\\n一片新的大海\\n它摇荡在我们举杯碰撞间……♫」\",\"part4\":\"她曾以为，「逐火」便是她寻找的、永不散席的盛宴。\\n可在那不断失却的旅途中，光芒也终如泡沫般碎裂。\\n她是凯撒的锋刃，她的剑尖总是蜿蜒流淌鲜血。\\n可当凯撒滚烫的金血滴落在她的指尖，恍惚之间，她又坠落回那孤独的深海。\\n「呵，为什么…我为之游动的火，由我亲手熄灭……」\\n在那痛苦的千年迷醉中，她逃避着那迷离光彩的泡沫，但那些已然片片碎裂的过往如今却像海草缠绕不休。\\n「啪嗒……」\\n棋子落下。执棋的君王神意自若，可王冠上时而平静时而浓烈的光焰却透露出她真实的情绪。\\n「我不懂如何下棋。」\\n「来，我教你。」\\n她不太熟练地拿起棋子。不过是又一场厮杀而已，她想。\\n「啪嗒……」\\n那陡然亢奋的蓝色火焰使她的身边如热泉般温暖。她随意移动着棋子，问道：\\n「既然终要从棋局上消失，为何它们要不停前进？」\\n「啪嗒……」\\n君主啜饮杯中蜜酿，满足地伸展着双臂，又畅然地喟叹着：\\n「前进本身，不已经足够快意？」\\n……\\n千年的等待，她为逐火开辟新的天地，可也知晓那也并非最终的归宿。\\n「鱼儿需要的，终究只是一片栖身的海……」\\n在君主留下的一页记忆中，她走向清澈的海水。\\n♫啪嗒♫，♫皮咔♫，♫波砰♫…五颜六色的泡沫倒影过往岁月，凝结碎裂，碎裂凝结。\\n「海洋的宠儿，你可有什么心愿想要实现？」\\n「海瑟音，你在往何处去？」\\n「剑旗爵，你可有想要之物？」\\n……\\n故乡，欢宴，逐火…它们都曾在她的生命中闪耀，然后迅速化为泡影…只剩下一声叹息回荡天际。\\n从始至终，这便是她拥有的全部——在人世与大海中，都是泡沫破碎的痕迹。\\n「可它们…多么美丽……」\\n「♫……♫」\\n「♫……♫」\\n「♫……♫」\\n翁法罗斯的黎明将要升起。\\n在最后的泡沫破碎前，她微笑着，仿佛已唱尽…那已无需言语表达的心声。\"},\"relations\":[{\"targetId\":\"5205\",\"targetName\":\"开拓者\",\"targetRouteId\":\"\",\"relation\":\"天外的救世主\",\"description\":\"致小灰鱼儿： 我早已知晓，从天外之海游来的你，终会重返更广阔的汪洋。 因为你的眼中总是藏着波涛，那是渴望自由的游鱼才有的目光。 而另一只目盲的小鱼，难舍眼前的蜃景，留恋洞中的水潭—— 那闪耀的星海，于我而言太过刺眼， 毕竟在这水潭中，我也有自己的太阳。 所以，在那星火烧入你的天空之前， 收下这份礼物，让耳边的回忆代我随行吧—— 这枚骨螺中寄宿着涛声， 我偶尔会把它贴在脸颊，聆听故乡的潮音。 若你遨游寰宇之遐，能借它记起你曾置身的水潭， 记起你饮下的蜜酿，和我们未完的盛宴… 那就再好不过了，对吧？ ♫愿你的开拓永不停歇，直至星海之畔♫ ♫愿你能行于坦途之上，耳边涛声常伴♫ 海列屈拉\",\"avatar\":\"https://act-upload.mihoyo.com/sr-wiki/2025/05/12/193706962/b8a39b3ab7c81ed8e88ca43d6be2f88f_8788668609774406579.png\"},{\"targetId\":\"5851\",\"targetName\":\"昔涟\",\"targetRouteId\":\"cyrene\",\"relation\":\"共同拯救翁法罗斯的伙伴\",\"description\":\"「她就像一首…美妙的暖洋协奏曲，融汇所有的冰川和泥泞。若有这只小海兔的陪伴，想必连深海也不愿增加一丝寒意吧。」\",\"avatar\":\"https://act-upload.mihoyo.com/sr-wiki/2025/10/24/276833758/e9ed857da6708dab40ec97b9d22343b5_5036078703727400193.png\"}],\"gallery\":[{\"src\":\"https://cdn.jsdelivr.net/gh/FANHEK/FANHEK.github.io@main/gallery/hysilens/1.webp\",\"alt\":\"海瑟音官方画廊 1\",\"width\":2048,\"height\":2048,\"category\":\"角色立绘\"},{\"src\":\"https://cdn.jsdelivr.net/gh/FANHEK/FANHEK.github.io@main/light-cones/hysilens.webp\",\"alt\":\"海瑟音专属光锥 海洋为何而歌\",\"width\":864,\"height\":1220,\"category\":\"光锥立绘\",\"sourceUrl\":\"https://bbs.mihoyo.com/sr/wiki/content/5751/detail?bbs_presentation_style=no_header\"}]}}]\n"])</script><script>self.__next_f.push([1,"18:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#05070d\"}],[\"$\",\"meta\",\"3\",{\"name\":\"color-scheme\",\"content\":\"dark\"}]]\n14:null\n"])</script><script>self.__next_f.push([1,"1d:I[622,[],\"IconMark\"]\n"])</script><script>self.__next_f.push([1,"16:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"海瑟音 | 黄金裔档案\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"海瑟音的城邦、神权、定位与角色故事。\"}],[\"$\",\"meta\",\"2\",{\"name\":\"author\",\"content\":\"Amphoreus Concept Archive\"}],[\"$\",\"meta\",\"3\",{\"name\":\"keywords\",\"content\":\"翁法罗斯,黄金裔,崩坏星穹铁道,WebGL,互动概念站\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:title\",\"content\":\"翁法罗斯 | 黄金裔命运织机\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:description\",\"content\":\"世界以火种记忆，以命运相连。\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:locale\",\"content\":\"zh_CN\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"9\",{\"name\":\"twitter:title\",\"content\":\"翁法罗斯 | 黄金裔命运织机\"}],[\"$\",\"meta\",\"10\",{\"name\":\"twitter:description\",\"content\":\"世界以火种记忆，以命运相连。\"}],[\"$\",\"link\",\"11\",{\"rel\":\"icon\",\"href\":\"https://cdn.jsdelivr.net/gh/FANHEK/FANHEK.github.io@main/icon.svg?d2387d47ed714e5a\",\"type\":\"image/svg+xml\",\"sizes\":\"any\"}],[\"$\",\"$L1d\",\"12
