忠实地留下选择的痕迹。\",\"part3\":\"阿格莱雅的传说并未止于自身。关于奥赫玛的记录，仍随着火种与远征被不断重写。\",\"part4\":\"“命运并不高贵。高贵的是明知线将断裂，仍亲手将它接上。”\\n\\n这份选择被后世视为命运织机上最清晰的回声之一。\"},\"verification\":{\"version\":\"3.x\",\"isVerified\":false},\"hoYoLabData\":{\"profileVersion\":\"3.x\",\"introduction\":\"[待核实: 米游社官方角色介绍 · 阿格莱雅]\",\"stories\":[{\"id\":\"aglaea-story-1\",\"index\":1,\"title\":\"角色故事 1\",\"subtitle\":\"[待核实: 米游社官方文本]\",\"content\":[\"[待核实: 米游社官方角色故事 1]\",\"在此粘贴官方正文，并补充对应版本、页面链接与抓取日期。\"],\"unlockCondition\":\"沿用米游社原始解锁条件\",\"source\":\"米游社角色详情页 [待核实: 官方文本]\",\"verification\":{\"version\":\"3.x\",\"isVerified\":false}},{\"id\":\"aglaea-story-2\",\"index\":2,\"title\":\"角色故事 2\",\"subtitle\":\"[待核实: 米游社官方文本]\",\"content\":[\"[待核实: 米游社官方角色故事 2]\",\"在此粘贴官方正文，并补充对应版本、页面链接与抓取日期。\"],\"unlockCondition\":\"沿用米游社原始解锁条件\",\"source\":\"米游社角色详情页 [待核实: 官方文本]\",\"verification\":{\"version\":\"3.x\",\"isVerified\":false}},{\"id\":\"aglaea-story-3\",\"index\":3,\"title\":\"角色故事 3\",\"subtitle\":\"[待核实: 米游社官方文本]\",\"content\":[\"[待核实: 米游社官方角色故事 3]\",\"在此粘贴官方正文，并补充对应版本、页面链接与抓取日期。\"],\"unlockCondition\":\"沿用米游社原始解锁条件\",\"source\":\"米游社角色详情页 [待核实: 官方文本]\",\"verification\":{\"version\":\"3.x\",\"isVerified\":false}},{\"id\":\"aglaea-story-4\",\"index\":4,\"title\":\"角色故事 4\",\"subtitle\":\"[待核实: 米游社官方文本]\",\"content\":[\"[待核实: 米游社官方角色故事 4]\",\"在此粘贴官方正文，并补充对应版本、页面链接与抓取日期。\"],\"unlockCondition\":\"沿用米游社原始解锁条件\",\"source\":\"米游社角色详情页 [待核实: 官方文本]\",\"verification\":{\"version\":\"3.x\",\"isVerified\":false}}],\"voiceLines\":[{\"id\":\"aglaea-voice-first-meet\",\"category\":\"first-meet\",\"title\":\"初次见面\",\"transcript\":\"[待核实: 米游社官方语音文本]\",\"source\":\"米游社语音档案 [待核实]\",\"verification\":{\"version\":\"3.x\",\"isVerified\":false}},{\"id\":\"aglaea-voice-idle\",\"category\":\"idle\",\"title\":\"闲听\",\"transcript\":\"[待核实: 米游社官方语音文本]\",\"source\":\"米游社语音档案 [待核实]\",\"verification\":{\"version\":\"3.x\",\"isVerified\":false}},{\"id\":\"aglaea-voice-combat\",\"category\":\"combat\",\"title\":\"战斗语音\",\"transcript\":\"[待核实: 米游社官方语音文本]\",\"source\":\"米游社语音档案 [待核实]\",\"verification\":{\"version\":\"3.x\",\"isVerified\":false}},{\"id\":\"aglaea-voice-story\",\"category\":\"story\",\"title\":\"剧情语音\",\"transcript\":\"[待核实: 米游社官方语音文本]\",\"source\":\"米游社语音档案 [待核实]\",\"verification\":{\"version\":\"3.x\",\"isVerified\":false}},{\"id\":\"aglaea-voice-about\",\"category\":\"about\",\"title\":\"关于自己\",\"transcript\":\"[待核实: 米游社官方语音文本]\",\"source\":\"米游社语音档案 [待核实]\",\"verification\":{\"version\":\"3.x\",\"isVerified\":false}}],\"gallery\":[],\"source\":\"米游社角色详情页 [待核实: 官方文本]\",\"verification\":{\"version\":\"3.x\",\"isVerified\":false}},\"researchStatus\":\"draft\",\"editorialNotes\":[\"本条目依据《黄金裔》阿格莱雅考据稿录入，原始出处逐条标注于“原型考”各节。\",\"古希腊—罗马文本用于解释设计母题的来源，不等同于官方设定的唯一对应。\"],\"prototype\":{\"verification\":{\"version\":\"3.x\",\"isVerified\":false},\"archetype\":\"光辉、浪漫与金线编织的命运者\",\"source\":\"《黄金裔》阿格莱雅考据稿；赫西俄德《神谱》、伪阿波罗多洛斯《书库》、奥维德《变形记》等古典文本比对\",\"tradition\":\"古希腊—罗马神话中的美惠女神（Χάριτες）、命运纺织母题与记忆女神传统\",\"primaryFigures\":[\"阿格莱亚（Ἀγλαΐα / Aglaia）\",\"墨涅塔 · 谟涅摩叙涅（Μνημοσύνη / Moneta）\",\"阿拉克涅（Arachne）\"],\"alternativeFigures\":[\"摩伊拉三女神（Μοῖραι）\",\"阿里阿德涅（Ariadne）\",\"诺伦三女神（Nornir）\",\"赫菲斯托斯（Ἥφαιστος）\"],\"narrativeFunction\":\"把“美”从被观看的对象转化为编织命运的动作：以金线连接、以茧包裹、以线团引路，让被撕裂的秩序仍能被重新缝合。\",\"symbols\":[\"金线\",\"纺锤\",\"金茧\",\"线团\",\"花冠\",\"蛛网\"],\"interpretation\":[\"姓名词源 ἀγλαός（光辉的、美的）与“黎明之光”的神职，让阿格莱雅成为黄金裔中最直接承载“光”与“美”语义的一位。\",\"「金织」把两条古典线索缝在一起：美惠女神的赐福与命运三女神的纺线。前者给予，后者决定，而角色站在两者之间替世界承担选择。\",\"墨涅塔（谟涅摩叙涅）作为记忆女神，使“编织”不仅是装饰工艺，也是对历史的保存；这与翁法罗斯轮回结构中记忆可被改写的前提直接冲突。\"],\"disputedPoints\":[\"奥维德笔下最早被明确写成“掺入金线”的织者是阿拉克涅，阿格莱雅本人在现存古典文本中并未与纺织直接绑定。\",\"“命运女神纺织金线”的通行意象主要定型于后世艺术传统，不能溯为单一古典原文。\",\"泰坦名“墨涅塔”与谟涅摩叙涅的对应为音义推断，需官方文本进一步确认。\"],\"confidence\":\"medium\",\"sources\":[{\"id\":\"hesiod-theogony\",\"title\":\"赫西俄德《神谱》（ΘΕΟΓΟΝΙΑ）\",\"kind\":\"academic\",\"locator\":\"53—62、131—138、217—220、901—909、912—917、945—946\",\"note\":\"美惠三女神与命运三女神的出生、职能与婚配段落。\",\"confidence\":\"high\"},{\"id\":\"apollodorus-bibliotheca\",\"title\":\"伪阿波罗多洛斯《书库》（Βιβλιοθήκη）\",\"kind\":\"academic\",\"locator\":\"1.1.3、1.3.1\",\"note\":\"提坦谱系与美惠三女神的出生。\",\"confidence\":\"high\"},{\"id\":\"orphic-hymns-60\",\"title\":\"《俄耳甫斯祷歌》第 60 首\",\"kind\":\"academic\",\"locator\":\"60\",\"note\":\"对美惠三女神的祷歌式呼告。\",\"confidence\":\"high\"},{\"id\":\"proclus-timaeus\",\"title\":\"普罗克洛斯《柏拉图〈蒂迈欧篇〉注》\",\"kind\":\"academic\",\"locator\":\"1.45.9；俄耳甫斯残篇第 182 号（Kern 编）\",\"note\":\"赫菲斯托斯与阿格莱亚的子女谱系。\",\"confidence\":\"medium\"},{\"id\":\"bacchylides-ode-3\",\"title\":\"巴库利德斯《胜利颂歌》3\",\"kind\":\"academic\",\"locator\":\"希耶隆的奥林匹亚赛马一节\",\"note\":\"阿格莱亚与尼刻并列出现的胜利语境。\",\"confidence\":\"medium\"},{\"id\":\"ovid-metamorphoses-6\",\"title\":\"奥维德《变形记》\",\"kind\":\"academic\",\"locator\":\"6.1—145、6.68—69\",\"note\":\"阿拉克涅与密涅瓦的纺织竞赛，最早的“织金”叙事。\",\"confidence\":\"high\"},{\"id\":\"homer-odyssey-7\",\"title\":\"荷马《奥德赛》\",\"kind\":\"academic\",\"locator\":\"7.196—198\",\"note\":\"命运与纺线者在出生时纺定人生。\",\"confidence\":\"high\"},{\"id\":\"plato-republic-617\",\"title\":\"柏拉图《理想国》\",\"kind\":\"academic\",\"locator\":\"617c\",\"note\":\"摩伊拉三女神与必然性纺锤的分工。\",\"confidence\":\"high\"},{\"id\":\"poetic-edda-helgakvida\",\"title\":\"《诗体埃达·第一首赫尔吉·亨丁斯巴尼之歌》\",\"kind\":\"academic\",\"locator\":\"第 3 节（古诺尔斯语）\",\"note\":\"诺伦三女神纺织金线。\",\"confidence\":\"high\"},{\"id\":\"petronius-satyricon\",\"title\":\"佩特罗尼乌斯《萨蒂利孔》\",\"kind\":\"academic\",\"locator\":\"29.6\",\"note\":\"最早把命运女神与金线直接并置的文本之一。\",\"confidence\":\"high\"}],\"researchSections\":[{\"id\":\"aglaea-name-origin\",\"title\":\"一、姓名的由来：阿格莱亚\",\"summary\":\"阿格莱亚（Ἀγλαΐα / Aglaia，爱奥尼亚体 Ἀγλαΐη，词源 ἀγλαός：美的、光辉的）是美惠三女神中最年幼者，被视为黎明之光的神祇。\",\"entries\":[{\"id\":\"aglaea-birth-hesiod\",\"label\":\"出生\",\"original\":\"τρεῖς δέ οἱ Εὐρυνόμη Χάριτας τέκε καλλιπαρῄους,\\nὨκεανοῦ κούρη, πολυήρατον εἶδος ἔχουσα,\\nἈγλαΐην τε καὶ Εὐφροσύνην Θαλίην τ᾽ ἐρατεινήν·\\nτῶν καὶ ἀπὸ βλεφάρων ἔρος εἴβετο δερκομενάων\\nλυσιμελής· καλὸν δέ θ᾽ ὑπ᾽ ὀφρύσι δερκιόωνται.\",\"translation\":\"俄刻阿诺斯之女欧律诺墨，容貌极其可爱，为他（宙斯）生下了三位面颊美丽的美惠女神：阿格莱亚、欧佛洛绪涅和迷人的塔利亚。当她们顾盼时，从眼睑下流溢出令人四肢酥软的爱欲；她们在眉宇下的凝视是如此美丽。\",\"citation\":\"赫西俄德《神谱》907—909\"},{\"id\":\"aglaea-birth-apollodorus\",\"label\":\"出生\",\"original\":\"Ζεὺς…ἐξ Εὐρυνόμης δὲ τῆς Ὠκεανοῦ χάριτας, Ἀγλαΐην Εὐφροσύνην Θάλειαν…\",\"translation\":\"宙斯……与俄刻阿诺斯之女欧律诺墨生了美惠三女神：阿格莱亚、欧佛洛绪涅和塔利亚；与斯堤克斯生了珀耳塞福涅……\",\"citation\":\"伪阿波罗多洛斯《书库》1.3.1\"},{\"id\":\"aglaea-birth-orphic\",\"label\":\"出生\",\"original\":\"Κλῦτέ μοι, ὦ Χάριτες μεγαλώνυμοι, ἀγλαότιμοι,\\nθυγατέρες Ζηνός τε καὶ Εὐρυνόμης βαθυκόλπου,\\nἈγλαΐη, Θαλίη τε, καὶ Εὐφροσύνη πολύολβε,\\nχαρμοσύνης γενέτειραι, ἐράσμιαι, εὔφρονες, ἁγναί,\\nαἰολόμορφοι, ἀειθαλέες, θνητοῖσι ποθειναί·\",\"translation\":\"听我说，声名显赫、享有光辉荣耀的美惠女神们，宙斯与深邃怀抱的欧律诺墨的女儿们，阿格莱亚、塔利亚，和多福的欧佛洛绪涅，欢乐的缔造者，可爱、欢快、圣洁，形态多姿、青春永驻，为凡人所渴望。\",\"citation\":\"《俄耳甫斯祷歌》60\"},{\"id\":\"aglaea-marriage-hephaestus\",\"label\":\"婚偶\",\"original\":\"Ἀγλαΐην δ᾽ Ἥφαιστος, ἀγακλυτὸς ἀμφιγυήεις,\\nὁπλοτάτην Χαρίτων θαλερὴν ποιήσατ᾽ ἄκοιτιν.\",\"translation\":\"声名远扬、两臂强壮的赫菲斯托斯，娶了美惠女神中最年轻、青春娇艳的阿格莱亚为妻。\",\"citation\":\"赫西俄德《神谱》945—946\"},{\"id\":\"aglaea-children\",\"label\":\"婚偶生育\",\"original\":\"καὶ αὖ ἐξ Ἡφαίστου καὶ Ἀγλαΐας Εὔκλειον καὶ Εὐθένειον ἀπογεννῶσι καὶ Εὐφήμην καὶ Φιλοφροσύνην, αἳ καὶ αὐταὶ τὸ σωματοειδὲς τῶι κάλλει διαπρέπον ἀποτελοῦσι.\",\"translation\":\"又从赫菲斯托斯和阿格莱亚，他们生出欧克勒亚、欧忒尼亚、欧斐摩和菲洛弗洛绪涅。\",\"citation\":\"普罗克洛斯《柏拉图〈蒂迈欧篇〉注》1.45.9；俄耳甫斯残篇第 182 号（Kern 编）\"},{\"id\":\"aglaea-bacchylides\",\"label\":\"颂歌\",\"original\":\"Ἀριστοκάρπου Σικελίας κρέουσαν\\nΔάματρα ἰοστέφανόν τε Κούραν\\nὕμνει, γλυκύδωρε Κλειοῖ,\\nθοάς τ᾽ Ὀλυμπιοδρόμους Ἱέρωνος ἵππους.\\nΣεύοντο γὰρ σὺν ὑπεροχῳ τε Νίκα\\nσὺν Ἀγλαΐᾳ τε παρ᾽ εὐρυδίναν Ἀλφεόν,\\nτόθι Δεινομένεος ἔθηκαν ὄλβιον γόνον\\nστεφάνων κυρῆσαι.\",\"translation\":\"歌颂那统治丰饶西西里的得墨忒耳，和头戴紫罗兰冠的科瑞，甜美的赐礼者克勒俄，以及希耶隆迅捷的奥林匹亚赛马。因为它们与超凡的胜利女神，与光辉女神阿格莱亚，一同奔赴宽阔的阿尔甫斯河，在那里，它们使德诺墨涅斯之子有幸赢得冠冕。\",\"citation\":\"巴库利德斯《胜利颂歌》3\"}]},{\"id\":\"aglaea-goldweaver\",\"title\":\"二、称号「金织」：阿格莱雅的金线\",\"summary\":\"「金织」把角色与三条古典线索连接起来：阿拉克涅的金线织物、摩伊拉的命运之线，以及阿里阿德涅引路的线团。\",\"entries\":[{\"id\":\"aglaea-arachne\",\"label\":\"最早的织金者：阿拉克涅\",\"original\":\"illic et lentum filis inmittitur aurum,\\net vetus in tela deducitur argumentum.\",\"translation\":\"在那里，柔韧的金线也被掺入丝线之中，古老的故事被一一织入织物。\",\"citation\":\"奥维德《变形记》6.68—69\"},{\"id\":\"aglaea-arachne-note\",\"label\":\"考据说明\",\"translation\":\"奥维德《变形记》第 6 卷第 1—145 行：善于纺织的阿拉克涅声称技艺无人能及，否认密涅瓦。竞赛中，密涅瓦在自己的织物上织出她与海神波塞冬争夺雅典守护权的场景，以此彰显神力；阿拉克涅的织物则描绘众神化形诱骗凡间女子的丑闻，用金线等材料直接揭露神明的堕落。密涅瓦被激怒，撕毁织物并用梭子击打阿拉克涅的额头。阿拉克涅因羞辱而上吊，密涅瓦出于怜悯将她变为蜘蛛，让她与后代永远悬丝织网。\"},{\"id\":\"aglaea-moirai-birth\",\"label\":\"命运之线：摩伊拉的亚麻线\",\"original\":\"Νὺξ…καὶ Μοίρας καὶ Κῆρας ἐγείνατο νηλεοποίνους,\\nΚλωθώ τε Λάχεσίν τε καὶ Ἄτροπον, αἵτε βροτοῖσι\\nγεινομένοισι διδοῦσιν ἔχειν ἀγαθόν τε κακόν τε,\\nαἵτ᾽ ἀνδρῶν τε θεῶν τε παραιβασίας ἐφέπουσιν·\",\"translation\":\"夜神……也生了摩伊拉和刻耳，无情惩罚的，克洛托、拉刻西斯和阿特罗波斯，她们使出生时的凡人拥有善与恶，她们监视凡人和神明的越轨行为。\",\"citation\":\"赫西俄德《神谱》217—220\"},{\"id\":\"aglaea-moirai-themis\",\"label\":\"命运之线：摩伊拉的亚麻线\",\"original\":\"δεύτερον ἠγάγετο λιπαρὴν Θέμιν, ἣ τέκεν Ὥρας,\\nΕὐνουμίην τε Δίκην τε καὶ Εἰρήνην τεθαλυῖαν,\\nαἳ ἔργ᾽ ὠρεύουσι καταθνητοῖσι βροτοῖσι,\\nΜοίρας θ᾽, ᾗ πλείστην τιμὴν πόρε μητίετα Ζεύς,\\nΚλωθώ τε Λάχεσίν τε καὶ Ἄτροπον, αἵτε διδοῦσι\\nθνητοῖς ἀνθρώποισιν ἔχειν ἀγαθόν τε κακόν τε.\",\"translation\":\"其次，他（宙斯）娶了光辉的忒弥斯为妻，她生下了荷赖——欧诺弥亚、狄刻和繁盛的厄瑞涅，她们照管有死凡人的劳作；又生下了摩伊拉，机敏的宙斯赐予她们最高的荣誉——克洛托、拉刻西斯和阿特罗波斯，她们使有死的凡人拥有善与恶。\",\"citation\":\"赫西俄德《神谱》901—906\"},{\"id\":\"aglaea-moirai-homer\",\"label\":\"命运之线：摩伊拉的亚麻线\",\"original\":\"ἔνθα δ᾽ ἔπειτα\\nπείσεται, ἅσσα οἱ αἶσα κατὰ Κλῶθές τε βαρεῖαι\\nγεινομένῳ νήσαντο λίνῳ, ὅτε μιν τέκε μήτηρ\",\"translation\":\"在那里，他此后将忍受一切，凡是命运和沉重的纺线者们在他出生时、在他母亲生下他时，用亚麻线为他纺定的事情。\",\"citation\":\"荷马《奥德赛》7.196—198\"},{\"id\":\"aglaea-moirai-plato\",\"label\":\"命运之线：职能分工\",\"original\":\"πέριξ διʼ ἴσου τρεῖς, ἐν θρόνῳ ἑκάστην, θυγατέρας τῆς ἀνάγκης, Μοίρας, λευχειμονούσας, στέμματα ἐπὶ τῶν κεφαλῶν ἐχούσας, Λάχεσίν τε καὶ Κλωθὼ καὶ Ἄτροπον, ὑμνεῖν πρὸς τὴν τῶν Σειρήνων ἁρμονίαν, Λάχεσιν μὲν τὰ γεγονότα, Κλωθὼ δὲ τὰ ὄντα, Ἄτροπον δὲ τὰ μέλλοντα.\",\"translation\":\"围绕着他，彼此等距地坐着三位女神，各在自己的宝座上，她们是必然性（Ἀνάγκη）的女儿——摩伊拉（Μοῖραι），身穿白袍，头戴花冠：拉刻西斯、克洛托和阿特罗波斯。她们和着塞壬的歌声吟唱：拉刻西斯唱过去之事，克洛托唱现在之事，阿特罗波斯唱未来之事。\",\"citation\":\"柏拉图《理想国》617c\"},{\"id\":\"aglaea-norns\",\"label\":\"相关：北欧神话中诺伦三女神的金线\",\"original\":\"Sneru þær af afli örlögþáttu,\\nþá er borgir braut í Bráluni;\\nþær of greiddu gullin símu\\nok und mánasal miðjan festu.\",\"translation\":\"她们奋力捻转命运之线，当他在布拉隆德摧毁堡垒之时；她们铺设金色的丝线，把它固定在月亮殿堂的正下方。\",\"citation\":\"《诗体埃达·第一首赫尔吉·亨丁斯巴尼之歌》第 3 节（古诺尔斯语）\"},{\"id\":\"aglaea-linen-to-gold\",\"label\":\"从亚麻线到金线\",\"original\":\"Praesto erat Fortuna cornu abundanti copiosa et tres Parcae aurea pensa torquentes.\",\"translation\":\"在场的是手持丰饶之角、物产丰盈的福尔图娜，以及三位正在纺织金线的帕尔卡。\",\"citation\":\"佩特罗尼乌斯《萨蒂利孔》29.6\"},{\"id\":\"aglaea-ariadne-thread\",\"label\":\"万维网的源头：阿里阿德涅的线团\",\"original\":\"ὑποθεμένου δὲ ἐκείνου, λίνον εἰσιόντι Θησεῖ δίδωσι: τοῦτο ἐξάψας Θησεὺς τῆς θύρας ἐφελκόμενος εἰσῄει. καταλαβὼν δὲ Μινώταυρον ἐν ἐσχάτῳ μέρει τοῦ λαβυρίνθου παίων πυγμαῖς ἀπέκτεινεν, ἐφελκόμενος δὲ τὸ λίνον πάλιν ἐξῄει.\",\"translation\":\"那人（代达罗斯）给他出了主意后，她（阿里阿德涅）在忒修斯进入时给了他一个线团。忒修斯把它系在门上，一边拉着线一边走了进去。在迷宫最深处找到弥诺陶洛斯后，他用拳头击打将其杀死，然后又拉着线走了出来。\"}]},{\"id\":\"aglaea-mnestia\",\"title\":\"三、泰坦神墨涅塔的由来\",\"summary\":\"墨涅塔对应谟涅摩叙涅（Μνημοσύνη，词源 μνημοσύνη：「记忆」），古希腊神话中十二提坦之一、缪斯女神的母亲，对应罗马神话中的摩涅塔（Moneta）。\",\"entries\":[{\"id\":\"mnemosyne-birth-hesiod\",\"label\":\"出生\",\"original\":\"Θείαν τε Ῥείαν τε Θέμιν τε Μνημοσύνην τε\\nΦοίβην τε χρυσοστέφανον Τηθύν τ᾽ ἐρατεινήν.\",\"translation\":\"她（盖亚）与乌拉诺斯同床，生了俄刻阿诺斯、科俄斯、克瑞俄斯、许佩里翁、伊阿珀托斯、忒亚、瑞亚、忒弥斯、谟涅摩叙涅、福柏（金冠的）和忒提斯（可爱的）。\",\"citation\":\"赫西俄德《神谱》131—138\"},{\"id\":\"mnemosyne-birth-apollodorus\",\"label\":\"出生\",\"original\":\"τεκνοῖ δὲ αὖθις ἐκ Γῆς παῖδας μὲν τοὺς Τιτᾶνας προσαγορευθέντας… θυγατέρας δὲ τὰς κληθείσας Τιτανίδας, Τηθὺν Ῥέαν Θέμιν Μνημοσύνην Φοίβην Διώνην Θείαν.\",\"translation\":\"他又与盖亚生育了子女：被称为提坦的儿子们——俄刻阿诺斯、科俄斯、许佩里翁、克瑞俄斯、伊阿珀托斯，以及最年轻的克洛诺斯；还有被称为提坦女神的女儿们——忒提斯、瑞亚、忒弥斯、谟涅摩叙涅、福柏、狄俄涅、忒亚。\",\"citation\":\"伪阿波罗多洛斯《书库》1.1.3\"},{\"id\":\"mnemosyne-muses-hesiod\",\"label\":\"婚偶生育\",\"original\":\"τὰς ἐν Πιερίῃ Κρονίδῃ τέκε πατρὶ μιγεῖσα\\nΜνημοσύνη, γουνοῖσιν Ἐλευθῆρος μεδέουσα,\\nλησμοσύνην τε κακῶν ἄμπαυμά τε μερμηράων.\",\"translation\":\"在皮埃里亚，她与克洛诺斯之子结合，生下了她们——谟涅摩叙涅，统治厄琉忒尔山丘的女神，作为对不幸的遗忘和对忧思的解脱。\",\"citation\":\"赫西俄德《神谱》53—62\"},{\"id\":\"mnemosyne-muses-theogony\",\"label\":\"婚偶生育\",\"original\":\"Μνημοσύνης δ᾽ ἐξαῦτις ἐράσσατο καλλικόμοιο,\\nἐξ ἧς οἱ Μοῦσαι χρυσάμπυκες ἐξεγένοντο\\nἐννέα, τῇσιν ἅδον θαλίαι καὶ τέρψις ἀοιδῆς.\",\"translation\":\"此后他又爱上了美发的谟涅摩叙涅，从她那里，九位金冠的缪斯为他而生，她们喜爱宴饮和歌唱的愉悦。\",\"citation\":\"赫西俄德《神谱》912—917\"},{\"id\":\"mnemosyne-lineage-apollodorus\",\"label\":\"婚偶生育\",\"original\":\"ἐκ δὲ Μνημοσύνης μούσας, πρώτην μὲν Καλλιόπην, εἶτα Κλειὼ Μελπομένην Εὐτέρπην Ἐρατὼ Τερψιχόρην Οὐρανίαν Θάλειαν Πολυμνίαν.\",\"translation\":\"从谟涅摩叙涅生缪斯：首先是卡利俄佩，然后是克利俄、墨尔波墨涅、欧忒耳佩、厄拉托、忒耳普西科瑞、乌拉尼亚、塔利亚、波吕许谟尼亚。\",\"citation\":\"伪阿波罗多洛斯《书库》1.3.1\"}]}]},\"designMotifs\":[{\"id\":\"aglaea-golden-thread\",\"verification\":{\"version\":\"3.x\",\"isVerified\":false},\"category\":\"ornament\",\"title\":\"贯穿全身的金线\",\"visualDescription\":\"衣装纹样、发饰与技能轨迹以连续不断的细金线串联，线条在交会处形成编织节点。\",\"culturalOrigin\":\"美惠女神的赐福与命运三女神纺织亚麻线／金线的双重传统。\",\"meaning\":[\"金线同时是装饰、武器与裁决尺度，呼应「金织」这一称号。\",\"线条不断开，意味着命运只能被重新编织，而不能被简单剪断。\"],\"palette\":[\"#e7c561\",\"#f6dfa3\",\"#8f6a2d\",\"#1a1520\"],\"sourceIds\":[\"hesiod-theogony\",\"plato-republic-617\"]},{\"id\":\"aglaea-chrysalis\",\"verification\":{\"version\":\"3.x\",\"isVerified\":false},\"category\":\"material\",\"title\":\"黄金之茧的包裹感\",\"visualDescription\":\"肩背与裙摆呈现层叠包裹的茧形轮廓，内层使用半透明金色薄纱形成呼吸般的光晕。\",\"culturalOrigin\":\"称号「黄金之茧」（Chrysalis of Gold）与织金工艺中的层叠结构。\",\"meaning\":[\"茧是保存也是束缚，暗示黄金裔的力量自带代价。\",\"半透明层让光在内部扩散，把“美”表现为一种保护结构。\"],\"palette\":[\"#f6dfa3\",\"#d5b46d\",\"#6b4f8f\",\"#0f0b16\"],\"sourceIds\":[\"ovid-metamorphoses-6\"]},{\"id\":\"aglaea-thread-of-return\",\"verification\":{\"version\":\"3.x\",\"isVerified\":false},\"category\":\"gesture\",\"title\":\"可回返的线团手势\",\"visualDescription\":\"技能与剧情演出中反复出现「放线—牵引—归位」的手部动作，线端始终保留在视线内。\",\"culturalOrigin\":\"阿里阿德涅的线团：以线索标记路径，使不可返回之处仍可返回。\",\"meaning\":[\"线团把手势变成导航行为，对应角色在黄金裔秩序中承担指引职责。\",\"保留线端意味着她始终为自己留一条退路，直到剧情迫使她放弃。\"],\"palette\":[\"#e7c561\",\"#a8a29e\",\"#4c365e\"],\"sourceIds\":[\"ovid-metamorphoses-6\"]}],\"relations\":[{\"targetId\":\"titans\",\"targetName\":\"泰坦 · 墨涅塔\",\"kind\":\"mythic-counterpart\",\"relation\":\"记忆神脉的对应关系\",\"description\":\"墨涅塔对应谟涅摩叙涅，即记忆女神；这与「金织」保存历史的职能构成同一条语义链。\",\"intensity\":4,\"status\":\"draft\"},{\"targetId\":\"golden-heirs\",\"targetName\":\"黄金裔\",\"kind\":\"faction\",\"relation\":\"秩序的维护者\",\"description\":\"作为黄金庭的持线者，她在黄金裔内部承担维持秩序与承担代价的角色。\",\"intensity\":3,\"status\":\"draft\"}],\"media\":{\"portrait\":{\"src\":\"https://cdn.jsdelivr.net/gh/FANHEK/FANHEK.github.io@main/art/aglaea.webp\",\"alt\":\"阿格莱雅角色立绘\"},\"splashArt\":{\"src\":\"https://cdn.jsdelivr.net/gh/FANHEK/FANHEK.github.io@main/art/aglaea.webp\",\"alt\":\"阿格莱雅超高清立绘\"},\"divineCard\":{\"src\":\"https://cdn.jsdelivr.net/gh/FANHEK/FANHEK.github.io@main/art/divine/aglaea.webp\",\"alt\":\"阿格莱雅神性铭牌\",\"width\":645,\"height\":1135,\"placeholder\":\"empty\"},\"skillAnimations\":[],\"idleVoice\":[],\"storyVoice\":[],\"ambientVoice\":[],\"gallery\":[]}},\"profile\":{\"name\":\"阿格莱雅\",\"title\":\"织者抚弄金丝\",\"rarity\":5,\"city\":\"奥赫玛\",\"divinePower\":\"「黄金之茧，墨涅塔」\",\"combatRole\":\"召唤忆灵「衣匠」协助战斗的输出型角色\",\"quote\":\"命运并不高贵。高贵的是明知线将断裂，仍亲手将它接上。\",\"stories\":{\"detail\":\"在那黎明照拂的圣城，织者抚弄金丝，连缀命运。\\n背负「浪漫」火种的黄金裔，召集世间英雄，带领他们再度踏上漫长的征程\\n——击落众神，归还神火，予以几近覆灭的翁法罗斯新生。\",\"part1\":\"许多年之后，当她无意间找到少女时代织就的衣物，温柔自绸缎流淌而下，令她久无波动的心为之一颤。\\n世代供奉「墨涅塔」的家族中，人人从小学习一项「美」的技艺，大师们的画像悬于私人浴池的名誉墙上，无时无刻不审视着他们的子孙。\\n谁到了这里不是噤若寒蝉，可偏偏她在那大师目光的重压下轻盈走动。\\n「绘画失之于虚假，音乐失之于抽象，雕塑失之于笨重，戏剧失之于流俗……」\\n长辈一脸无奈，稚嫩的声音却让人无法反驳。\\n「小雅，还能有什么比它们更美？」\\n她踏出浴池，踮脚舞蹈至镜前，淡金色的长发如瀑般流淌而下。\\n「不。」\\n水晕弥漫的镜面上，金色的双眸牵引着万缕千丝的视线——\\n「我一定会找到——那更美的存在。」\\n「就是为了这样单纯的理由，后来啊……」衣物的温暖触着指尖，泛起回忆。\\n她在树庭中淘气攀爬，浴池中沉思想象，只为了拾一枚金叶，一捧灵感的浪花。\\n她在屋顶跳跃奔跑，在原野逗留张望，为了用丝线重现微风的自由与弥远的花香。\\n时间流淌，织机不停，她的作品源源不断，于奥赫玛中掀起风潮，一次又一次。\\n她穿着最为得意的织物拜访神殿，但她仍怀有疑问：「这是美吗？」\\n那「墨涅塔」的祭司已至暮年，虽难以清晰视物，但女孩的光彩仍刺破了她眼前的昏暗。\\n「小雅，当你接过『金织』的职责时，你一定能创造出令诸神嫉妒的作品。\\n「这件衣物，以及穿着这件衣物的你，都是如此美丽…但这并不是『美』。」\\n「可…美和美丽…不是一个意思吗？」\\n「你呀，还不懂…不懂是好事，好事啊……」\",\"part2\":\"时光荏苒，她设计的服饰已如星空那般浩繁。\\n不知为何，那华美广大的衣橱内，却保存着许多褴褛不堪的旧衣布片。\\n充斥纷争的大地上，年轻的将士们穿着鲜亮的衣裳出征，归来时战服已成殓衣，甚至只能带回衣裳的一角。无人认领的时候，只有她会将这些布片收集起来。\\n她也曾在愤怒中毁去华服，那些腐朽堕落、养尊处优的贵族不配穿上她织就的衣裳招摇过市——即使她自己也曾是这番模样。\\n还有…那一件又一件小小的衣装。\\n在过往的时光里，她们伴她成长，同她诉说往日与未来的歌谣\\n——见证诸多丑恶之后，她才明白，那些稚嫩话语中的分量。\\n「身为奥赫玛的改衣师，墨涅塔的祭司，我与你们有着相同的职责。」\\n「但救世要付出的代价……」\\n「…就像你们一样？」\\n「就像*我们*一样。」\\n最显眼的地方，悬挂着朴素简洁的祭司长裙。她时常拿出清洗扫尘，只为不忘自己向那神明许下的诺言。\\n「请原谅我，为了人世间最美的作品……」\\n很久以前，握住火种的那一刻，她突然在黑暗中「看见」了一幅从未见过的美丽景象——\\n在那黄金般的未来里，再也没有纷争，也再没有死亡。\",\"part3\":\"他们说，那是「逐火」的旅途。他们也说，那是「失却」的旅途。\\n她隐约察觉到某种珍贵的东西在自己身上流逝，但她无暇旁顾，只因走在她前面的人正历经着比她更为痛苦的失去。\\n「这儿就交给你了，阿格莱雅。」\\n「一定好好干啊。」\\n「下次见！」\\n她不明白，为何告别的时候，他们都这么说。\\n留给她的，只有深海中隐约传来的乐声，大地上随风而逝的足迹，与一盘无解的棋局。\\n「孱弱的丝线，如何承担命运的重压？」\\n陪伴她的唯有「衣匠」，但那曾经华美的衣橱如今空空荡荡。\\n高贵的小姐进入政治的角斗场，引得元老院议论纷纷，在旁人的连连嗤笑中，她开始自己的筹谋。\\n指尖的金丝在奥赫玛织造一种网，若虫憩息在城中角落，一呼一吸都无法逃脱她的耳目。\\n连金丝也变得锋利，第一次染上血的气味。\",\"part4\":\"时至今日，沐浴神性的织机仍在不停轮转，众多衣匠飘摇于半空，无人知道它们是为何而舞动，又是为何而休止。\\n「衣匠，请前往广场，那里有我们远道而来的客人……」\\n这样的场景似乎重复过很多次。以往是她走向别人，现在是别人走向她。\\n彼时彼刻，那身着银白铠甲的青年站在此处，稚气未脱的脸庞被仇恨和血污浸染。\\n紫裙的少女静默无声，她所行之地，冰冷的死亡会掺杂着幽深的花香。\\n还有一位飞贼像猫儿似的从奥赫玛消失，但她仍当这是场滑稽的恶作剧。\\n那如微光般温暖的女孩，也曾治愈过她的伤痕。\\n还有那异邦的王储，高傲的学者——\\n「如果一根丝线不够，那么就让千千万万根丝线拉起天穹……」\\n她寻找着，牵引着各异的命运之线，将他们连缀为强韧的网，然后，那网会扑向泰坦的火种，令它们在新的世界再度燃烧。\\n「黄金裔们，会一同编织出璀璨夺目的未来。」\\n在等待的间隙，她来到窗边，俯瞰着熙熙攘攘的奥赫玛城。\\n「衣匠，再为我沏一杯热茶吧。」\\n她感到些许寒冷，但她的心已不再为往事的悲伤而悸动。\\n无形的金线自她的指尖向外延展，城邦的脉搏与心跳，风声与雨声，都在她的指尖跃动、颤抖，就像浪漫之神诞下的灵感，孕育着新生命的搏动——\\n她端详已久，终是收起了少女时代裁剪的华服。\\n「哪怕，最后只能身着素衣……」\\n相传每一位「墨涅塔」的信众，往往都会耗费一生的辛劳，向神明献上自己所认为「至美」的作品。\\n她已很久没有编织过美丽的衣物了。\\n但她从未停下过织造命运的脚步。\"},\"relations\":[{\"targetId\":\"5205\",\"targetName\":\"开拓者\",\"targetRouteId\":\"\",\"relation\":\"天外的救世主\",\"description\":\"致开拓者阁下： 我曾为世界的变迭穿针引线，试图编织美好的命运， 我们孤独逐火，直到灰白的光自天外降临； 如今，我难得放下沉重的织机，为自己裁衣， 而你们却又将启程，渐远的行迹让丝线也无法追及。 赠你的饰品并未倾注神性，由我亲手穿制，贴身珍藏； 因我并不想让它变得沉重，而是如一片羽毛停在你的手腕， 点缀你的身体，衬映你的魂灵。 即便是我，也看不见你将踏上的未来，但我会为你祝祈—— 「开拓」为宇宙带来交织如丝弦的星轨， 愿那些银色丝弦，为你引路，因你嗡鸣。 阿格莱雅\",\"avatar\":\"https://act-upload.mihoyo.com/sr-wiki/2025/05/12/193706962/b8a39b3ab7c81ed8e88ca43d6be2f88f_8788668609774406579.png\"},{\"targetId\":\"5851\",\"targetName\":\"昔涟\",\"targetRouteId\":\"cyrene\",\"relation\":\"共同拯救翁法罗斯的伙伴\",\"description\":\"「当那一缕『爱』的丝线编入翁法罗斯的命运，她的每一道注视早已在万载岁月里，穿过我们跳动的心，将彼此的生命连缀成形。」\",\"avatar\":\"https://act-upload.mihoyo.com/sr-wiki/2025/10/24/276833758/e9ed857da6708dab40ec97b9d22343b5_5036078703727400193.png\"}],\"gallery\":[{\"src\":\"https://cdn.jsdelivr.net/gh/FANHEK/FANHEK.github.io@main/gallery/aglaea/1.webp\",\"alt\":\"阿格莱雅官方画廊 1\",\"width\":2048,\"height\":2048,\"category\":\"角色立绘\"},{\"src\":\"https://cdn.jsdelivr.net/gh/FANHEK/FANHEK.github.io@main/light-cones/aglaea.webp\",\"alt\":\"阿格莱雅专属光锥 将光阴织成黄金\",\"width\":864,\"height\":1220,\"category\":\"光锥立绘\",\"sourceUrl\":\"https://bbs.mihoyo.com/sr/wiki/content/4887/detail?bbs_presentation_style=no_header\"},{\"src\":\"https://cdn.jsdelivr.net/gh/FANHEK/FANHEK.github.io@main/gallery/aglaea/4.webp\",\"alt\":\"阿格莱雅官方画廊 4\",\"width\":1091,\"height\":611,\"category\":\"过场动画 悬锋啊，请涤去你的血锈•下2\",\"sourceUrl\":\"https://www.miyoushe.com/sr/article/64533925\"}]}}]\n"])</script><script>self.__next_f.push([1,"18:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#05070d\"}],[\"$\",\"meta\",\"3\",{\"name\":\"color-scheme\",\"content\":\"dark\"}]]\n14:null\n"])</script><script>self.__next_f.push([1,"1d:I[622,[],\"IconMark\"]\n"])</script><script>self.__next_f.push([1,"16:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"阿格莱雅 | 黄金裔档案\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"阿格莱雅的城邦、神权、定位与角色故事。\"}],[\"$\",\"meta\",\"2\",{\"name\":\"author\",\"content\":\"Amphoreus Concept Archive\"}],[\"$\",\"meta\",\"3
