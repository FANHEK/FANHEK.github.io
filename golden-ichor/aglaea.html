饰符号和官方设定文本继续核验。\",\"symbols\":[\"金织冕\",\"黄金庭\"],\"interpretation\":[\"当前页面保留考据槽位，不将社区推测写成官方结论。\"],\"disputedPoints\":[\"全部神话映射均待官方资料与游戏内文本核验。\"],\"confidence\":\"low\",\"sources\":[{\"id\":\"prototype-source-placeholder\",\"title\":\"[待核实: 官方文本]\",\"kind\":\"official\",\"locator\":\"补充官方前瞻、游戏内档案或开发者说明后替换\",\"confidence\":\"low\"}]},\"designMotifs\":[{\"id\":\"aglaea-gold-thread\",\"verification\":{\"version\":\"3.x\",\"isVerified\":false},\"category\":\"ornament\",\"title\":\"流动金丝轮廓\",\"visualDescription\":\"衣摆、袖口与发饰使用连续细线，像多处命运丝线同时汇聚到身体中心。\",\"culturalOrigin\":\"纺织、命运三女神与宫廷礼服中的牵引母题。\",\"meaning\":[\"金丝把角色的控制力具象为连接和牵引。\",\"线条保持克制，避免破坏黄金庭的秩序感。\"],\"palette\":[\"#e7c561\",\"#fff0ae\",\"#8b6628\",\"#251b24\"],\"sourceIds\":[\"prototype-source-placeholder\"]},{\"id\":\"aglaea-weaver-hands\",\"verification\":\"$c:props:record:designMotifs:0:verification\",\"category\":\"gesture\",\"title\":\"织者手势\",\"visualDescription\":\"手指常保持拈线与校准姿态，与武器或装饰形成精确的直角关系。\",\"culturalOrigin\":\"织机操作和宫廷仪式动作。\",\"meaning\":[\"手势说明她更接近制定结构的人，而非直接冲入战场的执行者。\",\"规整动作与柔软金丝形成力量反差。\"],\"palette\":[\"#e7c561\",\"#f4d7aa\",\"#9e2f3f\",\"#f7f0df\"],\"sourceIds\":[\"prototype-source-placeholder\"]},{\"id\":\"aglaea-ivory-gold\",\"verification\":\"$c:props:record:designMotifs:0:verification\",\"category\":\"color\",\"title\":\"象牙白与旧金\",\"visualDescription\":\"主体服装保持象牙白，金线只描画结构边缘，红色作为情绪和权力落点。\",\"culturalOrigin\":\"大理石雕像、神庙装饰与古典戏剧服装。\",\"meaning\":[\"白色承担公开秩序，红色提示秩序背后的牺牲。\",\"金色不铺满全身，只用于强调真正的权力节点。\"],\"palette\":[\"#f1e7d0\",\"#d7ad56\",\"#9e2f3f\",\"#171322\"],\"sourceIds\":[\"prototype-source-placeholder\"]}],\"relations\":[],\"media\":{\"portrait\":{\"src\":\"/art/aglaea.webp\",\"alt\":\"阿格莱雅角色立绘\"},\"splashArt\":{\"src\":\"/art/aglaea.webp\",\"alt\":\"阿格莱雅超高清立绘\"},\"divineCard\":{\"src\":\"/art/divine/aglaea.webp\",\"alt\":\"阿格莱雅神性铭牌\",\"width\":645,\"height\":1135,\"placeholder\":\"empty\"},\"skillAnimations\":[],\"idleVoice\":[],\"storyVoice\":[],\"ambientVoice\":[],\"gallery\":[]}},\"profile\":{\"name\":\"阿格莱雅\",\"title\":\"织者抚弄金丝\",\"rarity\":5,\"city\":\"奥赫玛\",\"divinePower\":\"「黄金之茧，墨涅塔」\",\"combatRole\":\"召唤忆灵「衣匠」协助战斗的输出型角色\",\"quote\":\"命运并不高贵。高贵的是明知线将断裂，仍亲手将它接上。\",\"stories\":{\"detail\":\"在那黎明照拂的圣城，织者抚弄金丝，连缀命运。\\n背负「浪漫」火种的黄金裔，召集世间英雄，带领他们再度踏上漫长的征程\\n——击落众神，归还神火，予以几近覆灭的翁法罗斯新生。\",\"part1\":\"许多年之后，当她无意间找到少女时代织就的衣物，温柔自绸缎流淌而下，令她久无波动的心为之一颤。\\n世代供奉「墨涅塔」的家族中，人人从小学习一项「美」的技艺，大师们的画像悬于私人浴池的名誉墙上，无时无刻不审视着他们的子孙。\\n谁到了这里不是噤若寒蝉，可偏偏她在那大师目光的重压下轻盈走动。\\n「绘画失之于虚假，音乐失之于抽象，雕塑失之于笨重，戏剧失之于流俗……」\\n长辈一脸无奈，稚嫩的声音却让人无法反驳。\\n「小雅，还能有什么比它们更美？」\\n她踏出浴池，踮脚舞蹈至镜前，淡金色的长发如瀑般流淌而下。\\n「不。」\\n水晕弥漫的镜面上，金色的双眸牵引着万缕千丝的视线——\\n「我一定会找到——那更美的存在。」\\n「就是为了这样单纯的理由，后来啊……」衣物的温暖触着指尖，泛起回忆。\\n她在树庭中淘气攀爬，浴池中沉思想象，只为了拾一枚金叶，一捧灵感的浪花。\\n她在屋顶跳跃奔跑，在原野逗留张望，为了用丝线重现微风的自由与弥远的花香。\\n时间流淌，织机不停，她的作品源源不断，于奥赫玛中掀起风潮，一次又一次。\\n她穿着最为得意的织物拜访神殿，但她仍怀有疑问：「这是美吗？」\\n那「墨涅塔」的祭司已至暮年，虽难以清晰视物，但女孩的光彩仍刺破了她眼前的昏暗。\\n「小雅，当你接过『金织』的职责时，你一定能创造出令诸神嫉妒的作品。\\n「这件衣物，以及穿着这件衣物的你，都是如此美丽…但这并不是『美』。」\\n「可…美和美丽…不是一个意思吗？」\\n「你呀，还不懂…不懂是好事，好事啊……」\",\"part2\":\"时光荏苒，她设计的服饰已如星空那般浩繁。\\n不知为何，那华美广大的衣橱内，却保存着许多褴褛不堪的旧衣布片。\\n充斥纷争的大地上，年轻的将士们穿着鲜亮的衣裳出征，归来时战服已成殓衣，甚至只能带回衣裳的一角。无人认领的时候，只有她会将这些布片收集起来。\\n她也曾在愤怒中毁去华服，那些腐朽堕落、养尊处优的贵族不配穿上她织就的衣裳招摇过市——即使她自己也曾是这番模样。\\n还有…那一件又一件小小的衣装。\\n在过往的时光里，她们伴她成长，同她诉说往日与未来的歌谣\\n——见证诸多丑恶之后，她才明白，那些稚嫩话语中的分量。\\n「身为奥赫玛的改衣师，墨涅塔的祭司，我与你们有着相同的职责。」\\n「但救世要付出的代价……」\\n「…就像你们一样？」\\n「就像*我们*一样。」\\n最显眼的地方，悬挂着朴素简洁的祭司长裙。她时常拿出清洗扫尘，只为不忘自己向那神明许下的诺言。\\n「请原谅我，为了人世间最美的作品……」\\n很久以前，握住火种的那一刻，她突然在黑暗中「看见」了一幅从未见过的美丽景象——\\n在那黄金般的未来里，再也没有纷争，也再没有死亡。\",\"part3\":\"他们说，那是「逐火」的旅途。他们也说，那是「失却」的旅途。\\n她隐约察觉到某种珍贵的东西在自己身上流逝，但她无暇旁顾，只因走在她前面的人正历经着比她更为痛苦的失去。\\n「这儿就交给你了，阿格莱雅。」\\n「一定好好干啊。」\\n「下次见！」\\n她不明白，为何告别的时候，他们都这么说。\\n留给她的，只有深海中隐约传来的乐声，大地上随风而逝的足迹，与一盘无解的棋局。\\n「孱弱的丝线，如何承担命运的重压？」\\n陪伴她的唯有「衣匠」，但那曾经华美的衣橱如今空空荡荡。\\n高贵的小姐进入政治的角斗场，引得元老院议论纷纷，在旁人的连连嗤笑中，她开始自己的筹谋。\\n指尖的金丝在奥赫玛织造一种网，若虫憩息在城中角落，一呼一吸都无法逃脱她的耳目。\\n连金丝也变得锋利，第一次染上血的气味。\",\"part4\":\"时至今日，沐浴神性的织机仍在不停轮转，众多衣匠飘摇于半空，无人知道它们是为何而舞动，又是为何而休止。\\n「衣匠，请前往广场，那里有我们远道而来的客人……」\\n这样的场景似乎重复过很多次。以往是她走向别人，现在是别人走向她。\\n彼时彼刻，那身着银白铠甲的青年站在此处，稚气未脱的脸庞被仇恨和血污浸染。\\n紫裙的少女静默无声，她所行之地，冰冷的死亡会掺杂着幽深的花香。\\n还有一位飞贼像猫儿似的从奥赫玛消失，但她仍当这是场滑稽的恶作剧。\\n那如微光般温暖的女孩，也曾治愈过她的伤痕。\\n还有那异邦的王储，高傲的学者——\\n「如果一根丝线不够，那么就让千千万万根丝线拉起天穹……」\\n她寻找着，牵引着各异的命运之线，将他们连缀为强韧的网，然后，那网会扑向泰坦的火种，令它们在新的世界再度燃烧。\\n「黄金裔们，会一同编织出璀璨夺目的未来。」\\n在等待的间隙，她来到窗边，俯瞰着熙熙攘攘的奥赫玛城。\\n「衣匠，再为我沏一杯热茶吧。」\\n她感到些许寒冷，但她的心已不再为往事的悲伤而悸动。\\n无形的金线自她的指尖向外延展，城邦的脉搏与心跳，风声与雨声，都在她的指尖跃动、颤抖，就像浪漫之神诞下的灵感，孕育着新生命的搏动——\\n她端详已久，终是收起了少女时代裁剪的华服。\\n「哪怕，最后只能身着素衣……」\\n相传每一位「墨涅塔」的信众，往往都会耗费一生的辛劳，向神明献上自己所认为「至美」的作品。\\n她已很久没有编织过美丽的衣物了。\\n但她从未停下过织造命运的脚步。\"},\"relations\":[{\"targetId\":\"5205\",\"targetName\":\"开拓者\",\"targetRouteId\":\"\",\"relation\":\"天外的救世主\",\"description\":\"致开拓者阁下： 我曾为世界的变迭穿针引线，试图编织美好的命运， 我们孤独逐火，直到灰白的光自天外降临； 如今，我难得放下沉重的织机，为自己裁衣， 而你们却又将启程，渐远的行迹让丝线也无法追及。 赠你的饰品并未倾注神性，由我亲手穿制，贴身珍藏； 因我并不想让它变得沉重，而是如一片羽毛停在你的手腕， 点缀你的身体，衬映你的魂灵。 即便是我，也看不见你将踏上的未来，但我会为你祝祈—— 「开拓」为宇宙带来交织如丝弦的星轨， 愿那些银色丝弦，为你引路，因你嗡鸣。 阿格莱雅\",\"avatar\":\"https://act-upload.mihoyo.com/sr-wiki/2025/05/12/193706962/b8a39b3ab7c81ed8e88ca43d6be2f88f_8788668609774406579.png\"},{\"targetId\":\"5851\",\"targetName\":\"昔涟\",\"targetRouteId\":\"cyrene\",\"relation\":\"共同拯救翁法罗斯的伙伴\",\"description\":\"「当那一缕『爱』的丝线编入翁法罗斯的命运，她的每一道注视早已在万载岁月里，穿过我们跳动的心，将彼此的生命连缀成形。」\",\"avatar\":\"https://act-upload.mihoyo.com/sr-wiki/2025/10/24/276833758/e9ed857da6708dab40ec97b9d22343b5_5036078703727400193.png\"}],\"gallery\":[{\"src\":\"/gallery/aglaea/1.webp\",\"alt\":\"阿格莱雅官方画廊 1\",\"width\":2048,\"height\":2048,\"category\":\"角色立绘\"},{\"src\":\"/light-cones/aglaea.webp\",\"alt\":\"阿格莱雅专属光锥 将光阴织成黄金\",\"width\":864,\"height\":1220,\"category\":\"光锥立绘\",\"sourceUrl\":\"https://bbs.mihoyo.com/sr/wiki/content/4887/detail?bbs_presentation_style=no_header\"},{\"src\":\"/gallery/aglaea/4.webp\",\"alt\":\"阿格莱雅官方画廊 4\",\"width\":1091,\"height\":611,\"category\":\"过场动画 悬锋啊，请涤去你的血锈•下2\",\"sourceUrl\":\"https://www.miyoushe.com/sr/article/64533925\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width
