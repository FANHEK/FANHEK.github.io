召唤忆灵「小伊卡」提高全体生命上限的回复型角色\",\"stories\":{\"detail\":\"风堇的祷告先于她的脚步抵达天空。她能治愈伤口，却无法替任何人抹去疼痛留下的记忆。\\n\\n她把破碎的秘境一针一线缝合，像对待将醒之人的梦。春风不只是仁慈，也是一次不容拒绝的重生。\",\"part1\":\"风堇的祷告先于她的脚步抵达天空。她能治愈伤口，却无法替任何人抹去疼痛留下的记忆。\",\"part2\":\"她把破碎的秘境一针一线缝合，像对待将醒之人的梦。春风不只是仁慈，也是一次不容拒绝的重生。\",\"part3\":\"风堇的传说并未止于自身。关于昏光庭院，奥赫玛的记录，仍随着火种与远征被不断重写。\",\"part4\":\"“让风穿过伤口。它知道该带走什么，又该留下什么。”\\n\\n这份选择被后世视为命运织机上最清晰的回声之一。\"},\"verification\":{\"version\":\"3.x\",\"isVerified\":false},\"researchStatus\":\"placeholder\",\"editorialNotes\":[\"当前角色尚未录入完整考据数据。\",\"本页只展示可验证的数据结构，不提供未经确认的神话对应关系。\"],\"prototype\":{\"verification\":{\"version\":\"3.x\",\"isVerified\":false},\"archetype\":\"[待核实: 官方文本]\",\"source\":\"原型来源 [待核实: 官方文本]；在证据补齐前不建立确定映射。\",\"tradition\":\"[待核实: 官方文本]\",\"primaryFigures\":[\"[待核实: 官方文本]\"],\"alternativeFigures\":[],\"narrativeFunction\":\"需要结合角色剧情、技能命名、服饰符号和官方设定文本继续核验。\",\"symbols\":[\"羽翼药圃\",\"蓝天之境\"],\"interpretation\":[\"当前页面保留考据槽位，不将社区推测写成官方结论。\"],\"disputedPoints\":[\"全部神话映射均待官方资料与游戏内文本核验。\"],\"confidence\":\"low\",\"sources\":[{\"id\":\"prototype-source-placeholder\",\"title\":\"[待核实: 官方文本]\",\"kind\":\"official\",\"locator\":\"补充官方前瞻、游戏内档案或开发者说明后替换\",\"confidence\":\"low\"}]},\"designMotifs\":[{\"id\":\"hyacine-feather-medicine\",\"verification\":{\"version\":\"3.x\",\"isVerified\":false},\"category\":\"costume\",\"title\":\"羽翼药圃轮廓\",\"visualDescription\":\"肩部与腰部形成轻羽层叠，白色布料之间嵌入药草与玻璃瓶形状。\",\"culturalOrigin\":\"治愈女神、羽翼信使和古典医师服饰。\",\"meaning\":[\"羽翼让治疗动作具有风的方向感。\",\"药草与瓶器让神圣能力落在具体医疗行为上。\"],\"palette\":[\"#e666a2\",\"#9ee5df\",\"#f7edf2\",\"#493149\"],\"sourceIds\":[\"prototype-source-placeholder\"]},{\"id\":\"hyacine-spring-ribbon\",\"verification\":\"$11:props:record:designMotifs:0:verification\",\"category\":\"ornament\",\"title\":\"春风缎带\",\"visualDescription\":\"长缎带从背后穿出，末端以不规则曲线卷成花瓣和气流轨迹。\",\"culturalOrigin\":\"春季回归仪式和治愈泉水边的献礼丝带。\",\"meaning\":[\"缎带连接角色和天空，提示祝福来自远方。\",\"曲线避免纯白色服装显得僵硬。\"],\"palette\":[\"#e666a2\",\"#77d7d2\",\"#fff0f5\",\"#6e4569\"],\"sourceIds\":[\"prototype-source-placeholder\"]},{\"id\":\"hyacine-rose-mint\",\"verification\":\"$11:props:record:designMotifs:0:verification\",\"category\":\"color\",\"title\":\"花瓣粉与薄荷青\",\"visualDescription\":\"粉色负责身体与情绪温度，薄荷青集中在药品、羽翼和空气高光。\",\"culturalOrigin\":\"春花、药草与晨间雾气的共感色。\",\"meaning\":[\"粉色不让治疗显得冷漠，青色则维持专业克制。\",\"两种颜色交界使用柔和渐变，表现安抚与恢复。\"],\"palette\":[\"#e666a2\",\"#73d5cf\",\"#f8d8e6\",\"#213f46\"],\"sourceIds\":[\"prototype-source-placeholder\"]}],\"relations\":[],\"media\":{\"portrait\":{\"src\":\"/art/hyacine.webp\",\"alt\":\"风堇角色立绘\"},\"splashArt\":{\"src\":\"/art/hyacine.webp\",\"alt\":\"风堇超高清立绘\"},\"divineCard\":{\"src\":\"/art/divine/hyacine.webp\",\"alt\":\"风堇神性铭牌\",\"width\":645,\"height\":1135,\"placeholder\":\"empty\"},\"skillAnimations\":[],\"idleVoice\":[],\"storyVoice\":[],\"ambientVoice\":[],\"gallery\":[]}},\"profile\":{\"name\":\"风堇\",\"title\":\"祭司疗愈天空\",\"rarity\":5,\"city\":\"昏光庭院，奥赫玛\",\"divinePower\":\"「晨昏之眼，艾格勒」…？\",\"combatRole\":\"召唤忆灵「小伊卡」提高全体生命上限的回复型角色\",\"quote\":\"让风穿过伤口。它知道该带走什么，又该留下什么。\",\"stories\":{\"detail\":\"云间城邦随岁月离析，昏光庭院再度敞开门扉，为永夜捎来微光。\\n医师雅辛忒丝，守望「天空」火种的黄金裔。继承先祖的意志，缝补破裂的晨昏\\n——愿虹光洒落，仇怨消融，黎明重回大地。\",\"part1\":\"「可以把翅膀慢慢打开，对…就像我们上次做的那样，配合医生一起深呼吸哦！」\\n「放松一点，没问题的…嗯，翼展变宽啦，你在很努力地吃饭，对不对？」\\n毛茸茸的脑袋被烛光衬得暖烘烘的，女孩抱起小马，轻轻地放在体重秤上。\\n「放心吧，很快你就能和其他翼兽长得一样又高又壮的，嗯？」\\n戴上听诊器，女孩开始各项检查，她触碰到小马肋下新的「伤口」。\\n「你受伤了？」\\n她摩挲着小马的翅膀，小心翼翼地将棉花塞进松落的裂口，又取出针线。\\n「会有一点疼，但别担心，我扎针很稳……\\n「你又拼命训练了吗？是因为有很多人和你说，你的母亲，祖母，还有好多厉害的先辈，一个腾飞就能飞到天上，一个冲撞便能撞碎岩石？\\n「大家期待你会成为如雷霆一样的英雄，可不管训练多久，你好像都只能让他们失望……\\n「就好像…你和他们完全不一样……」\\n小马一动不动，黑溜溜的眼珠看着窗外。\\n划破天幕的雷鸣仍在远空回荡，那是天空城邦的英雄与他们的翼兽掀起的风暴。\\n「偷偷告诉你一个秘密…我和你一样……」\\n在那孤独昏暗的病房，养病已久的女孩抱着玩偶，拿着针线，第一百次演练父亲教习的医术——\\n「但也许…不一样的光芒，也有它存在的意义……」\",\"part2\":\"同其他医者一样，女孩许下治愈所有人的愿望。\\n她想抚慰世界倾覆下凡人的惨痛，可当黑潮将城邦吞没，瘟疫包围重伤的人群，她只能驱散疫病，而无法停止绝望的蔓延。\\n「或许，一名好的医师，需要的远不止灵验的药草……」\\n「乳色的窗帘要能透光，床要软硬适中，床头摆好新鲜的花束…这样在房间里也能看到和外面一样的『色彩』……」\\n她想为末世中的人们带来希望，一缕从未来照入的光。\\n于是伴着安神的香薰，一位弥留之际的少女在温暖舒适的房间中喃喃自语，尘封许久的记忆慢慢复苏。\\n「爸爸送我八音盒的那天，外面也下着淅淅沥沥的小雨。我听着叮叮当当的旋律，在滴滴答答的雨声中度过了最美好的生日……\\n「我还记得，白玫瑰开满了街道，刮风的时候，就像在下一场香气扑鼻的大雪……\\n「还有那片天空，越来越深的蓝色中落着一点橙红…」她回忆着，「然后那些透明的泡泡环绕着我，就像……\\n就像现在一样……」\\n滴答，滴答——\\n时针在回忆中走动，叙说的声音逐渐低弱。\\n那流动不息的雨声中，只余一声满足的叹息。\\n「嘟嘟……」小伊卡低垂着头，懊丧地趴在小马玩偶旁。\\n「小伊卡，听到了嘛…她看到了我们创造的天空呢……」\\n房间的天花板上，夕阳落入海中。\\n她握着少女逐渐冰冷的手，晶莹的眼泪滑过脸庞。\\n「以后，我们一定能把它变得更宽广，更温暖……」\\n「嘟！」\",\"part3\":\"奥赫玛，英雄汇聚之地，末世最后的希望所在。\\n「逐火之旅」，「火种」，「泰坦」…即便已熟悉那些酷烈灼热的名词，当别人称她为英雄时，她仍是挥挥手。\\n「我只是一名医师而已。」\\n她对每个来到庭院的人都那么说。\\n悲伤的少女来询问那被死亡之泰坦波及的「顽疾」。\\n「蝶宝，那才不是病呢！你还有很多事可以尝试！」\\n她常常和少女一同观鸟观星，制作标本和奇美拉玩偶。看到少女脸上的笑容，她也会感到温暖。\\n她知晓冷冽的织者和高傲的学者之间的不和。\\n在那崭新的调解室，她为织者准备了最爱的燕麦粥，学者批改论文时必备的气泡山葵醋，并请来资历最老的半神——\\n「如果他们不来，我就…派小伊卡天天在他们耳边嘟嘟嘟！」\\n她在昏光庭院播下石榴的种子，种下一方麦草，开辟一片花海，让每一位从远方来到奥赫玛的异乡人，都能在此放下心结，畅所欲言。\\n「希望点滴的善意，能消融族群之间长久的心病。」\\n她总放心不下那不断磨损的半神。\\n「小风堇…踏上逐火之旅的第一天，*我们*就已经想到这一天啦……」\\n她们总是如此说。\\n「即便能为你们减少一丝痛苦也好…我再去树庭的图书馆查查资料吧……」\\n她也总是如此做。\\n……\\n天空的后裔，悬锋的族人，奥赫玛的原贵族，哀地里亚的圣女，哀丽秘榭的战士，雅努萨波利斯的圣女…小小的庭院中，各色融汇成一道虹光。\\n但闲暇的片刻，她也会想到旅途的尽头。\\n「到那时候，我…还能做些什么呢？」\",\"part4\":\"「『光历████年，机缘月』风堇医师\\n展信佳。虽然当年姐姐没能挺过来，但姐姐最后在庭院度过的时光…她临走前的微笑一直温暖着我的梦境。我想跟您说，今天我也正式成了一名医师，我想像您一样，去帮助那些在末世中煎熬的人们，希望在这长夜中，我也能成为一盏小小的灯……」\\n「『光历████年，门关月』堇宝\\n…真的很感谢你这段时间的陪伴。当我蜷缩在昏光庭院治疗室的时候，你允许我的悲伤像积雨一样堆积又蒸发，当我说自己『天气不好』时，你又完整地包容了我…或许，我也应该更勇敢一点……」\\n「『光历████年，自由月』风堇女士\\n小家伙们都恢复得很好，特别是那位上次吵着要喝石榴汁的奥赫玛小战士。城邦间的宿仇很难很快消除，但我现在相信，不同的色彩也能共存。」\\n「『光历████年，长夜月』风堇助教\\n感谢你执着的提醒，我会考虑和她缓和关系。当然，完全是看在你的面子上……」\\n「『光历████年，哀悼月』风堇小姐\\n不必费心为我寄来新的药剂了，我自知人性的流失已无法挽回。你也不必担心，我们与树庭的关系并非降至冰点……」\\n「『光历████年，欢喜月』风堇女士\\n我从来没有想过，家乡的麦种能有一天重新发芽。躺在昏光庭院的花园，又像是回到了哀丽秘榭一样。每次心情低落的时候，闻闻这里的麦香，我就又有干劲了！」\\n「『光历████年，长昼月』小风堇\\n人们总称赞以前包容烈阳与惊雷的天空，*我们*却觉得你比那样的天空更温柔。无论*我们*明天将去向何处，*我们*一定会永远、永远记得你！」\\n从满溢的箱中露出的几封信件，被珍藏在诊疗记录册旁。\\n在旅程之初，女孩微弱的光似乎旋即会被黑暗吞没，然而在启程成为明日的天空前——\\n在她走过的地方，晴空早已不知不觉绽开了第一缕笑颜。\"},\"relations\":[{\"targetId\":\"5205\",\"targetName\":\"开拓者\",\"targetRouteId\":\"\",\"relation\":\"来自天外的伙伴\",\"description\":\"致亲爱的灰宝： 与你一同，我们撕裂了旧神笼盖的天穹， 此世的人类迎来了晴空，还有久违的彩虹。 这都是因为你的努力。一直要拯救大家的救世主，是你—— 灰宝，你太棒了！值得最好的礼物！ 我想赠你晨间洒下的曙光，可我担心它太过暗淡，难以照亮幽邃的深空； 我想赠你晨间奔涌的清风，可它一旦被装进玻璃瓶，便不会再自由流淌。 后来是小伊卡在一旁蹭着我，才让我想到—— 我要把这枚一直别在腰间的挂坠送给你！ 如果说小伊卡像棉花一样柔软，那这枚挂坠就像一颗…棉花糖？ 光是看着就让人甜丝丝的，让人记起我们一同度过的时光… 所以我想，要是你把它别在腰间， 便能一直感受到天空的温暖，我带来的温暖。 那么，就愿我的礼物在你身边永远摇荡，带来微风与曦光， 为你的旅途守护可爱的记忆，还有治愈的铃音。 雅辛忒丝\",\"avatar\":\"https://act-upload.mihoyo.com/sr-wiki/2025/05/12/193706962/b8a39b3ab7c81ed8e88ca43d6be2f88f_8788668609774406579.png\"},{\"targetId\":\"5851\",\"targetName\":\"昔涟\",\"targetRouteId\":\"cyrene\",\"relation\":\"共同拯救翁法罗斯的伙伴\",\"description\":\"「我猜，昔涟一定也很喜欢亮晶晶的事物…因为她总是那么喜欢望着天上的星星，你说是吗，小伊卡？嗯！她一定也很喜欢软乎乎的你~」\",\"avatar\":\"https://act-upload.mihoyo.com/sr-wiki/2025/10/24/276833758/e9ed857da6708dab40ec97b9d22343b5_5036078703727400193.png\"}],\"gallery\":[{\"src\":\"/gallery/hyacine/1.webp\",\"alt\":\"风堇官方画廊 1\",\"width\":2048,\"height\":2048,\"category\":\"角色立绘\"},{\"src\":\"/light-cones/hyacine.webp\",\"alt\":\"风堇专属光锥 愿虹光永驻天空\",\"width\":864,\"height\":1220,\"category\":\"光锥立绘\",\"sourceUrl\":\"https://bbs.mihoyo.com/sr/wiki/content/5380/detail?bbs_presentation_style=no_header\"}]}}]\n"])</script><script>self.__next_f.push([1,"17:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#05070d\"}],[\"$\",\"meta\",\"3\",{\"name\":\"color-scheme\",\"content\":\"dark\"}]]\n13:null\n"])</script><script>self.__next_f.push([1,"1c:I[622,[],\"IconMark\"]\n"])</script><script>self.__next_f.push([1,"15:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"风堇 | 黄金裔档案\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"风堇的城邦、神权、定位与角色故事。\"}],[\"$\",\"meta\",\"2\",{\"name\":\"author\",\"content\":\"Amphoreus Concept Archive\"}],[\"$\",\"meta\",\"3\",{\"name\":\"keywords\",\"content\":\"翁法罗斯,黄金裔,崩坏星穹铁道,WebGL,互动概念站\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:title\",\"content\":\"翁法罗斯 | 黄金裔命运织机\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:description\",\"content\":\"世界以火种记忆，以命运相连。\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:locale\",\"content\":\"zh_CN\"}],[\"$\",\"meta\",\"7\",{\"pro
