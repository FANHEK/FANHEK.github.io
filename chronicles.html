od-heirs\",\"order\":2,\"title\":\"黄金血脉与泰坦火种\",\"summary\":\"泰坦权能与十二道火种成为黄金裔继承神权的媒介。继承火种意味着获得半神之力，也意味着承担对应神职和代价。\",\"location\":\"翁法罗斯\",\"keyFigures\":[\"黄金裔\"],\"deities\":[\"十二泰坦\"],\"factionIds\":[\"titans\",\"golden-heirs\"],\"sourceIds\":[\"official-twelve-titans\"],\"verification\":\"$0:f:0:1:2:children:2:children:1:props:children:0:props:timeline:verification\"}],\"sourceIds\":[\"official-twelve-titans\"],\"verification\":\"$0:f:0:1:2:children:2:children:1:props:children:0:props:timeline:verification\"},{\"id\":\"golden-age\",\"order\":2,\"name\":\"黄金纪\",\"subtitle\":\"万邦毗邻的古老年代\",\"eraRange\":\"黑潮全面爆发以前\",\"summary\":\"黄金年代曾有许多城邦并存，包括奥赫玛、雅努萨波利斯、神悟树庭、悬锋城、斯缇科西亚和哀地里亚。\",\"status\":\"historical\",\"themeColor\":\"#f0cf78\",\"events\":[{\"id\":\"city-states-flourish\",\"order\":1,\"title\":\"地上万邦形成\",\"summary\":\"各城邦围绕泰坦神权与地域传统发展出不同制度：奥赫玛成为永恒圣城，雅努萨波利斯供奉门径，悬锋城崇尚纷争，斯缇科西亚与海洋神权相连。\",\"location\":\"翁法罗斯诸城邦\",\"keyFigures\":[\"城邦诸王\",\"黄金裔\"],\"deities\":[\"刻法勒\",\"雅努斯\",\"尼卡多利\",\"法吉娜\"],\"factionIds\":[\"titans\",\"golden-heirs\"],\"sourceIds\":[\"official-titan-cities\"],\"verification\":\"$0:f:0:1:2:children:2:children:1:props:children:0:props:timeline:verification\"},{\"id\":\"first-golden-war\",\"order\":2,\"title\":\"黄金战争与奥赫玛围城\",\"summary\":\"光历3867年，吕奎亚、伊卡利亚与科林斯组成联军围攻奥赫玛。海瑟音率不明军队救援圣城，刻律德菈随后入主奥赫玛，以强力手段肃清元老院。\",\"location\":\"奥赫玛\",\"sourceLocator\":\"第一次逐火之旅史（残卷）\",\"keyFigures\":[\"刻律德菈\",\"海瑟音\"],\"deities\":[\"塔兰顿\",\"法吉娜\"],\"factionIds\":[\"golden-heirs\"],\"sourceIds\":[\"official-first-flame-history\"],\"verification\":\"$0:f:0:1:2:children:2:children:1:props:children:0:props:timeline:verification\"}],\"sourceIds\":[\"official-titan-cities\",\"official-first-flame-history\"],\"verification\":\"$0:f:0:1:2:children:2:children:1:props:children:0:props:timeline:verification\"},{\"id\":\"first-flame-journey\",\"order\":3,\"name\":\"第一次逐火之旅\",\"subtitle\":\"猎杀泰坦，夺取火种\",\"eraRange\":\"黄金战争结束以后\",\"summary\":\"刻律德菈宣称践行刻法勒神谕中的再创世，组建逐火军猎杀泰坦、夺取火种。远征最终失败，奥赫玛政局由阿格莱雅重新稳定。\",\"status\":\"historical\",\"themeColor\":\"#c98d3f\",\"events\":[{\"id\":\"first-flame-army-formed\",\"order\":1,\"title\":\"逐火军集结\",\"summary\":\"战士、学者、祭司与冒险家响应刻律德菈的号召，从各地云集奥赫玛，组成第一次逐火之旅的远征军。\",\"location\":\"奥赫玛\",\"keyFigures\":[\"刻律德菈\",\"海瑟音\",\"第一次逐火军\"],\"deities\":[\"刻法勒\"],\"factionIds\":[\"golden-heirs\"],\"sourceIds\":[\"official-first-flame-history\"],\"verification\":\"$0:f:0:1:2:children:2:children:1:props:children:0:props:timeline:verification\"},{\"id\":\"first-flame-failure\",\"order\":2,\"title\":\"逐火失败与阿格莱雅执政\",\"summary\":\"第一次逐火之旅遭遇惨败，刻律德菈从公众视野中消失。阿格莱雅拨乱反正，被元老院推举为执政官，并延续至今。\",\"location\":\"奥赫玛\",\"keyFigures\":[\"阿格莱雅\",\"刻律德菈\"],\"deities\":[\"墨涅塔\",\"塔兰顿\"],\"factionIds\":[\"golden-heirs\"],\"sourceIds\":[\"official-first-flame-history\"],\"verification\":\"$0:f:0:1:2:children:2:children:1:props:children:0:props:timeline:verification\"}],\"sourceIds\":[\"official-first-flame-history\"],\"verification\":\"$0:f:0:1:2:children:2:children:1:props:children:0:props:timeline:verification\"},{\"id\":\"calamity-age\",\"order\":4,\"name\":\"灾厄期\",\"subtitle\":\"黑潮吞没万邦，泰坦堕入疯狂\",\"eraRange\":\"黄金纪末期\",\"summary\":\"黑潮自边境蔓延并吞没绝大多数城邦，生灵异化，泰坦相继疯狂。奥赫玛成为长夜中仅存的永昼之地。\",\"status\":\"cataclysm\",\"themeColor\":\"#8d2034\",\"events\":[{\"id\":\"black-tide-advances\",\"order\":1,\"title\":\"黑潮吞没地上万邦\",\"summary\":\"黑潮从边境向大陆腹地推进，城邦在一朝一夕间被吞噬，幸存者流离失所。黄金裔开始在各城邦之间奔走，试图令世人团结。\",\"location\":\"翁法罗斯全境\",\"keyFigures\":[\"缇宝\",\"黄金裔\"],\"deities\":[\"欧洛尼斯\",\"雅努斯\"],\"factionIds\":[\"golden-heirs\"],\"sourceIds\":[\"official-titan-cities\",\"official-first-flame-history\"],\"verification\":\"$0:f:0:1:2:children:2:children:1:props:children:0:props:timeline:verification\"},{\"id\":\"kephale-protects-okhema\",\"order\":2,\"title\":\"刻法勒负日擎天\",\"summary\":\"危难中，刻法勒负日擎天，以圣城为中心保住一方光明。若要重塑破碎世界，英雄仍须搜集古老泰坦的火种。\",\"location\":\"奥赫玛\",\"keyFigures\":[\"刻法勒\"],\"deities\":[\"刻法勒\"],\"factionIds\":[\"titans\",\"golden-heirs\"],\"sourceIds\":[\"official-titan-cities\"],\"verification\":\"$0:f:0:1:2:children:2:children:1:props:children:0:props:timeline:verification\"}],\"sourceIds\":[\"official-titan-cities\",\"official-first-flame-history\"],\"verification\":\"$0:f:0:1:2:children:2:children:1:props:children:0:props:timeline:verification\"},{\"id\":\"trailblaze-age\",\"order\":5,\"name\":\"开拓纪\",\"subtitle\":\"星穹列车迫降翁法罗斯\",\"eraRange\":\"第二次逐火之旅\",\"summary\":\"星穹列车遭来源不明的袭击并迫降翁法罗斯。开拓者与黄金裔相遇，卷入尼卡多利、悬锋城、神悟树庭和泰坦火种归还等一系列事件。\",\"status\":\"current\",\"themeColor\":\"#61d5df\",\"events\":[{\"id\":\"express-crash\",\"order\":1,\"title\":\"列车迫降与黄金裔初遇\",\"summary\":\"列车车厢在翁法罗斯迫降。丹恒与开拓者遇到缇宝与白厄，并在前往奥赫玛途中直面纷争泰坦尼卡多利的袭击。\",\"location\":\"翁法罗斯边境神殿\",\"keyFigures\":[\"开拓者\",\"丹恒\",\"缇宝\",\"白厄\"],\"deities\":[\"尼卡多利\"],\"factionIds\":[\"golden-heirs\"],\"sourceIds\":[\"official-trailblaze-log-1\"],\"verification\":\"$0:f:0:1:2:children:2:children:1:props:children:0:props:timeline:verification\"},{\"id\":\"nikador-campaign\",\"order\":2,\"title\":\"悬锋城与尼卡多利之战\",\"summary\":\"开拓者与白厄、万敌、遐蝶前往悬锋城，发现尼卡多利锻造不死神躯。众人重返悬锋往世，令五瓣神魂归位，最终击败尼卡多利并归还纷争火种。\",\"location\":\"悬锋城、命运重渊\",\"keyFigures\":[\"万敌\",\"白厄\",\"遐蝶\",\"开拓者\"],\"deities\":[\"尼卡多利\",\"欧洛尼斯\"],\"factionIds\":[\"golden-heirs\",\"titans\"],\"sourceIds\":[\"official-trailblaze-log-1\"],\"verification\":\"$0:f:0:1:2:children:2:children:1:props:children:0:props:timeline:verification\"},{\"id\":\"grove-crisis\",\"order\":3,\"title\":\"神悟树庭覆灭危机\",\"summary\":\"开拓者、缇安与遐蝶前往神悟树庭，发现树庭被黑潮造物侵袭。那刻夏留下炼金线索，众人护送瑟希斯火种并对抗无名黑袍剑士。\",\"location\":\"神悟树庭\",\"keyFigures\":[\"那刻夏\",\"缇宝\",\"遐蝶\",\"开拓者\"],\"deities\":[\"瑟希斯\"],\"factionIds\":[\"golden-heirs\"],\"sourceIds\":[\"official-trailblaze-log-1\"],\"verification\":\"$0:f:0:1:2:children:2:children:1:props:children:0:props:timeline:verification\"}],\"sourceIds\":[\"official-trailblaze-log-1\"],\"verification\":\"$0:f:0:1:2:children:2:children:1:props:children:0:props:timeline:verification\"},{\"id\":\"final-recreation\",\"order\":6,\"name\":\"再创世前夜\",\"subtitle\":\"最后的火种与忆潮中的归途\
